<!doctype html>
<!--
  多页签宿主页（shell）：经自定义协议 shell://localhost/ 提供，仅 Windows 多页签模式使用。
  · 本页只渲染顶部标签栏，不承载网页内容；真正的网页在各自独立的 tab 窗口中。
  · 标签栏高度必须与 src/tabs.rs 的 TAB_BAR_HEIGHT（38px）一致，否则 tab 内容会与标签栏重叠/留缝。
  · 通过 Tauri IPC 与 Rust 交互：switch_tab / close_tab / get_tabs /
    minimize_host / close_host / open_settings（设置按钮；新建 tab 改由页面内 target="_blank" 触发）。
    注意：tab 的真实标题不是本页调命令回传的——远程 tab 页面只能发核心事件
    web2app:tab-title（应用命令对远程 origin 必被 ACL 拒），见 src/tab_title.js。
  · 宿主窗口是 decorations(false)，系统标题栏不存在 → 设置 / 最小化 / 关闭按钮由本页右侧自绘。
  · Rust 侧通过 window.__web2appTabs.render(items) 推送 tab 列表（含激活态）刷新。
-->
<html lang="zh-CN" data-page-node-id="JIII7qWwDRGwHRqbGIOito">
  <head data-page-node-id="lnd3TOd3uomPf1dS2i51hw">
    <meta charset="utf-8" data-page-node-id="KUHL4bGzOrdP9xlnFoHztd" />
    <meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="7eJOBrRgSka4xtygB6lRQq" />
    <title>标签栏</title>
    <style>
      :root {
        --bar-h: 38px;
        --bg: #f7f8fa;
        --bg-dark: #14181f;
        --tab-bg: transparent;
        --tab-active: #ffffff;
        --tab-active-dark: #2a3340;
        --border: #e3e6ea;
        --border-dark: #2c3440;
        --text: #2c3440;
        --text-dark: #e6ebf2;
        --muted: #8892a0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: var(--bg-dark); color: var(--text-dark); }
      }
      .bar {
        display: flex;
        align-items: stretch;
        height: var(--bar-h);
        -webkit-app-region: drag; /* 让标签栏空白处可拖动窗口（无边框窗口） */
      }
      .tabs {
        display: flex;
        align-items: stretch;
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        min-width: 0;
        /* 标签条空白处也可拖动窗口（标签自身 no-drag）。 */
        -webkit-app-region: drag;
      }
      .tab {
        -webkit-app-region: no-drag; /* 标签本身可点击，不参与拖动 */
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        max-width: 180px;
        min-width: 60px;
        cursor: pointer;
        border-right: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        position: relative;
      }
      @media (prefers-color-scheme: dark) {
        .tab { border-right-color: var(--border-dark); }
      }
      .tab .label {
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .tab.active {
        background: var(--tab-active);
        color: var(--text);
      }
      @media (prefers-color-scheme: dark) {
        .tab.active { background: var(--tab-active-dark); color: var(--text-dark); }
      }
      .tab .close {
        -webkit-app-region: no-drag;
        width: 16px; height: 16px;
        line-height: 16px;
        text-align: center;
        border-radius: 4px;
        font-size: 12px;
        color: var(--muted);
        flex: none;
      }
      .tab .close:hover {
        background: rgba(0,0,0,0.08);
        color: var(--text);
      }
      @media (prefers-color-scheme: dark) {
        .tab .close:hover { background: rgba(255,255,255,0.12); color: var(--text-dark); }
      }
      /* 窗口控制按钮（宿主窗口 decorations(false)，标题栏自绘：最小化 / 关闭） */
      .win {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: stretch;
        flex: none;
        border-left: 1px solid var(--border);
      }
      @media (prefers-color-scheme: dark) {
        .win { border-left-color: var(--border-dark); }
      }
      .win-btn {
        -webkit-app-region: no-drag;
        width: 44px;
        height: var(--bar-h);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        cursor: pointer;
      }
      .win-btn svg { display: block; }
      .win-btn:hover { background: rgba(0, 0, 0, 0.07); color: var(--text); }
      @media (prefers-color-scheme: dark) {
        .win-btn:hover { background: rgba(255, 255, 255, 0.12); color: var(--text-dark); }
      }
      /* 关闭按钮 hover 用系统级红底白字（Windows 习惯），提醒这是个破坏性操作。 */
      .win-btn.close-win:hover { background: #e81123; color: #ffffff; }
      /* 前进/后退按钮（标题栏左侧，紧贴标签栏） */
      .nav {
        -webkit-app-region: no-drag; /* 按钮可点击，不参与拖动 */
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 6px;
        flex: none;
        border-right: 1px solid var(--border);
      }
      @media (prefers-color-scheme: dark) {
        .nav { border-right-color: var(--border-dark); }
      }
      .nav-btn {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        flex: none;
      }
      .nav-btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }
      @media (prefers-color-scheme: dark) {
        .nav-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-dark); }
      }
      /* 悬停提示：与单窗口 titlebar.js 的 data-tip tooltip 同款（纯 CSS，替代原生 title 的
       * 延迟与样式不可控）。按钮需 position:relative，伪元素挂到按钮下沿。 */
      .win-btn, .nav-btn { position: relative; }
      .win-btn[data-tip]::after, .nav-btn[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        transform: translate(-50%, -2px);
        white-space: nowrap;
        padding: 3px 8px;
        border-radius: 4px;
        background: rgba(30, 35, 44, 0.94);
        color: #fff;
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.12s ease, transform 0.12s ease, visibility 0s linear 0.18s;
        transition-delay: 0s, 0s, 0.35s;
        z-index: 2147483647;
      }
      .win-btn[data-tip]:hover::after, .nav-btn[data-tip]:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition-delay: 0s, 0s, 0s;
      }
      @media (prefers-color-scheme: dark) {
        .win-btn[data-tip]::after, .nav-btn[data-tip]::after {
          background: rgba(238, 241, 246, 0.96);
          color: #1f2530;
        }
      }
    </style>
  </head>
  <body data-page-node-id="ok8jltRgEaIQw7abMofPsm">
    <div class="bar" data-page-node-id="WjskdykZvV2Rc1L9k4HDQs">
      <div class="nav" data-page-node-id="RLhAVr5hL8x4I0fqBX6cBR">
        <button type="button" class="nav-btn" id="back" data-tip="后退" data-page-node-id="09J1yHRpS3jJA1V5kG8ojO">←</button>
        <button type="button" class="nav-btn" id="fwd" data-tip="前进" data-page-node-id="fZEej0vvDaXThKeqP014Mt">→</button>
      </div>
      <div class="tabs" id="tabs" data-page-node-id="TDPnkUkXLZCnbhAH8vXIDB"></div>
      <!-- 自绘窗口按钮：宿主窗口 decorations(false)，没有系统标题栏，必须自己提供。
           「设置」紧挨最小化**左侧**，与单窗口模式 titlebar.js 的同名按钮位置一致
           （⚙ 不属于窗口控制，但紧挨那一簇按钮；位置由 Electron 探针按几何钉住）。

              这条命令与 titlebar.js 那边不同：远程页面只能用 event 命令（见 titlebar.js）。 -->
      <div class="win" data-page-node-id="4c1EakNzINA6jx5On2ZTWG">
        <button type="button" class="win-btn" id="settings" data-tip="设置" aria-label="设置" data-page-node-id="W2aSetBtn0PeNq3HqzM1Vu">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-page-node-id="W2aSetIcoQ7xLm2RdT9pKs">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" data-page-node-id="W2aSetPatH5rNv8KcQ2jLx" />
          </svg>
        </button>
        <button type="button" class="win-btn" id="min" data-tip="最小化" aria-label="最小化" data-page-node-id="HE1ESqr3C2a3CAfLATNjQ4">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" data-page-node-id="EnMHy0trtmGKFRSoiBmDsn">

          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" data-page-node-id="wBAtaGhMXAiFC3Tp3hNIfi">
            <path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1" fill="none" data-page-node-id="HmPoN7FqSrlHtn3yoHp8Tu" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      // IPC 桥：优先使用 Tauri 底层注入的 __TAURI_INTERNALS__.invoke（自定义协议页 settings://
      // 同样用它，稳定可用），其次 __TAURI__.core.invoke（withGlobalTauri）。两种都拿不到时
      // 降级为“恒拒绝”，配合各调用的 catch 静默失败，避免抛错中断标签栏渲染。
      const invoke =
        (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) ||
        (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) ||
        (() => Promise.reject(new Error("Tauri IPC 不可用")));

      const tabsEl = document.getElementById("tabs");

      // 当前 tab 列表（由 render() 维护）
      let items = [];

      function render(nextItems) {
        items = Array.isArray(nextItems) ? nextItems : [];
        tabsEl.innerHTML = "";
        items.forEach((t) => {
          const el = document.createElement("div");
          el.className = "tab" + (t.active ? " active" : "");
          el.dataset.label = t.label;

          const label = document.createElement("span");
          label.className = "label";
          label.textContent = t.title || t.label;
          label.title = t.title || t.label;

          const close = document.createElement("span");
          close.className = "close";
          close.textContent = "×";
          close.title = "关闭页签";

          el.appendChild(label);
          el.appendChild(close);
          tabsEl.appendChild(el);
        });
      }

      // 事件委托：切换 / 关闭
      tabsEl.addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (!tab) return;
        const label = tab.dataset.label;
        if (e.target.classList.contains("close")) {
          invoke("close_tab", { label });
        } else {
          invoke("switch_tab", { label });
        }
      });

      // 窗口控制：最小化 / 设置 / 关闭（关闭走 Rust 侧「托盘隐藏 or 退出」的统一语义）。
      // 新建页签的「+」按钮已移除——新 tab 由页面内 target="_blank" / window.open() 触发。
      document.getElementById("min").addEventListener("click", () => {
        invoke("minimize_host").catch(() => {});
      });
      // 设置：本页是本地页面，直接 invoke 应用命令（远程页面不行，那条路见 titlebar.js）。
      document.getElementById("settings").addEventListener("click", () => {
        invoke("open_settings").catch(() => {});
      });
      document.getElementById("closeHost").addEventListener("click", () => {
        invoke("close_host").catch(() => {});
      });

      // 前进 / 后退：控制【当前激活 tab】的 webview 历史（history_nav 由 Rust 定位目标窗体）。
      document.getElementById("back").addEventListener("click", () => {
        invoke("history_nav", { direction: "back" }).catch(() => {});
      });
      document.getElementById("fwd").addEventListener("click", () => {
        invoke("history_nav", { direction: "forward" }).catch(() => {});
      });

      // 初始化：拉取当前 tab 列表
      invoke("get_tabs").then((list) => {
        render(list.map(([label, title, active]) => ({ label, title, active })));
      }).catch(() => {});

      // 暴露给 Rust：Rust 侧 push_tabs_to_shell 会调用 window.__web2appTabs.render(items)
      window.__web2appTabs = { render };
    </script>
  </body>
</html>

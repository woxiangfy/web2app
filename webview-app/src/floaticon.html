<!DOCTYPE html>
<!--
  web2app 桌面悬浮图标（悬浮球）页面 —— 双壳单一真源（v1.81 起实际仅 Electron 使用）
  ---------------------------------------------------------------------------
  这是悬浮球窗口加载的**唯一**本地内置页面。v1.81 起球的观感彻底脱离「浏览器 CSS 画圆」：
  盘面（平涂底盘 + 1px 半透明描边 + 软件图标）由 canvas 超采样栅格化成**一张带 alpha 的
  位图**，以 data URL 作 background-image 上屏 —— 浏览器只做位图贴图，不再做任何圆角
  裁剪 / 渐变 / 合成滤镜（CSS 画圆的三源毛刺全部消除，见下方「为什么不用 CSS 画圆」）。
  Tauri 侧已改原生分层窗口 + 位图 alpha、不再加载本页（架构例外另行登记）；本页仍由
  floaticon://localhost/ 同一处资源分发。

  ⚠️⚠️ 球的直径**必须等于窗口边长**（56 = ICON_SIZE_LOGICAL = DEFAULT_FLOAT_W），不能留边：
  球窗命中圆（Electron setShape 扫描线圆）、canvas 位图圆盘、窗口客户区三者严格等大
  （v1.77b 真机根因：球小于命中圆 ⇒ 圆内球外一圈透明环带漏残片；守卫
  float_page_ball_fills_the_live_pillar / Electron float-contract.test.ts 同款钉住）。

  职责（交互协议不变）：
    1. 单击（没有发生拖动的 pointerup）→ 通知主进程「切换【原来的主窗口】显隐」
       （v1.71：由「只显示」改为 toggle —— 可见则隐藏、隐藏则显示并聚焦）；
    2. 按住拖动 → 上报指针的**屏幕绝对坐标**（screenX/screenY，CSS 像素），窗口位置由主进程
       按「光标 − 抓取点偏移」计算（v1.70 修正：旧实现上报相对本窗视口的坐标增量，
       而窗口每帧都在移动，下一帧增量被窗口自身位移抵消，球只有半速跟手且抖动）；
    3. 松手报 dragend → 主进程判定四缘（左 / 右 / 上 / 下）吸附并半隐藏（只露半球，
       peek = 28 逻辑像素；左 / 右沿 x 半隐藏，上 / 下沿 y 半隐藏），悬停展开、移开缩回；
    4. 右键 → **关闭悬浮图标功能**并唤回主窗口（v1.76）：页面只发 `hide` 事件，主进程
       把设置里的 `float_enabled` 置 false 并落盘、**销毁**球窗、并把主窗口显示出来
       （若此前被隐藏）。⚠️ 不能再做成「只隐藏球」——球窗一藏，若用户没启用托盘、
       主窗又是关窗驻留隐藏着的，桌面上就再也没有任何入口（进程还在跑却唤不出窗口，
       2026-10-11 使用者实测）。托盘菜单的「悬浮图标」项仍是临时显隐 toggle，
       Alt+F4 关球窗仍只隐藏，两者都不改设置。

  球内图标是**软件自己的图标**（v1.71，不再是统一的硬编码图形）：相对路径 icon.png
  —— 经 floaticon://localhost/icon.png 分发同一份 icons/icon.png（开发态直接读
  webview-app/icons/，打包态由 stage-assets.cjs 铺到 out/inject/ 后由协议处理器读出）。
  v1.81 起它只作 canvas 的绘制源（drawImage 烘进盘面位图），不再独立叠层（img 元素本身
  隐藏，见 `#w2f-ball img` 规则）。

  为什么不用 CSS 画圆（v1.81 根治；四代失败方案存档，都不要再试）：
    · 毛刺源① 透明窗上圆角裁剪的抗锯齿（Chromium 对白底合成再套 alpha 掩码 → 白边 / 毛刺）；
    · 毛刺源② 合成滤镜 / 渐变 / 外阴影的强制合成层与渐变抖动；
    · 毛刺源③ 百分比平移定位在非整数 DPI 下落到分数物理像素（阶梯毛刺）。
    · v1.77b SetWindowRgn 严格裁圆：1bit 硬边切掉抗锯齿，白锯齿；
    · v1.78 区域四边外扩 4px：旧透明链路把半透明像素压平白底，环带漏浅色异形；
    · v1.79 页面铺黑底绕过坏 alpha：异形没了但轮廓仍是整像素阶梯，暗锯齿；
    · v1.80 真逐像素 alpha 只解决了「窗口侧」，页面侧 CSS 画圆的三源毛刺仍在浏览器内。
    v1.81 页面侧同标准收口：`#w2f-ball` 规则里不再出现任何合成滤镜 / 半透明 / 变形 /
    圆角 / 渐变类属性，状态差异（悬停 / 拖动 / 半隐藏）全部来自 background-image 换图
    （idle / hover / collapsed 三套预渲染位图变体），并按 devicePixelRatio 整数物理像素
    对齐（位图圆盘绝不落在分数物理像素上）。

  ⚠️ 球上**不挂原生提示**（不给球写 title，v1.73）：球窗是 always-on-top，而 Chromium /
  系统的原生提示条是**独立的非置顶窗口** ⇒ 提示条只会被画在球窗**之后**，从球窗的透明环带
  （圆内、球本体之外的区域）漏出一块浅色残片，看起来就像「图标背景上有异样图形」。
  2026-10-11 真机截图 + Electron 复刻本页（同一份 floaticon.html）双重取证坐实。
  作用说明改由 aria-label 承载（读屏可见）；守卫见 `contract_tests::float_window_contract`
  的 `float_ball_has_no_native_tooltip` 与 Electron 侧 `test/float-contract.test.ts` 同款。

  ⚠️ 它是「切换主窗口显隐的快捷入口」，不是第二个浏览器窗：窗口透明、无导航、无远程内容。

  桥接方式：Electron 探测 window.web2app 白名单方法，Tauri 走 __TAURI_INTERNALS__ 的
  plugin:event|emit；事件 payload 带建窗时注入主框架的一次性令牌 window.__web2appFloatToken。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* 窗口本身透明；半隐藏时被平移到屏外的一半接不到指针。 */
  }
  /* ⚠️ body 只有这一条规则：必须保持真透明（守卫
     float_page_and_init_script_stay_truly_transparent 钉着）。不要再加任何「按壳铺底 /
     诊断色块」类规则 —— 双壳共用同一份页面，任何写死的壳标记都会误伤另一壳。 */
  #w2f-ball {
    position: absolute;
    /* 契约字面量：球心在左起 28px = ICON_SIZE_LOGICAL/2。⚠️ 这个 28 与 PEEK_LOGICAL=28
       数值相同但含义无关，两壳契约守卫按 ICON/2 钉住，改 ICON_SIZE_LOGICAL 必须同步这里。
       v1.81 起真实几何由渲染脚本按整数物理像素重排（layoutBall），本行是脚本生效前的初值。 */
    left: 28px;
    top: 50%;
    /* ⚠️⚠️ 球必须**铺满整个窗口**（= ICON_SIZE_LOGICAL = 命中圆直径），不能留边、不能比它小。
       ⚠️⚠️ 本规则与所有 #w2f-ball 规则里**不得**再出现任何合成滤镜 / 半透明 / 变形 /
       圆角 / 渐变类属性 —— 状态差异全部来自 background-image 换图（三套超采样位图变体），
       见文件头「为什么不用 CSS 画圆」。守卫：Electron test/float-contract.test.ts
       的「#w2f-ball 规则禁止画圆 / 合成」两条。 */
    width: 56px;
    height: 56px;
    display: block;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    /* 盘面位图：canvas 超采样栅格化的 data URL（JS 预渲染三套变体写进自定义属性，
       这里默认 idle 变体）。位图 = 底盘 + 1px 描边 + 图标，一整张带 alpha 的图。 */
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-image: var(--w2f-disc);
  }
  /* Tauri 活柱遗留锚语义：anchor='r' 时球心在视口右起 28px（Electron 窗恰好 56 宽，
     两种 anchor 计算结果相同，不会有视觉差异）。 */
  html[data-anchor="r"] #w2f-ball {
    left: calc(100% - 28px);
  }
  /* 三态盘面（全部只换位图）：hover / 拖动 = 图标 37px 变体，半隐藏 = 盘面压暗变体。 */
  html #w2f-ball:hover {
    background-image: var(--w2f-disc-hover);
  }
  html #w2f-ball.w2f-grabbing {
    cursor: grabbing;
    background-image: var(--w2f-disc-hover);
  }
  html.w2f-collapsed #w2f-ball {
    background-image: var(--w2f-disc-collapsed);
  }
  /* 图标只作 canvas 绘制源（drawImage 烘进盘面位图），页面上不再叠第二层。 */
  #w2f-ball img {
    display: none;
  }
</style>
</head>
<body>
<!-- ⚠️ 球上**不挂原生提示**（不给球写 title）：球窗是 always-on-top，而原生提示条是**独立的
     非置顶窗口** ⇒ 提示条只会被画在球窗**之后**，从球窗的透明环带（圆内、球本体之外）漏出一
     块浅色残片，看起来就像「图标背景上有异样图形」（2026-10-11 真机 + Electron 复刻本页双重
     取证）。作用说明改由 aria-label 承载（读屏可见，且不会产生原生提示）。 -->
<div id="w2f-ball" role="button" aria-label="单击显示 / 隐藏主窗口（拖动可移动，拖到屏幕四缘可吸附，右键关闭悬浮图标并显示主窗口）">
  <!-- 软件自己的图标：floaticon://localhost/icon.png（只作 canvas 绘制源，见文件头说明）。 -->
  <img src="icon.png" alt="" draggable="false"/>
</div>
<script>
(function () {
  'use strict';
  try {
    if (window.__web2appFloatIcon) return; // 同文档防重
    window.__web2appFloatIcon = true;

    var token = window.__web2appFloatToken || '';

    // 事件名与 Rust（floatwin.rs）/ Electron（float-window.ts）逐字一致。
    var EV_DOWN = 'web2app:float-down';
    var EV_MOVE = 'web2app:float-move';
    var EV_CANCEL = 'web2app:float-cancel';
    var EV_DRAG_END = 'web2app:float-drag-end';
    var EV_PEEK_ENTER = 'web2app:float-peek-enter';
    var EV_PEEK_LEAVE = 'web2app:float-peek-leave';
    var EV_HIDE = 'web2app:float-hide';
    var EV_CLICK = 'web2app:float-click';

    // 主进程 eval window.__web2appFloat.setState({edge,collapsed,anchor}) 驱动吸附状态。
    // edge 扩为四缘（left / right / top / bottom，v1.81）；anchor 只有 'l'/'r'（Tauri 活柱
    // 遗留语义，保留不动）：'r' 时球心在视口右侧 28px，其余在左侧 28px。
    var current = { edge: 'none', collapsed: false, anchor: 'l' };

    var ball = document.getElementById('w2f-ball');
    if (!ball) return;
    var iconImg = ball.querySelector('img');

    // =========================================================================
    // 盘面渲染（v1.81 根治毛刺）：canvas 超采样栅格化 → data URL 位图
    // =========================================================================
    // 为什么不用 CSS 画圆：见文件头「为什么不用 CSS 画圆」。这里一次把「平涂底盘 +
    // 1px 半透明描边 + 图标」烘进**同一张**带 alpha 的位图；三套变体（idle / hover /
    // collapsed）预渲染，状态切换只换 background-image，浏览器不做任何裁剪 / 合成。
    var BALL_SIZE = 56;   // 球边长（逻辑像素）= DEFAULT_FLOAT_W = ICON_SIZE_LOGICAL
    var ICON_IDLE = 36;   // 图标边长（逻辑像素）
    var ICON_HOVER = 37;  // 悬停变体：图标微放大 1px（替代旧的合成提亮）
    var SUPERSAMPLE = 8;  // 超采样倍率：圆缘 1 物理像素内的覆盖率抗锯齿由它提供

    // 跟随系统深浅色：平涂白 / 黑底盘 + 1px 半透明描边；切换时三套变体整组重渲染。
    var mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    // 底盘颜色（平涂，无渐变）：collapsed 压暗约 8%，提示「这是吸附在边上的球」。
    function discFill(dark, variant) {
      if (dark) return variant === 'collapsed' ? '#1c1c1c' : '#1e1e1e';
      return variant === 'collapsed' ? '#ebebeb' : '#ffffff';
    }

    function renderDisc(variant) {
      try {
        var dpr = window.devicePixelRatio || 1;
        var sizeDev = Math.round(BALL_SIZE * dpr); // 位图边长 = 整数物理像素
        var big = sizeDev * SUPERSAMPLE;           // 超采样画布
        var c1 = document.createElement('canvas');
        c1.width = big;
        c1.height = big;
        var g = c1.getContext('2d');
        if (!g) return '';
        var dark = !!(mqDark && mqDark.matches);
        var r = big / 2;
        // 平涂圆盘：边缘覆盖率抗锯齿交给「超采样 → 下采样」，不用任何渐变描边。
        g.beginPath();
        g.arc(r, r, r, 0, Math.PI * 2);
        g.fillStyle = discFill(dark, variant);
        g.fill();
        // 1 物理像素描边（超采样宽度 = SUPERSAMPLE），描边带整体落在盘内、不外溢。
        g.beginPath();
        g.arc(r, r, r - SUPERSAMPLE / 2, 0, Math.PI * 2);
        g.lineWidth = SUPERSAMPLE;
        g.strokeStyle = dark ? 'rgba(255, 255, 255, .16)' : 'rgba(0, 0, 0, .10)';
        g.stroke();
        // 下采样到 sizeDev 物理像素：一次缩放把超采样覆盖率折算成边缘单级覆盖率渐变。
        var c2 = document.createElement('canvas');
        c2.width = sizeDev;
        c2.height = sizeDev;
        var g2 = c2.getContext('2d');
        if (!g2) return '';
        g2.imageSmoothingEnabled = true;
        if ('imageSmoothingQuality' in g2) g2.imageSmoothingQuality = 'high';
        g2.drawImage(c1, 0, 0, sizeDev, sizeDev);
        // 图标叠进同一张离屏画布：最终 background-image 是一张完整位图（不是 CSS 拼层）。
        // 偏移取整到物理像素：图标绝不落在分数物理像素上（分数对齐 = 阶梯毛刺）。
        if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
          var iconDev = Math.round((variant === 'hover' ? ICON_HOVER : ICON_IDLE) * dpr);
          var off = Math.round((sizeDev - iconDev) / 2);
          g2.drawImage(iconImg, off, off, iconDev, iconDev);
        }
        return c2.toDataURL('image/png');
      } catch (e) {
        return '';
      }
    }

    // 三套盘面变体一次渲染，写进自定义属性；状态切换只换 background-image（CSS 规则）。
    function applyVariants() {
      try {
        var root = document.documentElement;
        if (root) {
          root.style.setProperty('--w2f-disc', 'url("' + renderDisc('idle') + '")');
          root.style.setProperty('--w2f-disc-hover', 'url("' + renderDisc('hover') + '")');
          root.style.setProperty('--w2f-disc-collapsed', 'url("' + renderDisc('collapsed') + '")');
        }
      } catch (e) { /* 忽略 */ }
      layoutBall();
    }

    // 物理像素对齐摆放：左 / 上 / 宽 / 高都按整数物理像素计算后 /dpr 回写 CSS 像素，
    // 位图圆盘绝不落在分数物理像素上（分数对齐会重新引入阶梯毛刺，见文件头毛刺源③）。
    function layoutBall() {
      try {
        var dpr = window.devicePixelRatio || 1;
        var sizeDev = Math.round(BALL_SIZE * dpr);
        var viewportDevW = Math.round((window.innerWidth || BALL_SIZE) * dpr);
        var viewportDevH = Math.round((window.innerHeight || BALL_SIZE) * dpr);
        var xDev = current.anchor === 'r'
          ? Math.round(viewportDevW - sizeDev)
          : Math.round(BALL_SIZE / 2 * dpr - sizeDev / 2);
        var yDev = Math.round(viewportDevH / 2 - sizeDev / 2);
        ball.style.left = (xDev / dpr) + 'px';
        ball.style.top = (yDev / dpr) + 'px';
        ball.style.width = (sizeDev / dpr) + 'px';
        ball.style.height = (sizeDev / dpr) + 'px';
      } catch (e) { /* 忽略 */ }
    }

    // devicePixelRatio 变化（跨屏拖动到不同缩放的显示器）→ 重渲染盘面 + 重排位置。
    // 没有直接的 dpr 变更事件，用「resolution 媒体查询 + 变更后重挂」的标准做法。
    function watchDpr() {
      try {
        if (!window.matchMedia) return;
        var mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
        var onChange = function () {
          try { mq.removeEventListener('change', onChange); } catch (e) { /* 忽略 */ }
          applyVariants();
          watchDpr();
        };
        mq.addEventListener('change', onChange);
      } catch (e) { /* 忽略 */ }
    }

    // ---- 桥接：Electron 走 window.web2app 白名单；Tauri 走核心事件 ----
    function electronApi() {
      try {
        var E = window.web2app;
        if (E && E.isElectron && typeof E.floatMove === 'function' && typeof E.floatClick === 'function') {
          return E;
        }
      } catch (e) { /* noop */ }
      return null;
    }
    function tauriEmit(name, payload) {
      try {
        var T = window.__TAURI__;
        if (T && T.event && typeof T.event.emit === 'function') {
          var r = T.event.emit(name, payload);
          if (r && r.then) r.then(null, function () {});
          return;
        }
        var I = window.__TAURI_INTERNALS__;
        if (I && typeof I.invoke === 'function') {
          I.invoke('plugin:event|emit', { event: name, payload: payload });
        }
      } catch (e) { /* 忽略 */ }
    }
    // kind: down | move | cancel | dragend | click | peekenter | peekleave | hide
    // down / move 携带指针的【屏幕绝对坐标】(sx, sy)（CSS 像素），不是相对球窗的增量 ——
    // 主进程每帧都在 set_position，窗口自身位移会污染增量（见文件头说明）。
    // down 在 pointerdown 立即发：主进程只暂存「按下点」，第一帧 move 时才据此算抓取偏移
    // （不能在第一帧 move 才算 —— 那时光标已经离开按下点，首帧窗口会纹丝不动）。
    function send(kind, sx, sy) {
      try {
        var E = electronApi();
        if (E) {
          if (kind === 'click') E.floatClick();
          else if (kind === 'down') E.floatDown(sx || 0, sy || 0);
          else if (kind === 'move') E.floatMove(sx || 0, sy || 0);
          else if (kind === 'cancel') E.floatCancel();
          else if (kind === 'dragend') E.floatDragEnd();
          else if (kind === 'peekenter') E.floatPeek(true);
          else if (kind === 'peekleave') E.floatPeek(false);
          else if (kind === 'hide') E.floatHide();
          return;
        }
        if (kind === 'down') tauriEmit(EV_DOWN, { token: token, sx: sx || 0, sy: sy || 0 });
        else if (kind === 'move') tauriEmit(EV_MOVE, { token: token, sx: sx || 0, sy: sy || 0 });
        else if (kind === 'cancel') tauriEmit(EV_CANCEL, { token: token });
        else if (kind === 'dragend') tauriEmit(EV_DRAG_END, { token: token });
        else if (kind === 'peekenter') tauriEmit(EV_PEEK_ENTER, { token: token });
        else if (kind === 'peekleave') tauriEmit(EV_PEEK_LEAVE, { token: token });
        else if (kind === 'hide') tauriEmit(EV_HIDE, { token: token });
        else if (kind === 'click') tauriEmit(EV_CLICK, { token: token });
      } catch (e) { /* 忽略 */ }
    }

    window.__web2appFloat = {
      setState: function (s) {
        try {
          if (!s) return;
          current.edge = s.edge === 'left' || s.edge === 'right' || s.edge === 'top' || s.edge === 'bottom' ? s.edge : 'none';
          current.collapsed = !!s.collapsed;
          current.anchor = s.anchor === 'r' ? 'r' : 'l';
          var root = document.documentElement;
          if (root) {
            root.setAttribute('data-anchor', current.anchor);
            root.classList.toggle('w2f-dock-left', current.edge === 'left');
            root.classList.toggle('w2f-dock-right', current.edge === 'right');
            root.classList.toggle('w2f-dock-top', current.edge === 'top');
            root.classList.toggle('w2f-dock-bottom', current.edge === 'bottom');
            root.classList.toggle('w2f-collapsed', current.collapsed && current.edge !== 'none');
          }
          layoutBall();
        } catch (e) { /* 忽略 */ }
      }
    };

    // ---- 点击 vs 拖动：屏幕位移超过阈值才算拖动；否则松手即「点击 → 切换主窗」----
    // 全程用 screenX/screenY（屏幕绝对坐标，CSS 像素）：主进程移动窗口不会改变它，
    // 因此既不会被窗口自身位移抵消（v1.69 旧实现用增量导致半速跟手 / 抖动），
    // 吸附态起拖时窗口的 28px 展开平移也不会被误算成一次跳动。
    var DRAG_THRESHOLD = 5;
    // 双击去抖窗口（毫秒）：双击会送来两次 pointerup（两次 click），两次 toggle 相互抵消，
    // 用户只看到主窗「闪现」一下。见 endPointer 里的说明。
    var CLICK_DEBOUNCE_MS = 250;
    var lastClickAt = 0;
    var down = false;
    var moved = false;
    var startSX = 0, startSY = 0;
    var latestSX = 0, latestSY = 0, scheduled = false;

    ball.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return; // 仅主键；右键走 contextmenu
      down = true;
      moved = false;
      startSX = latestSX = e.screenX;
      startSY = latestSY = e.screenY;
      // 立即把按下点报给主进程暂存（第一帧 move 才展开吸附态并计算抓取偏移）。
      send('down', e.screenX, e.screenY);
      try { ball.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      e.preventDefault();
    });
    ball.addEventListener('pointermove', function (e) {
      if (!down) return;
      if (!moved) {
        if (Math.abs(e.screenX - startSX) + Math.abs(e.screenY - startSY) < DRAG_THRESHOLD) return;
        moved = true;
        ball.classList.add('w2f-grabbing');
      }
      // 只缓存最新屏幕坐标：主进程按绝对坐标摆放，丢几帧 / 晚几帧都能自愈，不累积误差。
      latestSX = e.screenX;
      latestSY = e.screenY;
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        if (!down || !moved) return;
        send('move', latestSX, latestSY);
      });
    });
    function endPointer(e, canceled) {
      if (!down) return;
      down = false;
      ball.classList.remove('w2f-grabbing');
      try { ball.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      if (canceled) {
        // 系统打断（窗口被隐藏 / 手势被抢占）：已拖动则报 dragend 让主进程重新吸附 / 落盘；
        // 没拖动只发 cancel 清掉主进程暂存的按下点（绝不当成单击 —— 否则一次意外取消会
        // 莫名把主窗口弹出来，也不能留下按下点污染下一次拖动的锚点）。
        send(moved ? 'dragend' : 'cancel');
        return;
      }
      // 越过拖动阈值 = 拖动：松手报 dragend，让主进程判吸附 / 落盘。
      if (moved) { send('dragend'); return; }
      // 没越过阈值 = 单击：切换【原来的主窗口】显隐（v1.71 起为 toggle）。
      // ⚠️ 去抖：系统双击在 ~100ms 内送来两次 pointerup，即两次 click —— 两次 toggle 相互
      //    抵消，只剩主窗一瞬的「闪现」。窗口期内的后续点击一律丢弃（双击只认第一次）；
      //    两次独立单击只要间隔超过阈值仍各算一次。
      var now = Date.now();
      if (now - lastClickAt < CLICK_DEBOUNCE_MS) return;
      lastClickAt = now;
      send('click');
    }
    ball.addEventListener('pointerup', function (e) { endPointer(e, false); });
    ball.addEventListener('pointercancel', function (e) { endPointer(e, true); });

    // 右键 = 关闭悬浮图标功能并唤回主窗口（v1.76）。页面只管发 hide 事件，
    // 三件事都由主进程做：置 float_enabled=false 并落盘、销毁球窗、显示主窗口。
    // ⚠️ 不能再退回「只隐藏球」：球一藏、而用户没启用托盘、主窗又是关窗驻留隐藏着的，
    //    桌面上就再无任何入口（进程在跑却唤不出窗口，见文件头第 4 条）。
    ball.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      send('hide');
    });
    // 双击不做任何事，浏览器默认的文本选择 / 拖动也要挡掉。
    ball.addEventListener('dblclick', function (e) { e.preventDefault(); });
    ball.addEventListener('dragstart', function (e) { e.preventDefault(); });

    // ---- 鼠标进入 / 离开窗口客户区 → 悬停展开 / 移开缩回（主进程只在吸附态响应）----
    document.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) send('peekleave');
    }, true);
    document.addEventListener('mouseover', function (e) {
      if (!e.relatedTarget) send('peekenter');
    }, true);

    // 图标就绪后重渲染一次（把图标烘进盘面位图）；视口 / 锚变化重排到整数物理像素。
    if (iconImg) iconImg.addEventListener('load', applyVariants);
    window.addEventListener('resize', layoutBall);
    if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', applyVariants);
    applyVariants();
    watchDpr();

    window.__web2appFloat.setState(current);
  } catch (e) { /* 内置页面任何异常都静默，不影响主进程 */ }
})();
</script>
</body>
</html>

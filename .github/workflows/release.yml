name: Release

# 发布版本自动编译：在 GitHub 上 Publish 一个 Release 时触发，自动构建并上传安装包。
# 也支持手动触发（Actions → Release → Run workflow），此时只跑 Android job，用于快速验证 APK 构建。
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# ⚠️ 单仓库化（2026-09-22）：仓库根已上移，Rust 工程在 `webview-app/` 子目录。
#    所有 run 步骤（含 python 内联脚本读写的 `tauri.conf.json`、`gen/android/...`）
#    都统一在 webview-app/ 下执行。`uses:` 步骤不受影响，checkout 仍落在仓库根。
#    ⚠️ 但 `softprops/action-gh-release` 的 `files:` 以**仓库根**为基准解析，
#       那里必须保留 `webview-app/` 前缀（见下方 Upload to Release）。
defaults:
  run:
    working-directory: webview-app

jobs:
  # ---------------------------------------------------------------------------
  # Windows 安装包（msi / nsis），构建后直接上传到本次 Release 的资源附件。
  # 纯 Rust 工程（无 JS 前端构建），直接用 cargo 安装 tauri-cli 后 `cargo tauri build`。
  #
  # 编译期注入：若在仓库 Settings → Secrets and variables → Actions 中设置了
  # APP_URL / APP_NAME 等变量（凭据建议用 Secrets，其余用 Variables；Secrets 优先），
  # 则发布时会用这些值烘焙进二进制；未设置则回落到源码里的默认值。
  #
  # 两个名字变量（与手动打包 build-custom.yml 的 JSON 字段**同名**）：
  #   APP_NAME  【安装名】Windows 安装包名 / 快捷方式 / 安装目录 / 数据存储目录名
  #   TITLE     【显示名】Windows 窗口标题 + Android 应用名称（缺省回落 APP_NAME）
  #   （旧变量名 APP_TITLE / WINDOW_TITLE 已废弃，仅为兼容既有仓库变量而保留回落；
  #     新配置请直接用 TITLE。字段表见 docs/packaging-config.md）
  #
  # ⚠️ 本文件与 build-custom.yml 的**能力必须等价**：两者都能产出同一份产物，
  #    任何一边缺字段，都会得到「手动打包能用、发版不能用」这种最难解释的差异
  #    （历史上这里就漏过 EXTRA 与 ICON_URL）。
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows installers
    # 仅在正式发布（release 事件）时构建 Windows 包；workflow_dispatch 手动触发时跳过，
    # 只跑 Android job（快速验证 APK 构建）。上传步骤依赖 github.event.release，手动触发会失败。
    if: github.event_name == 'release'
    runs-on: windows-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      # 产物版本号（三段数字）。优先级：vars.VERSION → 本次 Release 的 tag（自动剥前导 v）
      # → 不改写（保留 tauri.conf.json 里的值）。
      # ⚠️ 这是与 build-custom.yml 对齐后**新增**的能力：release 侧原先完全不写 version
      #    ⇒ 发版产物版本恒为 tauri.conf.json 的 0.1.0，与手动打包（缺省 0.0.1）不一致。
      VERSION: ${{ vars.VERSION || github.event.release.tag_name }}
      # 显示名：优先新变量名 TITLE、其次旧名 APP_TITLE；都没配时由代码 env_str! 回落 APP_NAME。
      TITLE: ${{ vars.TITLE || vars.APP_TITLE }}
      # 注入给页面的额外参数（JSON 文本）→ window.web2appExtra
      EXTRA: ${{ vars.EXTRA }}
      # 自定义图标 PNG 的 URL（留空=沿用仓库默认图标）
      ICON_URL: ${{ vars.ICON_URL }}
      # 数据目录（字符串，默认 "data"）：未配置 = 空串 = 系统默认程序目录（%LOCALAPPDATA%\APP_NAME），
      # 对「装进 Program Files 的 MSI」最稳；要跟着程序走（绿色/便携）就设 DATA_DIR=data。
      # ⚠️⚠️ 千万不要写成 `vars.DATA_DIR || 'data'`：`||` 会把「已配置但为空」也替换成 "data"，
      #    于是仓库变量里再也表达不出「用系统默认目录」这个取值。
      DATA_DIR: ${{ vars.DATA_DIR }}
      PUBLIC_KEY: ${{ secrets.PUBLIC_KEY || vars.PUBLIC_KEY }}
      RESOLVE_SECRET: ${{ secrets.RESOLVE_SECRET || vars.RESOLVE_SECRET }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
      # 多页签（tab）模式。Windows = 多 WebView 完整形态；Android = 底栏内的单 webview
      # 页签记录（需同时开 MOBILE_BAR 才有入口）。仓库变量 TABS_ENABLED=true 开启。
      TABS_ENABLED: ${{ vars.TABS_ENABLED }}
      # 移动端底栏（仅移动端生效；桌面端忽略）。仓库变量 MOBILE_BAR=true 开启。
      MOBILE_BAR: ${{ vars.MOBILE_BAR }}
      # 诊断日志开关（默认关）。仓库变量 DEBUG=true 开启后，产物会写 <数据目录>\logs\startup.log。
      # ⚠️ 变量未设置时透下来的是**空串**，而 config.rs 的 env_bool! 只认 true/1/yes/false/0/no
      #    （空串落到默认值 false）⇒ 未配置 = 关闭，符合预期。
      DEBUG: ${{ vars.DEBUG }}
    steps:
      - uses: actions/checkout@v7

      - name: 统一安装名称与版本号（APP_NAME → productName；VERSION → version）
        # 与 build-custom.yml 的 Windows 步骤对齐：该文件一直会写 version，本文件历史上不写
        # ⇒ 发版产物版本恒为 tauri.conf.json 的 0.1.0。VERSION 非空且为三段数字才写入。
        # ⚠️ Windows 侧**不**改 identifier：MSI/NSIS 的升级码依赖它，改了会破坏覆盖升级。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          version = (os.environ.get("VERSION", "") or "").strip()
          if version[:1] in ("v", "V"):
              version = version[1:]
          if version and not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"::warning::VERSION={version!r} 不是「主.次.补丁」形式，跳过 version 改写")
              version = ""

          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)

          changed = False
          if version:
              conf["version"] = version
              changed = True
              print(f"version     = {version}（MSI/NSIS ProductVersion 与 exe 文件版本）")

          name = os.environ.get("APP_NAME", "").strip()
          if name:
              safe = re.sub(r'[\\/:*?"<>|]+', "_", name)
              safe = re.sub(r"\s+", " ", safe).strip(" .")
              if safe:
                  conf["productName"] = safe
                  changed = True
                  print(f"productName = {safe}")
              else:
                  print("APP_NAME 清洗后为空，沿用默认名称")
          else:
              print("未配置 APP_NAME，沿用 tauri.conf.json 默认名称")

          if changed:
              with open("tauri.conf.json", "w", encoding="utf-8") as f:
                  json.dump(conf, f, ensure_ascii=False, indent=2)
                  f.write("\n")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 下载自定义图标（可选，来自 vars.ICON_URL）
        # 与 build-custom.yml 的图标步骤同一套做法：从 ICON_URL 下载 PNG，用官方
        # `cargo tauri icon` 重新生成全套图标（窗口图标 + MSI 安装包图标都用它）。
        # 未配置 ICON_URL 时沿用仓库已提交的 icons/。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ICON_URL:-}" ]; then echo "未配置 ICON_URL，沿用仓库默认图标"; exit 0; fi
          echo "下载图标: $ICON_URL"
          curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
          magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "::error::ICON_URL 下载的不是 PNG 文件（文件头=$magic）"; exit 1
          fi
          cargo tauri icon icon-custom.png

      - name: Build (tauri)
        run: cargo tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 这里的路径以【仓库根】为基准（不受 defaults.run.working-directory 影响），
          #    故必须写成 webview-app/target/...；构建产物由 cargo tauri build 生成在
          #    webview-app/target 下（target 目录位置不受工作目录影响，是 Cargo 按
          #    manifest 所在目录决定的）。
          files: |
            webview-app/target/release/bundle/msi/*.msi
            webview-app/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。本作业会在 CI 上【自动生成 gen/android 并交叉编译出 APK】，
  # 因此无需在本地安装 Android SDK/NDK/JDK。gen/ 已被 .gitignore 忽略，每次构建现生成，避免漂移。
  # 尽力而为：失败不影响 Windows 包发布。
  # init 后会打三处补丁：应用名称统一为 TITLE（vars，缺省回落 APP_NAME）、
  # 系统状态栏 insets 适配、usesCleartextTraffic=true（放行本地 http 代理）。
  #
  # release APK 默认未签名（安装会提示无证书），构建后会自动 zipalign + apksigner 签名：
  #   - 配置了 secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD
  #     （可选 ANDROID_KEY_PASSWORD）→ 用正式 keystore 签名，各版本可覆盖升级；
  #   - 未配置 → 用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）。
  #   （手动打包 build-custom.yml 还支持在 JSON 里直接提供 keystore，优先级高于 secrets。）
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    # 与 Windows 一致：发布时从仓库变量/密钥注入编译期配置（未设置则回落默认）。
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      # 产物版本号（与 windows job 同源同义；见上方 windows job env 的说明）。
      VERSION: ${{ vars.VERSION || github.event.release.tag_name }}
      TITLE: ${{ vars.TITLE || vars.APP_TITLE }}
      EXTRA: ${{ vars.EXTRA }}
      ICON_URL: ${{ vars.ICON_URL }}
      # 数据目录（字符串，默认 "data"）：未配置 = 空串 = 系统默认程序目录（%LOCALAPPDATA%\APP_NAME），
      # 对「装进 Program Files 的 MSI」最稳；要跟着程序走（绿色/便携）就设 DATA_DIR=data。
      # ⚠️⚠️ 千万不要写成 `vars.DATA_DIR || 'data'`：`||` 会把「已配置但为空」也替换成 "data"，
      #    于是仓库变量里再也表达不出「用系统默认目录」这个取值。
      DATA_DIR: ${{ vars.DATA_DIR }}
      PUBLIC_KEY: ${{ secrets.PUBLIC_KEY || vars.PUBLIC_KEY }}
      RESOLVE_SECRET: ${{ secrets.RESOLVE_SECRET || vars.RESOLVE_SECRET }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
      # 多页签在 Android 的形态是【单 webview 页签记录】（mobilebar.rs 维护，底栏「列表 /
      # 新建 / 切换 / 关闭」入口；切换=按记录 url 重新加载，页面状态不保留）。桌面端那套
      # `mod tabs`（#[cfg(windows)] 多 WebView）不参与，但 TABS_ENABLED 在此同样生效：
      # 只开 TABS_ENABLED、不开 MOBILE_BAR 时移动端没有页签入口（按钮画在底栏里）。
      TABS_ENABLED: ${{ vars.TABS_ENABLED }}
      # 移动端底栏：与上面的 Windows job 对称注入（本 job 是 Android，是这个字段唯一生效的地方；
      # 桌面 job 注入了也恒被忽略——Rust 侧常量为 #[cfg(mobile)]）。
      MOBILE_BAR: ${{ vars.MOBILE_BAR }}
      # 诊断日志开关（默认关），与 Windows 版同义。见上面 windows job 的说明。
      DEBUG: ${{ vars.DEBUG }}
      # 可选运行时权限（仅 Android）：仓库变量填紧凑 JSON 数组，如
      # ANDROID_PERMISSIONS=["camera","microphone","location"]；未设置/空 = [] 不声明。
      # 由 patch-android-permissions.py 读此变量映射进 AndroidManifest.xml
      #（未声明时网页 getUserMedia / geolocation 被系统直接 deny）。
      ANDROID_PERMISSIONS: ${{ vars.ANDROID_PERMISSIONS || '[]' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          # ⚠️ 必须显式给 `packages`。本 action 的默认值是 `tools platform-tools`，而 Google
          # 早已下架独立的 `tools` 包（由 cmdline-tools 取代），新版 sdkmanager 对「找不到的包」
          # 直接以 exit code 1 结束（旧版只打警告），整个步骤随之失败：
          #   Warning: Failed to find package 'tools'
          #   Error: The process '.../cmdline-tools/20.0/bin/sdkmanager' failed with exit code 1
          # 这里只保留确实存在的 platform-tools；NDK 由下一步显式安装。
          packages: 'platform-tools'

      - name: Install NDK
        # 版本单一真源见 .github/scripts/install-android-ndk.sh —— 3 个 workflow 共用同一份
        #（原先三处各写死一遍同一个版本号，模板换 NDK 时必然漂移）。脚本除安装外还会
        # 校验目录存在（装不上即硬失败），并导出 ANDROID_NDK_HOME / NDK_HOME / ANDROID_NDK_ROOT。
        run: bash ../.github/scripts/install-android-ndk.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 预写 tauri.conf.json（version / productName / identifier）
        # 逻辑在 .github/scripts/prepare-android-conf.py —— 与 build-custom.yml 调用**同一个脚本**。
        # ⚠️ 与手动打包的能力对齐（本文件历史上**完全不写 version** ⇒ 发版 APK 的
        # versionName/versionCode 恒为 tauri.conf.json 里的 0.1.0，与手动打包不一致）。
        # VERSION 非空才改写；为空则保留仓库值。见 job env 的 VERSION。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: python3 ../.github/scripts/prepare-android-conf.py

      - name: Initialize Android project (gen/android) + 安装匹配平台
        # 逻辑在 .github/scripts/install-android-sdk.sh —— 与 build-custom.yml 调用**同一个脚本**，
        # 不再各存一份副本（避免两边漂移）。脚本内部：没有 gen/android 就先
        # `cargo tauri android init`，再按模板实际写的 compileSdk 从仓库真实存在的包名中挑平台安装。
        # 2026-10-07 修复见该脚本头部注释（次版本号平台 android-37.0 + canary 通道）。
        run: bash ../.github/scripts/install-android-sdk.sh

      - name: 应用自定义图标到 Android 工程
        # 官方推荐：android init 之后运行 `cargo tauri icon`，它会把生成的 Android
        # 启动图标直接放入 gen/android/app/src/main/res/（mipmap-*）。
        # 图标源优先级与 build-custom.yml 一致：ICON_URL 下载的 > 仓库已提交的 icons/icon.png。
        # 兜底：若当前 tauri-cli 版本未自动放置，再手动把生成的 icons/android/* 复制进 res。
        run: |
          if [ -n "${ICON_URL:-}" ]; then
            echo "下载图标: $ICON_URL"
            curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
            magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "89504e470d0a1a0a" ]; then
              echo "::error::ICON_URL 下载的不是 PNG 文件（文件头=$magic）"; exit 1
            fi
          fi
          SRC=""
          if [ -f "icon-custom.png" ]; then
            SRC="icon-custom.png"
          elif [ -f "icons/icon.png" ]; then
            SRC="icons/icon.png"
          fi
          if [ -z "$SRC" ]; then
            echo "未找到图标源文件，沿用默认图标"
            exit 0
          fi
          cargo tauri icon "$SRC"
          if [ -d "gen/android/app/src/main/res" ]; then
            if [ -d "icons/android" ]; then
              cp -r icons/android/. gen/android/app/src/main/res/
            fi
            echo "已应用自定义 Android 启动图标（源：$SRC）"
          else
            echo "::warning::未找到 gen/android res 目录，图标可能未应用"
          fi

      - name: 统一应用名称（Android 应用名称 ← title）
        # 逻辑在 .github/scripts/apply-android-labels.py —— 两壳共用。显示名取 title
        #（缺省回落 app_name），一次改 strings.xml 的 app_name / main_activity_title 与
        # Manifest 内联 android:label；app_name 只负责「安装名」。
        run: python3 ../.github/scripts/apply-android-labels.py

      - name: 预生成 wry Android Kotlin 模板（补丁链前置）
        # ⚠️ 2026-10-15 新增。根因：wry 的 Kotlin 文件（RustWebViewClient 等）
        # 不是在 `tauri android init` 时生成到 gen/android，而是在 `tauri android build`
        # 的 Rust 编译阶段由 wry build.rs 动态生成到 `java/<pkg>/generated/`。
        # 我们的补丁脚本（extras / schemes / fullscreen）需要修改这些文件，
        # 但它们在 build 之前执行——那时 generated/ 目录不存在 → FileNotFoundError。
        # 本脚本提前触发一次 wry build.rs 做的事：读取 wry crate src/android/kotlin/
        # 模板，替换占位符，写到 generated/。让后续补丁脚本能正常找到文件。
        # wry build.rs 后续在 cargo build 时会重新生成并覆盖——没关系，
        # 下面的 gradle task 会在编译前重新应用补丁（见下一步）。
        run: python3 ../.github/scripts/prepare-wry-kotlin.py

      - name: 注入 gradle task（确保补丁在 wry build.rs 覆盖后重新应用）
        # ⚠️ 2026-10-15 新增。wry build.rs 在每次 cargo build 时会重新生成
        # java/<pkg>/generated/ 里的 Kotlin 文件（覆盖我们提前打的补丁）。
        # 本脚本往 gen/android/app/build.gradle.kts 追加一个 patchWryKotlin task：
        #   dependsOn rustBuildUniversal*   ← 先让 wry build.rs 跑完
        #   compile*Kotlin dependsOn patchWryKotlin ← Kotlin 编译前重打补丁
        # task 里重新运行 extras / schemes / fullscreen 三个补丁脚本。
        run: python3 ../.github/scripts/inject-gradle-patch-task.py

      - name: 适配系统状态栏/导航栏（避免页面被顶部通栏遮挡）
        # 逻辑在 .github/scripts/patch-android-insets.py —— 两壳共用（两份内联逻辑实测逐字节相同）。
        # 模板 MainActivity 调用了 enableEdgeToEdge()，WebView 会绘制到系统栏下方；脚本按
        # systemBars 实际高度给内容视图加内缩：全屏仍生效，但页面不被系统通栏遮挡。
        run: python3 ../.github/scripts/patch-android-insets.py

      - name: 接管系统返回键（不允许退回到内置启动页）
        # 补丁逻辑（含自测）见 .github/scripts/patch-android-back.py：给 MainActivity
        # 注入 onWebViewCreate 钩子，按 WebView.copyBackForwardList 的相邻条目 URL 判定 ——
        # 落点是真实网页才 goBack；没有可退的真实页面时 finish()（与无历史的系统默认
        # 同手感：回桌面/后台）。gen/android 每次现生成，故每轮 init 后都必须打。
        run: python3 ../.github/scripts/patch-android-back.py

      - name: 接管网页下载（附件下载 / 长按存图 → 系统 DownloadManager）
        # 与 build-custom.yml 调用同一个脚本（含自测）；wry 0.57 Android 无下载通道，
        # 不补丁则下载 / 长按存图静默无反应。同时补 Manifest 存储（maxSdk=28）/通知权限。
        run: python3 ../.github/scripts/patch-android-download.py

      - name: 挂 JS 原生桥（分享 / 浏览器打开 / 清除浏览数据 / 退出）
        # 与 build-custom.yml 调用同一个脚本（含自测）：__web2appAndroid 桥 + 主框架
        # 一次性密钥轮换；清数据补 wry 0.57 漏掉的 Cookie / WebStorage，清完 reload。
        run: python3 ../.github/scripts/patch-android-extras.py

      - name: 外部链接交系统应用打开（tel/mailto/weixin/intent 等）
        # 与 build-custom.yml 调用同一个脚本（含自测）：非 http(s) scheme 用 Intent 外跳，
        # 无应用可处理时 toast 兜底，避免 ERR_UNKNOWN_URL_SCHEME 白页。
        run: python3 ../.github/scripts/patch-android-schemes.py

      - name: 支持网页视频全屏（H5 <video> / requestFullscreen）
        # 与 build-custom.yml 调用同一个脚本（含自测）：整体替换 wry 的空 onShow/
        # onHideCustomView，实现 custom view 铺满 + 锁横屏 + 沉浸式，退出逐项还原。
        run: python3 ../.github/scripts/patch-android-fullscreen.py

      - name: 按需声明运行时权限（camera / microphone / location）
        # 与 build-custom.yml 调用同一个脚本（含自测）：读 job 环境变量 ANDROID_PERMISSIONS
        #（本 workflow 取自仓库变量，默认 []），按需向 AndroidManifest.xml 注入权限；空则跳过。
        run: python3 ../.github/scripts/patch-android-permissions.py

      - name: Allow cleartext HTTP (localhost proxy)
        # 应用通过本地反向代理加载 http://127.0.0.1:<port>；Android 9+ 默认禁止明文 HTTP，
        # release 构建的 usesCleartextTraffic 默认为 false，必须置 true 否则鉴权代理真机上加载失败。
        run: |
          sed -i -E 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' gen/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" gen/android/app/src/main/AndroidManifest.xml

      - name: 设置 Android 产物文件名（APK 文件名 ← app_name）
        # 逻辑在 .github/scripts/set-android-apk-name.py —— 两壳共用，产物名就此对齐
        #（此前只有 build-custom.yml 有这一步，release.yml 出的 APK 一直是通用的
        # app-universal-release-unsigned.apk）。
        run: python3 ../.github/scripts/set-android-apk-name.py

      - name: 开启 gradle 错误栈（便于定位 assemble 失败原因）
        # 把 org.gradle.stacktrace=all 写进 gen/android/gradle.properties，
        # 若 APK 构建失败，gradle 会直接打印完整错误栈（e: 编译错误 / 资源链接错误等），
        # 省去"BUILD FAILED"尾部看不出根因的麻烦。
        # 关键：必须先确保文件末尾有换行，否则 echo >> 会把内容粘到上一行——
        # 曾因此把 stacktrace=all 粘到 android.nonFinalResIds=false 后面，
        # 导致 gradle 报 "Cannot parse ... android.nonFinalResIds='falseorg.gradle.stacktrace=all'"。
        run: |
          gp="gen/android/gradle.properties"
          mkdir -p "$(dirname "$gp")"
          touch "$gp"
          # 末尾无换行则补一个，防止新行粘到上一行
          [ -z "$(tail -c1 "$gp" 2>/dev/null)" ] || printf '\n' >> "$gp"
          grep -q "org.gradle.stacktrace" "$gp" || echo "org.gradle.stacktrace=all" >> "$gp"
          echo "--- gradle.properties ---"; cat "$gp"

      - name: Android 环境指纹（诊断用，失败时靠它定位）
        # 与 build-custom.yml 同名步骤逐字一致：`cargo tauri android build` 是黑盒总流程
        # （前置校验 → 首次 Rust 交叉编译 → gradle 配置 → gradle 执行），失败只体现成"没有 APK"，
        # 而原因常常只是某一层版本对不上。这里一次性把现场拍全；只读、`|| true`，永不失败。
        shell: bash
        run: |
          set -uo pipefail
          echo "── tauri-cli ──"; cargo tauri --version 2>&1 | head -2 || true
          echo "── rustc ──";      rustc -Vv 2>&1 | head -3 || true
          echo "── rustup targets ──"; rustup target list --installed 2>/dev/null | grep android || true
          echo "── java（AGP 9 要求 JDK 17+）──"; java -version 2>&1 | head -3 || true
          echo "── 模板钉住的构建链版本（AGP / Gradle / Kotlin / SDK）──"
          grep -nE 'com\.android\.tools\.build:gradle|kotlin-gradle-plugin' \
            gen/android/build.gradle.kts 2>/dev/null || true
          grep -nE 'distributionUrl' \
            gen/android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          grep -nE 'compileSdk|targetSdk|minSdk|ndkVersion' \
            gen/android/app/build.gradle.kts 2>/dev/null || true
          echo "── gradle.properties ──"
          cat gen/android/gradle.properties 2>/dev/null | grep -vE '^\s*#' || true
          echo "── SDK 平台 / build-tools / NDK ──"
          ls -d "${ANDROID_HOME:-/nonexistent}"/platforms/* 2>/dev/null || true
          ls -d "${ANDROID_HOME:-/nonexistent}"/build-tools/* 2>/dev/null || true
          echo "NDK: ${ANDROID_NDK_HOME:-<未设置>}"
          echo "── 注入的补丁任务链（末 6 行）──"
          tail -n 6 gen/android/app/build.gradle.kts 2>/dev/null || true
          echo "── gen/android 概况 ──"
          ls gen/android 2>/dev/null || echo "!! gen/android 不存在（init 失败？）"

      - name: Build Android APK
        # --apk 仅产出 APK（便于直接安装测试）；若要上架 Play Store 的 AAB，去掉 --apk 即可。
        # 注意：tauri-cli 的 --target 只接受架构名（aarch64/armv7/i686/x86_64），
        # 不是 rustup 的完整三元组 aarch64-linux-android。
        # release APK 默认【未签名】，直接安装会提示"无证书/无法安装"，需下一步 zipalign+apksigner 签名。
        #
        # ⚠️⚠️ 2026-10-28 修的 P0（与 build-custom.yml 同因）：不写 `shell:` 时的 Linux 默认模板
        #   是 `bash -e {0}`，**不含 pipefail** ⇒ 管道退出码取 tee（恒 0）⇒ 构建失败被吞成绿色，
        #   下一步签名报「未找到 *-unsigned.apk」把根因完全掩盖。
        shell: bash
        run: |
          set -o pipefail
          if ! cargo tauri android build --target aarch64 --apk 2>&1 \
              | tee "$RUNNER_TEMP/android-build.log"; then
            echo "::error::Android 构建失败 —— 真实原因见下方摘录与 artifact android-build-log"
            grep -nE '^(error(\[E[0-9]+\])?:|e: |FAILURE: Build|What went wrong:|\* What went wrong:)' \
              "$RUNNER_TEMP/android-build.log" | head -40 || true
            echo '--- 日志末尾 120 行 ---'
            tail -120 "$RUNNER_TEMP/android-build.log"
            echo '--- gradle 到底有没有创建构建目录 ---'
            ls -a gen/android/app/build 2>/dev/null | head -20 || echo "app/build 不存在 ⇒ gradle 配置期之前就挂了"
            exit 1
          fi
          shopt -s nullglob globstar
          apks=(gen/android/app/build/outputs/apk/**/*-unsigned.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::构建命令成功但没产出 *-unsigned.apk"
            ls -R gen/android/app/build/outputs 2>/dev/null | head -40 || true
            exit 1
          fi
          printf '产物：%s\n' "${apks[@]}"

      - name: 签名 APK（release 包默认未签名，不签名无法安装）
        # 签名密钥两级策略：
        #   1) 配置了仓库 secrets（ANDROID_KEYSTORE_BASE64 等）→ 用正式 keystore 签名，
        #      各次构建可互相覆盖升级（长期使用/上架建议这种方式）。
        #   2) 未配置 → 现场用 keytool 生成一次性 keystore 签名。能正常安装使用，
        #      但每次构建的签名不同，新版无法覆盖安装旧版（需先卸载）。
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $build_tools"

          if [ -n "$KS_BASE64" ]; then
            if [ -z "${KS_ALIAS:-}" ] || [ -z "${KS_STORE_PASS:-}" ]; then
              echo "::error::配置了 ANDROID_KEYSTORE_BASE64 时，ANDROID_KEY_ALIAS 和 ANDROID_KEYSTORE_PASSWORD 也必须配置"; exit 1
            fi
            echo "使用 secrets 中的正式 keystore 签名"
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            storepass="$KS_STORE_PASS"
            keypass="${KS_KEY_PASS:-$KS_STORE_PASS}"
            alias="$KS_ALIAS"
          else
            echo "::warning::未配置签名 secrets，使用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）"
            keystore="$RUNNER_TEMP/ci.keystore"
            keytool -genkeypair -keystore "$keystore" -alias web2app-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidci -keypass androidci \
              -dname "CN=web2app-ci, OU=CI, O=web2app"
            storepass="androidci"
            keypass="androidci"
            alias="web2app-ci"
          fi

          mkdir -p "$RUNNER_TEMP/signed"
          found=0
          shopt -s nullglob globstar
          for unsigned in gen/android/app/build/outputs/apk/**/*-unsigned.apk; do
            found=1
            base=$(basename "$unsigned" -unsigned.apk)
            aligned="$RUNNER_TEMP/aligned-$base.apk"
            signed="$RUNNER_TEMP/signed/$base-signed.apk"
            "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-pass "pass:$storepass" \
              --key-pass "pass:$keypass" \
              --ks-key-alias "$alias" \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify "$signed"
            echo "已签名: $signed"
          done
          if [ "$found" = "0" ]; then
            # 本行几乎**从不**是根因：APK 没有 = 上一步 Build 就没成功。先看 Build 步骤与
            # android-build-log artifact（2026-10-28 前它还会被 tee 吞成绿色）。
            echo "::error::未找到 *-unsigned.apk —— 请先看「Build Android APK」步骤与 android-build-log，本行只是结果不是原因"
            find gen/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload Android build log (诊断用)
        # 完整构建日志（含 gradle 错误栈）落盘为 artifact，便于失败时在 Actions 页下载查看根因。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # artifact 名固定为 android-apk（内容为已签名、可直接安装的 APK）。
          name: android-apk
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error

name: Release

# 发布版本自动编译：在 GitHub 上 Publish 一个 Release 时触发，自动构建并上传安装包。
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Windows 安装包（msi / nsis），构建后直接上传到本次 Release 的资源附件。
  # 纯 Rust 工程（无 JS 前端构建），直接用 cargo 安装 tauri-cli 后 `cargo tauri build`。
  #
  # 编译期注入：若在仓库 Settings → Secrets and variables → Actions 中设置了
  # APP_URL / APP_NAME 等变量（凭据建议用 Secrets，其余用 Variables；Secrets 优先），
  # 则发布时会用这些值烘焙进二进制；未设置则回落到源码里的默认值。
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      WINDOW_TITLE: ${{ vars.WINDOW_TITLE }}
      DATA_DIR_DEFAULT: ${{ vars.DATA_DIR_DEFAULT }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build (tauri)
        run: cargo tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。尽力而为：若尚未执行过 `cargo tauri android init`
  # （即仓库里还没有 gen/android 安卓工程），本作业会失败，但不影响 Windows 包发布。
  #
  # 首次使用前的一次性准备（在你本机，而非 CI）：
  #   1) 安装 Tauri CLI：        cargo install tauri-cli --version "^2"
  #   2) 初始化安卓工程：        cargo tauri android init
  #      （会生成 gen/android 与 Kotlin 胶水代码、安卓图标，请一并提交到仓库）
  #   3) 如需正式签名发布，配置 KEY_ALIAS / KEY_PASSWORD / KEYSTORE 等密钥后再打开下方签名步骤。
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    # 与 Windows 一致：发布时从仓库变量/密钥注入编译期配置（未设置则回落默认）。
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      WINDOW_TITLE: ${{ vars.WINDOW_TITLE }}
      DATA_DIR_DEFAULT: ${{ vars.DATA_DIR_DEFAULT }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & build tools
        run: |
          yes | sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Android APK
        # gen/android 必须已在仓库中（见上方“一次性准备”）。--apk 仅产出 APK（便于直接安装测试）；
        # 若要上架 Play Store 的 AAB，去掉 --apk 即可。
        run: cargo tauri android build --target aarch64-linux-android --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

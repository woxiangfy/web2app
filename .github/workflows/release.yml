name: Release

# 发布版本自动编译：在 GitHub 上 Publish 一个 Release 时触发，自动构建并上传安装包。
# 也支持手动触发（Actions → Release → Run workflow），此时只跑 Android job，用于快速验证 APK 构建。
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Windows 安装包（msi / nsis），构建后直接上传到本次 Release 的资源附件。
  # 纯 Rust 工程（无 JS 前端构建），直接用 cargo 安装 tauri-cli 后 `cargo tauri build`。
  #
  # 编译期注入：若在仓库 Settings → Secrets and variables → Actions 中设置了
  # APP_URL / APP_NAME 等变量（凭据建议用 Secrets，其余用 Variables；Secrets 优先），
  # 则发布时会用这些值烘焙进二进制；未设置则回落到源码里的默认值。
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows installers
    # 仅在正式发布（release 事件）时构建 Windows 包；workflow_dispatch 手动触发时跳过，
    # 只跑 Android job（快速验证 APK 构建）。上传步骤依赖 github.event.release，手动触发会失败。
    if: github.event_name == 'release'
    runs-on: windows-latest
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      WINDOW_TITLE: ${{ vars.WINDOW_TITLE }}
      DATA_DIR_DEFAULT: ${{ vars.DATA_DIR_DEFAULT }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
    steps:
      - uses: actions/checkout@v7

      - name: 统一安装名称（APP_NAME → productName）
        # 与 build-custom.yml 保持一致：若仓库 vars 配置了 APP_NAME，则统一 Windows 端的
        # "安装名称"（MSI/NSIS 安装包文件名、快捷方式、"程序和功能"显示名、安装目录）。
        # 未配置 APP_NAME 时不改动，沿用 tauri.conf.json 默认的 Web2App。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = os.environ.get("APP_NAME", "").strip()
          if not name:
              print("未配置 APP_NAME，沿用 tauri.conf.json 默认名称")
              raise SystemExit(0)
          safe = re.sub(r'[\\/:*?"<>|]+', "_", name)
          safe = re.sub(r"\s+", " ", safe).strip(" .")
          if not safe:
              print("APP_NAME 清洗后为空，沿用默认名称")
              raise SystemExit(0)

          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)
          conf["productName"] = safe
          with open("tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(conf, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"productName = {safe}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build (tauri)
        run: cargo tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。本作业会在 CI 上【自动生成 gen/android 并交叉编译出 APK】，
  # 因此无需在本地安装 Android SDK/NDK/JDK。gen/ 已被 .gitignore 忽略，每次构建现生成，避免漂移。
  # 尽力而为：失败不影响 Windows 包发布。
  # init 后会打三处补丁：桌面 label 统一为 APP_NAME（vars）、系统状态栏 insets 适配、
  # usesCleartextTraffic=true（放行本地 http 代理）。
  #
  # release APK 默认未签名（安装会提示无证书），构建后会自动 zipalign + apksigner 签名：
  #   - 配置了 secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD
  #     （可选 ANDROID_KEY_PASSWORD）→ 用正式 keystore 签名，各版本可覆盖升级；
  #   - 未配置 → 用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）。
  #   （手动打包 build-custom.yml 还支持在 JSON 里直接提供 keystore，优先级高于 secrets。）
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    # 与 Windows 一致：发布时从仓库变量/密钥注入编译期配置（未设置则回落默认）。
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      WINDOW_TITLE: ${{ vars.WINDOW_TITLE }}
      DATA_DIR_DEFAULT: ${{ vars.DATA_DIR_DEFAULT }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
      PROXY_HTTP: ${{ vars.PROXY_HTTP }}
      PROXY_HTTPS: ${{ vars.PROXY_HTTPS }}
      PROXY_BYPASS: ${{ vars.PROXY_BYPASS }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        # 平台/构建工具的版本跟随 Tauri 模板（见下方 "Initialize Android project" 步骤，
        # 会在 init 后读取生成工程实际的 compileSdk / buildToolsVersion 再安装对应版本）。
        run: |
          yes | sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Initialize Android project (gen/android) + 安装匹配平台
        # 首次构建时仓库里没有 gen/android，就在 CI 上自动生成。
        # --ci 跳过交互式询问；--skip-targets-install 因为上面已用 rust-toolchain 装了 aarch64 target。
        # 生成后读取模板实际的 compileSdk / buildToolsVersion，安装对应版本的 platforms 与 build-tools。
        run: |
          if [ ! -d "gen/android" ]; then
            cargo tauri android init --ci --skip-targets-install
          fi

          APP_GRADLE=$(ls gen/android/app/build.gradle.kts gen/android/app/build.gradle 2>/dev/null | head -n1)
          SDK=34; BT=34.0.0
          if [ -n "$APP_GRADLE" ]; then
            v=$(grep -oE 'compileSdk\s*[=:]\s*[0-9]+' "$APP_GRADLE" | grep -oE '[0-9]+' | head -n1)
            [ -n "$v" ] && SDK=$v
            b=$(grep -oE 'buildToolsVersion\s*[=:]\s*"[0-9.]+"' "$APP_GRADLE" | grep -oE '[0-9.]+' | head -n1)
            [ -n "$b" ] && BT=$b
          fi
          echo "目标 compileSdk=$SDK buildToolsVersion=$BT"
          yes | sdkmanager "platforms;android-$SDK" "build-tools;$BT"

      - name: 统一应用名称（Android 桌面名称 ← APP_NAME）
        # 与 build-custom.yml / Windows 端（productName）保持一致：
        # 若仓库 vars 配置了 APP_NAME，把它写入 Android 工程的桌面 label（strings.xml 的
        # app_name 或 Manifest 内联 android:label），实现"一个名字、两端一致"。
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib
          from xml.sax.saxutils import escape
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = os.environ.get("APP_NAME", "").strip()
          if not name:
              print("未配置 APP_NAME，Android 沿用默认名称")
              raise SystemExit(0)
          label = escape(name)

          # 1) strings.xml 的 app_name 资源（Manifest 通常以 @string/app_name 引用它）
          res = pathlib.Path("gen/android/app/src/main/res/values/strings.xml")
          if res.exists():
              s = res.read_text(encoding="utf-8")
              s2, n = re.subn(r'(<string\s+name="app_name"\s*>)[^<]*(</string>)',
                              lambda m: m.group(1) + label + m.group(2), s)
              if n == 0 and "</resources>" in s:
                  s2 = s.replace("</resources>",
                                 f'    <string name="app_name">{label}</string>\n</resources>')
                  n = 1
              if n:
                  res.write_text(s2, encoding="utf-8")
                  print(f"strings.xml: app_name → {name}")
              else:
                  print("::warning::strings.xml 中既无 app_name 资源也无 </resources>，请人工检查")
          else:
              print("::warning::未找到 strings.xml")

          # 2) Manifest 若使用内联 label（而非 @string/app_name 引用），直接替换
          mf = pathlib.Path("gen/android/app/src/main/AndroidManifest.xml")
          if mf.exists():
              s = mf.read_text(encoding="utf-8")
              s2, n = re.subn(r'(android:label=")(?!@string/)[^"]*(")',
                              lambda m: m.group(1) + label + m.group(2), s)
              if n:
                  mf.write_text(s2, encoding="utf-8")
                  print(f"AndroidManifest: 内联 android:label → {name}")
          PY

      - name: 适配系统状态栏/导航栏（避免页面被顶部通栏遮挡）
        # Tauri 模板的 MainActivity 调用了 enableEdgeToEdge()：WebView 会延伸绘制到
        # 状态栏/导航栏下方，页面顶部被系统通栏遮挡。这里【保留原文件结构】，只做外科手术式注入：
        #   1) 补 androidx.core 的 3 个 import（若模板已有则跳过）；
        #   2) 在 super.onCreate(...) 之后注册 WindowInsets 监听，让内容视图按
        #      systemBars 实际高度内缩——edge-to-edge 仍生效（应用全屏），但页面内容
        #      不被系统通栏遮挡。
        # 采用"只注入、不重写"的方式，避免破坏模板原有的 import / 基类写法，兼容性更好。
        # gen/android 每次构建现生成，因此每次 init 后都要打一遍补丁。
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          root = pathlib.Path("gen/android/app/src/main/java")
          files = [p for p in root.rglob("MainActivity.*") if p.suffix in (".kt", ".java")]
          if not files:
              raise SystemExit("::error::未找到 MainActivity.kt / MainActivity.java")
          f = files[0]
          src = f.read_text(encoding="utf-8")

          if "setOnApplyWindowInsetsListener" in src:
              print("MainActivity 已包含系统栏适配，跳过改写")
          else:
              # 1) 补 import（缺失才加，插到最后一条 import 之后；若完全没有 import 则插在 package 之后）
              needed = [
                  "import androidx.core.graphics.Insets",
                  "import androidx.core.view.ViewCompat",
                  "import androidx.core.view.WindowInsetsCompat",
              ]
              for imp in needed:
                  if imp in src:
                      continue
                  imports = list(re.finditer(r"^import .*$", src, re.M))
                  if imports:
                      pos = imports[-1].end()
                  else:
                      mp = re.search(r"^package .*$", src, re.M)
                      pos = mp.end() if mp else 0
                      imp = ("\n\n" + imp) if pos else (imp + "\n")
                  src = src[:pos] + "\n" + imp + src[pos:]

              # 2) 在 super.onCreate(...) 之后注入 insets 监听（Kotlin/Java 均兼容）
              if f.suffix == ".kt":
                  listener = (
                      "        ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content)) { v, insets ->\n"
                      "            val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars())\n"
                      "            v.setPadding(bars.left, bars.top, bars.right, bars.bottom)\n"
                      "            insets\n"
                      "        }\n"
                  )
              else:
                  listener = (
                      "        ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content),\n"
                      "                (v, insets) -> {\n"
                      "                    Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n"
                      "                    v.setPadding(bars.left, bars.top, bars.right, bars.bottom);\n"
                      "                    return insets;\n"
                      "                });\n"
                  )

              pat = re.compile(r"super\.onCreate\s*\([^)]*\)\s*;?")
              if not pat.search(src):
                  raise SystemExit("::error::MainActivity 中未找到 super.onCreate 调用，模板可能已变化，请人工确认")
              src = pat.sub(lambda m: m.group(0) + "\n" + listener, src, count=1)

              f.write_text(src, encoding="utf-8")
              print(f"已改写 {f}（内容视图按系统栏 insets 内缩，避免顶部通栏遮挡）")

          # 确保 androidx.core 可用（模板的 androidx.activity/appcompat 一般已传递引入；
          # 兜底：gradle 中既无 androidx.core 也无 appcompat 时补一行依赖）
          for gname in ("build.gradle.kts", "build.gradle"):
              g = pathlib.Path("gen/android/app") / gname
              if not g.exists():
                  continue
              t = g.read_text(encoding="utf-8")
              if ("androidx.core" in t) or ("appcompat" in t):
                  print(f"{gname} 已含 androidx.core/appcompat 依赖")
                  break
              t2, n = re.subn(r"(dependencies\s*\{)",
                              lambda mm: mm.group(1) + '\n    implementation("androidx.core:core-ktx:1.9.0")',
                              t, count=1)
              if n:
                  g.write_text(t2, encoding="utf-8")
                  print(f"{gname} 已补充 androidx.core 依赖")
              break
          PY

      - name: Allow cleartext HTTP (localhost proxy)
        # 应用通过本地反向代理加载 http://127.0.0.1:<port>；Android 9+ 默认禁止明文 HTTP，
        # release 构建的 usesCleartextTraffic 默认为 false，必须置 true 否则鉴权代理真机上加载失败。
        run: |
          sed -i -E 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' gen/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" gen/android/app/src/main/AndroidManifest.xml

      - name: 开启 gradle 错误栈（便于定位 assemble 失败原因）
        # 把 org.gradle.stacktrace=all 写进 gen/android/gradle.properties，
        # 若 APK 构建失败，gradle 会直接打印完整错误栈（e: 编译错误 / 资源链接错误等），
        # 省去"BUILD FAILED"尾部看不出根因的麻烦。
        # 关键：必须先确保文件末尾有换行，否则 echo >> 会把内容粘到上一行——
        # 曾因此把 stacktrace=all 粘到 android.nonFinalResIds=false 后面，
        # 导致 gradle 报 "Cannot parse ... android.nonFinalResIds='falseorg.gradle.stacktrace=all'"。
        run: |
          gp="gen/android/gradle.properties"
          mkdir -p "$(dirname "$gp")"
          touch "$gp"
          # 末尾无换行则补一个，防止新行粘到上一行
          [ -z "$(tail -c1 "$gp" 2>/dev/null)" ] || printf '\n' >> "$gp"
          grep -q "org.gradle.stacktrace" "$gp" || echo "org.gradle.stacktrace=all" >> "$gp"
          echo "--- gradle.properties ---"; cat "$gp"

      - name: Build Android APK
        # --apk 仅产出 APK（便于直接安装测试）；若要上架 Play Store 的 AAB，去掉 --apk 即可。
        # 注意：tauri-cli 的 --target 只接受架构名（aarch64/armv7/i686/x86_64），
        # 不是 rustup 的完整三元组 aarch64-linux-android。
        # release APK 默认【未签名】，直接安装会提示"无证书/无法安装"，需下一步 zipalign+apksigner 签名。
        run: cargo tauri android build --target aarch64 --apk 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: 签名 APK（release 包默认未签名，不签名无法安装）
        # 签名密钥两级策略：
        #   1) 配置了仓库 secrets（ANDROID_KEYSTORE_BASE64 等）→ 用正式 keystore 签名，
        #      各次构建可互相覆盖升级（长期使用/上架建议这种方式）。
        #   2) 未配置 → 现场用 keytool 生成一次性 keystore 签名。能正常安装使用，
        #      但每次构建的签名不同，新版无法覆盖安装旧版（需先卸载）。
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $build_tools"

          if [ -n "$KS_BASE64" ]; then
            if [ -z "${KS_ALIAS:-}" ] || [ -z "${KS_STORE_PASS:-}" ]; then
              echo "::error::配置了 ANDROID_KEYSTORE_BASE64 时，ANDROID_KEY_ALIAS 和 ANDROID_KEYSTORE_PASSWORD 也必须配置"; exit 1
            fi
            echo "使用 secrets 中的正式 keystore 签名"
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            storepass="$KS_STORE_PASS"
            keypass="${KS_KEY_PASS:-$KS_STORE_PASS}"
            alias="$KS_ALIAS"
          else
            echo "::warning::未配置签名 secrets，使用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）"
            keystore="$RUNNER_TEMP/ci.keystore"
            keytool -genkeypair -keystore "$keystore" -alias web2app-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidci -keypass androidci \
              -dname "CN=web2app-ci, OU=CI, O=web2app"
            storepass="androidci"
            keypass="androidci"
            alias="web2app-ci"
          fi

          mkdir -p "$RUNNER_TEMP/signed"
          found=0
          shopt -s nullglob globstar
          for unsigned in gen/android/app/build/outputs/apk/**/*-unsigned.apk; do
            found=1
            base=$(basename "$unsigned" -unsigned.apk)
            aligned="$RUNNER_TEMP/aligned-$base.apk"
            signed="$RUNNER_TEMP/signed/$base-signed.apk"
            "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-pass "pass:$storepass" \
              --key-pass "pass:$keypass" \
              --ks-key-alias "$alias" \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify "$signed"
            echo "已签名: $signed"
          done
          if [ "$found" = "0" ]; then
            echo "::error::未找到 *-unsigned.apk，构建产物异常"
            find gen/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload Android build log (诊断用)
        # 完整构建日志（含 gradle 错误栈）落盘为 artifact，便于失败时在 Actions 页下载查看根因。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # artifact 名固定为 android-apk（内容为已签名、可直接安装的 APK）。
          name: android-apk
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error

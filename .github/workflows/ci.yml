name: CI

# 提交代码即自动测试：每次 push 到主分支、或针对主分支的 PR 都会触发。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ---------------------------------------------------------------------------
# ⚠️ 单仓库化（2026-09-22）：仓库根已上移到仓库目录（本文件所在的上一级），
#    Rust 工程仍在 `webview-app/` 子目录里。原先 `cargo` 命令能跑通，是因为
#    仓库根恰好就是 Rust 工程根；现在必须显式指定工作目录，否则报
#    "could not find `Cargo.toml` in `...` or any parent directory"。
#
#    注意 `defaults.run` 只作用于 `run:` 步骤，**不影响 `uses:` 步骤**：
#    actions/checkout 仍在仓库根落盘，所以 webview-app/ 一定是存在的。
#    但 upload-artifact / action-gh-release 的 `path:` 是以仓库根为基准解析的，
#    那些地方必须手工加 `webview-app/` 前缀（见 release.yml / build-custom.yml）。
# ---------------------------------------------------------------------------
defaults:
  run:
    working-directory: webview-app

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1) 代码质量 + 单元测试（Ubuntu）
  #    这里编译的是 Linux 主机目标：Windows 专属模块（webview_hooks / save_dialog / tabs）
  #    被 `#[cfg(windows)]` 剔除；而托盘 / 窗口几何 / 全局快捷键走的是 `cfg(desktop)`
  #    （= not(android/ios)），在 Linux 上**仍然参与编译**。
  #    ⚠️ 所以本作业覆盖的是「非 Windows 的桌面路径」，**不等价于 Android 分支**——
  #       Android 另有 `cfg(target_os="android")` 的专属分支，由下方 check-android 作业负责。
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (WebKit2GTK for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        # 工具链已通过 dtolnay/rust-toolchain@stable 固定到同一 stable 版本（含 rustfmt 组件），
        # CI 内格式检查结果稳定，故改为阻断：格式不一致直接失败，不再静默放过。
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # 2) Windows 端编译检查（原生 MSVC，验证 WebView2 那一套代码）
  # ---------------------------------------------------------------------------
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (Windows target)
        run: cargo check --all-targets

      - name: Cargo check (Windows, 多页签模式)
        # 验证 TABS_ENABLED=true 的多页签（tab）代码路径也能在 Windows 下编译通过。
        # 该路径默认不参与编译（开关默认 false），故单独加一步显式检查，避免改动 tabs 代码后
        # 只在真机打包时才暴露编译错误。
        env:
          TABS_ENABLED: "true"
        run: cargo check --all-targets

      - name: Clippy (Windows)
        # ⚠️ 不可省略：Ubuntu 的 clippy 作业编译的是 Linux 目标，`#[cfg(windows)]` 的
        # 代码（tabs.rs / webview_hooks.rs）根本不参与编译，其中的 clippy 问题（如
        # let_unit_value）在 Linux 上永远发现不了。Windows 端必须单独跑一次 clippy。
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (Windows)
        # 同理，`#[cfg(windows)]` 的单元/集成测试（如 proxy.rs 的流式转发、cookie 重写、
        # WebView2 鉴权注入）只在 Windows 目标下编译并执行，Linux 作业覆盖不到，
        # 必须在此显式运行，否则 Windows 专属回归会在本地漏检。
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # 3) Android 端交叉编译检查（aarch64-linux-android）【阻断流水线】
  #    ⚠️ 曾经这里挂着 continue-on-error: true，结果 cfg 隔离不完整导致的
  #    Android 编译错误（如 handle_main_close 被 cfg(desktop) 剔除却在
  #    非隔离代码里被调用 → E0425）一路漏到打包 workflow 才暴露。
  #    ubuntu-latest 预装 Android NDK，本作业已验证可稳定运行 → 改为阻断。
  #    另：Linux 作业走的是 cfg(not(windows)) 分支，与 Android 的
  #    cfg(target_os="android") 分支并不等价，两者不可互相替代。
  #    注意：它只编译 Rust，不产出 APK（APK 由 release.yml 在发布时产出）。
  # ---------------------------------------------------------------------------
  check-android:
    name: Check (Android aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # ⚠️ 必须显式给 `packages`。本 action 的默认值是 `tools platform-tools`，而 Google
          # 早已下架独立的 `tools` 包（由 cmdline-tools 取代），新版 sdkmanager 对「找不到的包」
          # 直接以 exit code 1 结束（旧版只打警告），整个步骤随之失败：
          #   Warning: Failed to find package 'tools'
          #   Error: The process '.../cmdline-tools/20.0/bin/sdkmanager' failed with exit code 1
          # 这里只保留确实存在的 platform-tools；NDK 由下一步显式安装。
          packages: 'platform-tools'

      - name: Install NDK
        # setup-android 会预置一个更新的 NDK 并写好 ANDROID_NDK_ROOT；若只设
        # ANDROID_NDK_HOME 会与它不一致，cargo-ndk 报 "doesn't match" 警告。
        # 这里把两个变量统一指向同一个（版本锁定的）NDK，消除歧义。
        run: |
          yes | sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (Android target)
        run: cargo ndk -t arm64-v8a build

      - name: Clippy (Android)
        # 与 Windows 同理：Android 目标下 `#[cfg(target_os="android")]` / 移动端专属分支在
        # Linux 作业的 clippy 里不参与编译，其 lint 问题会漏到打包才暴露。补一次 Android 目标
        # 的 clippy（-D warnings，与其它作业一致）。不带 --all-targets：桌面端示例/测试在
        # Android 交叉编译下无法构建。
        run: cargo ndk -t arm64-v8a clippy -- -D warnings

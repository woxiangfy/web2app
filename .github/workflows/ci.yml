name: CI（tauri）

# 手动触发：在 GitHub Actions 页面点击 "Run workflow" 执行，不再随 push / PR 自动运行。
on:
  workflow_dispatch:

# ---------------------------------------------------------------------------
# ⚠️ 单仓库化（2026-09-22）：仓库根已上移到仓库目录（本文件所在的上一级），
#    Rust 工程仍在 `webview-app/` 子目录里。原先 `cargo` 命令能跑通，是因为
#    仓库根恰好就是 Rust 工程根；现在必须显式指定工作目录，否则报
#    "could not find `Cargo.toml` in `...` or any parent directory"。
#
#    注意 `defaults.run` 只作用于 `run:` 步骤，**不影响 `uses:` 步骤**：
#    actions/checkout 仍在仓库根落盘，所以 webview-app/ 一定是存在的。
#    但 upload-artifact / action-gh-release 的 `path:` 是以仓库根为基准解析的，
#    那些地方必须手工加 `webview-app/` 前缀（见 release.yml / build-custom.yml）。
# ---------------------------------------------------------------------------
defaults:
  run:
    working-directory: webview-app

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1) 代码质量 + 单元测试（Ubuntu）
  #    这里编译的是 Linux 主机目标：Windows 专属模块（webview_hooks / save_dialog / tabs）
  #    被 `#[cfg(windows)]` 剔除；而托盘 / 窗口几何 / 全局快捷键走的是 `cfg(desktop)`
  #    （= not(android/ios)），在 Linux 上**仍然参与编译**。
  #    ⚠️ 所以本作业覆盖的是「非 Windows 的桌面路径」，**不等价于 Android 分支**——
  #       Android 另有 `cfg(target_os="android")` 的专属分支，由下方 check-android 作业负责。
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (WebKit2GTK for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        # 工具链已通过 dtolnay/rust-toolchain@stable 固定到同一 stable 版本（含 rustfmt 组件），
        # CI 内格式检查结果稳定，故改为阻断：格式不一致直接失败，不再静默放过。
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # 2) Windows 端编译检查（原生 MSVC，验证 WebView2 那一套代码）
  # ---------------------------------------------------------------------------
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (Windows target)
        run: cargo check --all-targets

      - name: Cargo check (Windows, 多页签模式)
        # 验证 TABS_ENABLED=true 的多页签（tab）代码路径也能在 Windows 下编译通过。
        # 该路径默认不参与编译（开关默认 false），故单独加一步显式检查，避免改动 tabs 代码后
        # 只在真机打包时才暴露编译错误。
        env:
          TABS_ENABLED: "true"
        run: cargo check --all-targets

      - name: Clippy (Windows)
        # ⚠️ 不可省略：Ubuntu 的 clippy 作业编译的是 Linux 目标，`#[cfg(windows)]` 的
        # 代码（tabs.rs / webview_hooks.rs）根本不参与编译，其中的 clippy 问题（如
        # let_unit_value）在 Linux 上永远发现不了。Windows 端必须单独跑一次 clippy。
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (Windows)
        # 同理，`#[cfg(windows)]` 的单元/集成测试（如 proxy.rs 的流式转发、cookie 重写、
        # WebView2 鉴权注入）只在 Windows 目标下编译并执行，Linux 作业覆盖不到，
        # 必须在此显式运行，否则 Windows 专属回归会在本地漏检。
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # 3) Android 端交叉编译检查（aarch64-linux-android）【阻断流水线】
  #    ⚠️ 曾经这里挂着 continue-on-error: true，结果 cfg 隔离不完整导致的
  #    Android 编译错误（如 handle_main_close 被 cfg(desktop) 剔除却在
  #    非隔离代码里被调用 → E0425）一路漏到打包 workflow 才暴露。
  #    ubuntu-latest 预装 Android NDK，本作业已验证可稳定运行 → 改为阻断。
  #    另：Linux 作业走的是 cfg(not(windows)) 分支，与 Android 的
  #    cfg(target_os="android") 分支并不等价，两者不可互相替代。
  #    注意：它只编译 Rust，不产出 APK（APK 由 release.yml 在发布时产出）。
  # ---------------------------------------------------------------------------
  check-android:
    name: Check (Android aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # ⚠️ 必须显式给 `packages`。本 action 的默认值是 `tools platform-tools`，而 Google
          # 早已下架独立的 `tools` 包（由 cmdline-tools 取代），新版 sdkmanager 对「找不到的包」
          # 直接以 exit code 1 结束（旧版只打警告），整个步骤随之失败：
          #   Warning: Failed to find package 'tools'
          #   Error: The process '.../cmdline-tools/20.0/bin/sdkmanager' failed with exit code 1
          # 这里只保留确实存在的 platform-tools；NDK 由下一步显式安装。
          packages: 'platform-tools'

      - name: Install NDK
        # 版本单一真源见 .github/scripts/install-android-ndk.sh —— 3 个 workflow 共用同一份
        #（原先三处各写死一遍同一个版本号，模板换 NDK 时必然漂移）。脚本除安装外还会
        # 校验目录存在（装不上即硬失败），并导出 ANDROID_NDK_HOME / NDK_HOME / ANDROID_NDK_ROOT。
        run: bash ../.github/scripts/install-android-ndk.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (Android target)
        run: cargo ndk -t arm64-v8a build

      - name: Clippy (Android)
        # 与 Windows 同理：Android 目标下 `#[cfg(target_os="android")]` / 移动端专属分支在
        # Linux 作业的 clippy 里不参与编译，其 lint 问题会漏到打包才暴露。补一次 Android 目标
        # 的 clippy（-D warnings，与其它作业一致）。不带 --all-targets：桌面端示例/测试在
        # Android 交叉编译下无法构建。
        #
        # ⚠️ 最常在此翻车的一类：**导入（use）被无条件写出，却只被 `#[cfg(desktop)]` 的代码使用**。
        #    桌面/Linux 上 `desktop` 为真 ⇒ 恒不报错；Android 上 `desktop` 为假 ⇒ unused import，
        #    在 -D warnings 下直接编译失败。2026-09-22 的 `settings.rs` 即为此例：APP_NAME 的唯一
        #    使用点（open_settings_window 里拼设置窗标题）被 cfg(desktop) 包住后，导入未同步拆开。
        #    ⇒ 给某个 item 加 cfg(desktop) 时，同步检查它的导入是否也要按 cfg 拆开。
        #    （本 crate 有全量 `#![allow(dead_code)]`，所以这里唯一会拦的就是 unused import 这一类。）
        run: cargo ndk -t arm64-v8a clippy -- -D warnings

  # ---------------------------------------------------------------------------
  # 4) 打包配置契约门禁
  #
  #    守三件事，都是「本地不跑、CI 不跑 ⇒ 等于没有护栏」的那一类：
  #      a) 解析器自测 —— 契约唯一真源（字段/默认值/废弃字段报错）不漂移；
  #      b) 所有 workflow 的 YAML 与**内联 python/bash 语法** —— 这类错只在 CI 上才炸，
  #         而且要等 checkout / 装工具链之后；见 .github/scripts/check-workflows.py 的说明；
  #      c) 仓库内每个配置样例都能被解析器接受 —— 曾经样例配置停留在字符串布尔
  #         （`"proxy_enabled": "false"`），新契约已硬拒，靠这一步在提交时就现形，
  #         而不是等用户跑手动打包才失败。
  #         ⚠️ 手工打包用的 test1.json / test2.json 已移入**本地专属**的 tests/
  #            （整目录被 .gitignore 忽略、不入库），CI 看不到它们；入库的样例只剩
  #            两壳各自的 config.example.json，本步就守这两份。
  #      d) 本地打包入口 `scripts/pack-local.mjs` 的自测 + 与 Python 解析器的**对等性比对**
  #         —— 它是解析器语义的第二份实现（存在理由：Python 不是「拿着这个仓库就一定有」的
  #         依赖，而打 Electron 包必然已有 node）。第二份实现的最大风险就是**两侧悄悄漂移**，
  #         `--parity` 是把两侧对同一批 payload 的输出逐项比对（退出码 / `::warning::` 序列 /
  #         错误文案 / `config.json` 字节），是唯一能自动发现漂移的手段。
  #         ⚠️ 必须在 Linux 上跑：本机 Windows 的 Python 会把换行翻成 CRLF，`--parity` 只能
  #            把这种差异降级为「仅行尾不同」的提示；Linux 上两侧都是 LF，比对是逐字节的。
  #
  #    ⚠️⚠️ 本作业**必须在仓库根执行**：契约脚本与 workflow 都在仓库根的 `.github/` 下。
  #        而本文件顶部的 `defaults.run.working-directory: webview-app` 会把每个 `run:`
  #        拽进 `webview-app/`，在那里 `.github/scripts/...` 并不存在 ⇒ 必须用
  #        **作业级 `defaults` 覆盖回仓库根**（作业级优先级高于 workflow 级）。
  # ---------------------------------------------------------------------------
  config-contract:
    name: Config contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: 解析器契约自测（唯一真源不漂移）
        run: python3 .github/scripts/parse-packaging-config.py --selftest

      - name: 安卓共享脚本自测（工程根解析 / 包名派生 / 应用名 / insets / APK 名 / 返回键）
        # 这些脚本原先各是 build-custom.yml 与 release.yml 里的**内联 python**（两壳各一份），
        # 现抽成共享脚本；它们只在 Android 打包时才被执行，不挂门禁就等于「本地不跑、CI 不跑」。
        # ⚠️ 必须在仓库根跑：`from android_gen import ...` 靠脚本所在目录进 sys.path。
        # android_gen.py 是纯模块（无 --selftest），由下面各脚本的 import 顺带覆盖。
        run: |
          set -euo pipefail
          for s in prepare-android-conf apply-android-labels \
                   patch-android-insets set-android-apk-name patch-android-back; do
            echo "── $s.py --selftest ──"
            python3 ".github/scripts/$s.py" --selftest
          done

      - name: 本地打包入口（Node 版）自测 + 与解析器对等性比对
        # ubuntu-latest 自带 node（≥18 即可，脚本零第三方依赖）；python3 也在 ⇒ --parity 能真跑。
        run: |
          node scripts/pack-local.mjs --selftest
          node scripts/pack-local.mjs --parity

      - name: 静态检查所有 workflow（YAML + 内联 python/bash）
        run: python3 .github/scripts/check-workflows.py

      - name: 仓库内配置样例必须符合契约
        shell: bash
        # 逐个喂给解析器（它默认从 CONFIG_JSON 环境变量读配置）。
        # ⚠️ 不在这里校验 `signing/packaging-config*.json`：`signing/` 被根 .gitignore
        #    忽略（内含明文 keystore 与密码），CI 上根本不存在这些文件。
        run: |
          set -uo pipefail
          fail=0
          # test1.json / test2.json 是本地手工打包工作文件，已移入 tests/（.gitignore 忽略、不入库）。
          for f in webview-app/config.example.json \
                   electron-app/config.example.json; do
            if CONFIG_JSON="$(cat "$f")" python3 .github/scripts/parse-packaging-config.py > /dev/null; then
              echo "OK   $f"
            else
              echo "::error file=$f::$f 不符合打包配置契约（见 docs/packaging-config.md）"
              fail=1
            fi
          done
          exit "$fail"


name: 动态解析工具（生成密钥对 / 生成 TXT 密文）

# 手动触发：在 Actions 页选本 workflow → "Run workflow"，选要执行的操作。
#
# 【这个 workflow 是干什么的】
#   为「app_url = 域名数组 + DNS TXT 动态解析」功能提供服务端工具，三个独立操作：
#
#   ① 生成密钥对（genkey）
#       生成一把 Ed25519 密钥对：
#         - private_key.pem  —— 私钥（服务端持有，用于给 URL 签名+加密，切勿公开）
#         - public_key.b64   —— 公钥裸 base64（打包时填进 build-custom.yml 的 public_key）
#       下载后：公钥随应用分发（打进去），私钥留着自己生成密文用。
#
#   ② 生成 TXT 密文（encrypt）
#       用一把已有的私钥，对一个或多个真实 URL 做 Ed25519 签名 + AES-256-GCM 加密，
#       输出一组 base64 密文（每行一条，均可写入某个跳板域名的 DNS TXT 记录）。
#       支持指定有效期 ttl（秒）：>0 表示生成后 ttl 秒内有效；0 表示永不失效。
#       支持指定 count（份数）：每个 URL 生成多份密文（随机 Nonce/盐，密文不同但解密
#       结果相同），可把同一个地址分发到多个域名 / 多条 TXT 记录。
#
#   ③ 一键生成密钥对 + 密文（all）
#       同时生成密钥对，并立即用它加密一组 URL，一次拿到「私钥 + 公钥 + 一组密文」，
#       适合首次部署一次性备齐。
#
# 【与 Python 工具等价】本 workflow 用纯 Rust 的 `resolve-tool`（crates/resolve-tool，独立 crate，
#   仅依赖 resolve-core，不编译 Tauri），与 tools/encrypt_url.py 完全互通（私钥格式、密文格式一致），
#   无需 Python cryptography 依赖。

on:
  workflow_dispatch:
    inputs:
      action:
        description: '要执行的操作'
        required: true
        type: choice
        options:
          - genkey（生成密钥对）
          - encrypt（生成 TXT 密文）
          - all（一键生成密钥对 + 密文）
      private_key:
        description: '【encrypt 用】Ed25519 私钥 PEM 全文（含 BEGIN/END 行）'
        required: false
      url:
        description: '【encrypt / all 用】要加密的真实 URL，多个用空格或换行分隔（如 https://a.com https://b.com）'
        required: false
      count:
        description: '【encrypt / all 用】每个 URL 生成的密文份数（同一 URL 的多份密文解密结果相同，可分发到多个域名/多条 TXT；默认 1）'
        required: false
        default: '1'
      ttl:
        description: '【encrypt / all 用】有效期秒数（0=永不失效；默认 172800=48h）'
        required: false
        default: '172800'
      secret:
        description: '【encrypt / all 用，可选】AES 对称加密 Secret，**必须与打包时 build-custom.yml 配置的 resolve_secret 一致**（否则该包解密失败）。不填 = 自动生成一把随机 Secret（写入产物说明文件，打包时把它填进 resolve_secret 即可）。填了则本次密文只能用"同一 secret 打的包"解密。'
        required: false

# ⚠️ 单仓库化（2026-09-22）：仓库根已上移，Rust 工程在 `webview-app/` 子目录。
#    三个 job 的 `cargo run -p resolve-tool ...` 都统一在 webview-app/ 下执行。
#    上传用的 path 全部是 ${{ runner.temp }} 绝对路径，无需加前缀。
defaults:
  run:
    working-directory: webview-app

jobs:
  # ---------------------------------------------------------------------------
  # ① 生成密钥对
  # ---------------------------------------------------------------------------
  genkey:
    name: 生成 Ed25519 密钥对
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'genkey（生成密钥对）' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 生成密钥对（resolve-tool genkey）
        shell: bash
        run: |
          cargo run -p resolve-tool -- genkey --out "$RUNNER_TEMP/resolve-keys"

      - name: 附上使用说明
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/resolve-keys/README.txt" <<'EOF'
          Ed25519 密钥对（用于 app_url 域名数组 + DNS TXT 动态解析）

          文件说明：
            private_key.pem   —— 私钥（服务端持有）。用于给真实 URL 签名 + 加密，切勿公开/提交仓库。
            public_key.b64    —— 公钥裸 base64。打包时填进 build-custom.yml 的 public_key 字段（或仓库
                                 Secrets/Variables 的 PUBLIC_KEY），随应用分发。

          使用流程：
            1) 用本 workflow 的 encrypt 操作 + private_key.pem，对真实 URL 生成密文；
            2) 把密文写入某个跳板域名的 DNS TXT 记录；
            3) 打包时 app_url 填该域名的数组形式（如 ["txttest1.lcjm.cc"]），public_key 填
               public_key.b64 的内容；运行时应用会查 TXT → 验签 + 解密 → 得到真实 URL。

          安全提醒：
            * public_key 公开无害（只能验签，不能伪造）；private_key 泄露 = 任何人可伪造密文劫持网址。
            * 请把 private_key.pem 妥善备份到安全处；本 artifact 下载后建议从 Actions 删除。
          EOF

      - name: 上传密钥对
        uses: actions/upload-artifact@v7
        with:
          name: resolve-keys
          path: ${{ runner.temp }}/resolve-keys/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # ② 生成 TXT 密文
  # ---------------------------------------------------------------------------
  encrypt:
    name: 生成 TXT 密文
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'encrypt（生成 TXT 密文）' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 校验输入 + 写入私钥
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
          # 关键：用 toJSON 把多行私钥编码成 JSON 字符串（换行→\n 字面量）。
          # 若直接 `env: PRIVATE_KEY: ${{ github.event.inputs.private_key }}`，多行值会被
          # YAML 折叠（换行→空格），PEM 压成一行 → base64 body 被过滤 → DER 长度 0 报错。
          PRIVATE_KEY_JSON: ${{ toJSON(github.event.inputs.private_key) }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::必须提供 url（要加密的真实 URL，可用空格分隔多个）"; exit 1
          fi
          if ! echo "$TTL" | grep -Eq '^[0-9]+$'; then
            echo "::error::ttl 必须是非负整数秒数，收到：$TTL"; exit 1
          fi
          if ! echo "$COUNT" | grep -Eq '^[0-9]+$' || [ "$COUNT" -lt 1 ]; then
            echo "::error::count 必须是正整数，收到：$COUNT"; exit 1
          fi
          # 从 JSON 字符串还原私钥的真实换行，写入临时文件（不打印到日志）。
          printf '%s' "$PRIVATE_KEY_JSON" | python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin))' \
            > "$RUNNER_TEMP/private_key.pem"
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/private_key.pem"; then
            echo "::error::private_key 缺少 BEGIN PRIVATE KEY 头（可能为空或格式错误）"; exit 1
          fi

      - name: 生成 TXT 密文（resolve-tool encrypt）
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
          SECRET: ${{ github.event.inputs.secret }}
        # ⚠️ resolve-tool 的 Secret 是编译期 option_env!("RESOLVE_SECRET")：必须在 cargo 编译
        #    前把 RESOLVE_SECRET 注入到环境，编进二进制的是这个 secret；cargo 会按
        #    dep-info 的 env-dep 感知变化并重编。
        #    ● 填了 secret：用它（本次密文只被"同一 secret 打的包"解密）。
        #    ● 未填：自动生成一把随机 secret（避免所有产物共享同一固定默认串），写进
        #      GITHUB_ENV（SECRET_EFFECTIVE）供后续步骤与说明文档复用同一值。
        run: |
          if [ -n "$SECRET" ]; then
            SECRET_EFFECTIVE="$SECRET"
          else
            # openssl rand -hex 16 → 32 个 hex 字符，128bit 熵；github runner 自带 openssl。
            SECRET_EFFECTIVE="$(openssl rand -hex 16)"
            echo "未配置 secret，已自动生成随机 Secret"
          fi
          echo "SECRET_EFFECTIVE=$SECRET_EFFECTIVE" >> "$GITHUB_ENV"
          # 只对这条 cargo 命令注入 RESOLVE_SECRET（不 export 避免污染后续 step）。
          RESOLVE_SECRET="$SECRET_EFFECTIVE" cargo run -p resolve-tool -- encrypt "$RUNNER_TEMP/private_key.pem" $URL --ttl "$TTL" --count "$COUNT" \
            | tee "$RUNNER_TEMP/cipher.txt"

      - name: 导出密文 + 使用说明
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
          SECRET: ${{ env.SECRET_EFFECTIVE }}
        run: |
          # 读取上一步写入的最终生效 Secret（填了=用户的；未填=刚自动生成的随机串）。
          SECRET_LABEL="${SECRET:-<未指定>}"
          {
            echo "TXT 密文（每条均可写入 DNS TXT 记录）"
            echo "======================================================"
            echo "URL : $URL"
            echo "ttl : $TTL 秒（0=永不失效）"
            echo "份数: 每个 URL 生成 $COUNT 份（同一 URL 的多份密文解密结果相同）"
            echo "Secret: $SECRET_LABEL（打包时 build-custom.yml 的 resolve_secret 必须填这同一个，否则该包解密失败）"
            echo ""
            echo "密文（一组，逐条对应上面的 URL）："
            grep -v '^#' "$RUNNER_TEMP/cipher.txt" | tr -d '[:space:]' | grep -v '^$'
            echo ""
            echo "【如何设置 DNS TXT】"
            echo "  在你的跳板域名下新增 TXT 记录，值为上面任意一条密文。"
            echo "  注意：TXT 记录值要用双引号包起来（DNS 控制台一般会自动加）。"
            echo ""
            echo "【如何打包使用】"
            echo "  build-custom.yml 的 config_json 里："
            echo "    \"app_url\": [\"你的跳板域名\"],"
            echo "    \"public_key\": \"<与此私钥配对的公钥>\""
            echo "    \"resolve_secret\": \"${SECRET}\""
          } > "$RUNNER_TEMP/cipher-info.txt"
          echo "--- cipher-info.txt ---"
          cat "$RUNNER_TEMP/cipher-info.txt"

      - name: 上传密文 + 说明
        uses: actions/upload-artifact@v7
        with:
          name: resolve-cipher
          path: ${{ runner.temp }}/cipher-info.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # ③ 一键生成密钥对 + 密文
  # ---------------------------------------------------------------------------
  all:
    name: 一键生成密钥对 + 密文
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'all（一键生成密钥对 + 密文）' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 校验输入
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::必须提供 url（要加密的真实 URL，可用空格分隔多个）"; exit 1
          fi
          if ! echo "$TTL" | grep -Eq '^[0-9]+$'; then
            echo "::error::ttl 必须是非负整数秒数，收到：$TTL"; exit 1
          fi
          if ! echo "$COUNT" | grep -Eq '^[0-9]+$' || [ "$COUNT" -lt 1 ]; then
            echo "::error::count 必须是正整数，收到：$COUNT"; exit 1
          fi

      - name: 一键生成密钥对 + 密文（resolve-tool all）
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
          SECRET: ${{ github.event.inputs.secret }}
        run: |
          # 先建目录再 tee：否则 `tee .../resolve-all/result.txt` 会在目录尚未被
          # resolve-tool create_dir_all 创建时（首次编译需十几秒）打开失败 → 退出码 1，
          # 管道退出码取 tee 的 → 整个 step 报 exit code 1（即使 all 本身已成功产出）。
          mkdir -p "$RUNNER_TEMP/resolve-all"
          # secret 解析与 encrypt 一致：填了用它；未填自动生成随机串，写进 GITHUB_ENV 供说明复用。
          if [ -n "$SECRET" ]; then
            SECRET_EFFECTIVE="$SECRET"
          else
            SECRET_EFFECTIVE="$(openssl rand -hex 16)"
            echo "未配置 secret，已自动生成随机 Secret"
          fi
          echo "SECRET_EFFECTIVE=$SECRET_EFFECTIVE" >> "$GITHUB_ENV"
          # 同 encrypt 的注释：必须在 cargo 编译前注入 RESOLVE_SECRET。
          RESOLVE_SECRET="$SECRET_EFFECTIVE" cargo run -p resolve-tool -- all $URL --out "$RUNNER_TEMP/resolve-all" --ttl "$TTL" --count "$COUNT" \
            | tee "$RUNNER_TEMP/resolve-all/result.txt"

      - name: 附上使用说明
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          COUNT: ${{ github.event.inputs.count }}
          SECRET: ${{ env.SECRET_EFFECTIVE }}
        run: |
          cat >> "$RUNNER_TEMP/resolve-all/README.txt" <<'EOF'
          Ed25519 密钥对 + TXT 密文（一次性生成，用于 app_url 域名数组 + DNS TXT 动态解析）

          文件说明：
            private_key.pem   —— 私钥（服务端持有）。切勿公开/提交仓库。
            public_key.b64    —— 公钥裸 base64。打包时填进 build-custom.yml 的 public_key。
            result.txt        —— 生成的密文（一组多条，每条均可写入 DNS TXT 记录）。

          使用流程：
            1) 把 result.txt 里的某条密文写入某个跳板域名的 DNS TXT 记录；
            2) 打包时 app_url 填该域名的数组形式，public_key 填 public_key.b64 的内容；
            3) 运行时应用会查 TXT → 验签 + 解密 → 得到真实 URL。

          安全提醒：
            * public_key 公开无害；private_key 泄露 = 任何人可伪造密文劫持网址，请妥善备份。
          EOF
          {
            echo ""
            echo "本次输入：URL = $URL ，ttl = $TTL 秒（0=永不失效），每 URL 份数 = $COUNT"
          } >> "$RUNNER_TEMP/resolve-all/README.txt"
          # Secret 单独追加（不用 heredoc，避免内容被注释符干扰）：打包 resolve_secret 必须与此一致。
          echo "" >> "$RUNNER_TEMP/resolve-all/README.txt"
          if [ -n "$SECRET" ]; then
            echo "本次 Secret：${SECRET}（打包时 build-custom.yml 的 resolve_secret 必须填这一串，否则该包解密失败）" \
              >> "$RUNNER_TEMP/resolve-all/README.txt"
          else
            echo "本次 Secret：未取到值（应已在生成步骤自动生成）" \
              >> "$RUNNER_TEMP/resolve-all/README.txt"
          fi
          echo "--- README.txt ---"
          cat "$RUNNER_TEMP/resolve-all/README.txt"

      - name: 上传密钥对 + 密文
        uses: actions/upload-artifact@v7
        with:
          name: resolve-all
          path: ${{ runner.temp }}/resolve-all/
          if-no-files-found: error

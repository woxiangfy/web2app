name: 动态解析工具（生成密钥对 / 生成 TXT 密文）

# 手动触发：在 Actions 页选本 workflow → "Run workflow"，选要执行的操作。
#
# 【这个 workflow 是干什么的】
#   为「app_url = 域名数组 + DNS TXT 动态解析」功能提供服务端工具，两个独立操作：
#
#   ① 生成密钥对（genkey）
#       生成一把 Ed25519 密钥对：
#         - private_key.pem  —— 私钥（服务端持有，用于给 URL 签名+加密，切勿公开）
#         - public_key.b64   —— 公钥裸 base64（打包时填进 build-custom.yml 的 public_key）
#       下载后：公钥随应用分发（打进去），私钥留着自己生成密文用。
#
#   ② 生成 TXT 密文（encrypt）
#       用一把已有的私钥，对一个真实 URL 做 Ed25519 签名 + AES-256-GCM 加密，
#       输出 base64 密文（单行），把它写入某个跳板域名的 DNS TXT 记录即可。
#       支持指定有效期 ttl（秒）：>0 表示生成后 ttl 秒内有效；0 表示永不失效。
#
# 【与 Python 工具等价】本 workflow 用纯 Rust 的 `resolve-tool`（crates/resolve-tool，独立 crate，
#   仅依赖 resolve-core，不编译 Tauri），与 tools/encrypt_url.py 完全互通（私钥格式、密文格式一致），
#   无需 Python cryptography 依赖。

on:
  workflow_dispatch:
    inputs:
      action:
        description: '要执行的操作'
        required: true
        type: choice
        options:
          - genkey（生成密钥对）
          - encrypt（生成 TXT 密文）
      private_key:
        description: '【encrypt 用】Ed25519 私钥 PEM 全文（含 BEGIN/END 行）'
        required: false
      url:
        description: '【encrypt 用】要加密的真实 URL（如 https://example.com）'
        required: false
      ttl:
        description: '【encrypt 用】有效期秒数（0=永不失效；默认 172800=48h）'
        required: false
        default: '172800'

jobs:
  # ---------------------------------------------------------------------------
  # ① 生成密钥对
  # ---------------------------------------------------------------------------
  genkey:
    name: 生成 Ed25519 密钥对
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'genkey（生成密钥对）' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 生成密钥对（resolve-tool genkey）
        shell: bash
        run: |
          cargo run -p resolve-tool -- genkey --out "$RUNNER_TEMP/resolve-keys"

      - name: 附上使用说明
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/resolve-keys/README.txt" <<'EOF'
          Ed25519 密钥对（用于 app_url 域名数组 + DNS TXT 动态解析）

          文件说明：
            private_key.pem   —— 私钥（服务端持有）。用于给真实 URL 签名 + 加密，切勿公开/提交仓库。
            public_key.b64    —— 公钥裸 base64。打包时填进 build-custom.yml 的 public_key 字段（或仓库
                                 Secrets/Variables 的 PUBLIC_KEY），随应用分发。

          使用流程：
            1) 用本 workflow 的 encrypt 操作 + private_key.pem，对真实 URL 生成密文；
            2) 把密文写入某个跳板域名的 DNS TXT 记录；
            3) 打包时 app_url 填该域名的数组形式（如 ["txttest1.lcjm.cc"]），public_key 填
               public_key.b64 的内容；运行时应用会查 TXT → 验签 + 解密 → 得到真实 URL。

          安全提醒：
            * public_key 公开无害（只能验签，不能伪造）；private_key 泄露 = 任何人可伪造密文劫持网址。
            * 请把 private_key.pem 妥善备份到安全处；本 artifact 下载后建议从 Actions 删除。
          EOF

      - name: 上传密钥对
        uses: actions/upload-artifact@v7
        with:
          name: resolve-keys
          path: ${{ runner.temp }}/resolve-keys/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # ② 生成 TXT 密文
  # ---------------------------------------------------------------------------
  encrypt:
    name: 生成 TXT 密文
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'encrypt（生成 TXT 密文）' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 校验输入 + 写入私钥
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
          # 关键：用 toJSON 把多行私钥编码成 JSON 字符串（换行→\n 字面量）。
          # 若直接 `env: PRIVATE_KEY: ${{ github.event.inputs.private_key }}`，多行值会被
          # YAML 折叠（换行→空格），PEM 压成一行 → base64 body 被过滤 → DER 长度 0 报错。
          PRIVATE_KEY_JSON: ${{ toJSON(github.event.inputs.private_key) }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::必须提供 url（要加密的真实 URL）"; exit 1
          fi
          if ! echo "$TTL" | grep -Eq '^[0-9]+$'; then
            echo "::error::ttl 必须是非负整数秒数，收到：$TTL"; exit 1
          fi
          # 从 JSON 字符串还原私钥的真实换行，写入临时文件（不打印到日志）。
          printf '%s' "$PRIVATE_KEY_JSON" | python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin))' \
            > "$RUNNER_TEMP/private_key.pem"
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/private_key.pem"; then
            echo "::error::private_key 缺少 BEGIN PRIVATE KEY 头（可能为空或格式错误）"; exit 1
          fi

      - name: 生成 TXT 密文（resolve-tool encrypt）
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
        run: |
          cargo run -p resolve-tool -- encrypt "$RUNNER_TEMP/private_key.pem" "$URL" --ttl "$TTL" \
            | tee "$RUNNER_TEMP/cipher.txt"

      - name: 导出密文 + 使用说明
        shell: bash
        env:
          URL: ${{ github.event.inputs.url }}
          TTL: ${{ github.event.inputs.ttl }}
        run: |
          CIPHER=$(grep -v '^#' "$RUNNER_TEMP/cipher.txt" | tr -d '[:space:]')
          {
            echo "TXT 密文（写入 DNS TXT 记录的单行 base64）"
            echo "======================================================"
            echo "URL : $URL"
            echo "ttl : $TTL 秒（0=永不失效）"
            echo ""
            echo "密文："
            echo "$CIPHER"
            echo ""
            echo "【如何设置 DNS TXT】"
            echo "  在你的跳板域名（如 txttest1.example.com）下新增一条 TXT 记录，值为上面这行密文。"
            echo "  注意：TXT 记录值要用双引号包起来（DNS 控制台一般会自动加）。"
            echo ""
            echo "【如何打包使用】"
            echo "  build-custom.yml 的 config_json 里："
            echo "    \"app_url\": [\"你的跳板域名\"],"
            echo "    \"public_key\": \"<与此私钥配对的公钥>\""
          } > "$RUNNER_TEMP/cipher-info.txt"
          echo "--- cipher-info.txt ---"
          cat "$RUNNER_TEMP/cipher-info.txt"

      - name: 上传密文 + 说明
        uses: actions/upload-artifact@v7
        with:
          name: resolve-cipher
          path: ${{ runner.temp }}/cipher-info.txt
          if-no-files-found: error

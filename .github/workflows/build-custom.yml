name: 自定义打包（JSON 配置生成应用）

# 手动触发：在仓库 Actions 页点 "Run workflow"，
#   粘贴一份配置 JSON（或填一个返回 JSON 的 URL），即可生成对应应用。
#   一次触发同时产出 Windows 安装包（msi/nsis）和 Android APK。
#
# 配置 JSON 字段（除 app_url 必填外，其余均可省略、自动合并默认值）：
#   {
#     "app_url": "https://user:pass@host",   // 必填，要嵌入的网址（支持带账号密码）
#     "app_name": "MyApp",                   // 运行期显示名（默认 Web2App）
#     "window_title": "我的应用",             // 窗口标题（默认同 app_name）
#     "proxy_enabled": "true",               // 是否启用本地反向代理注入鉴权（默认 false）
#     "proxy_http": "",                      // 外部 HTTP 代理（默认空）
#     "proxy_https": "",                     // 外部 HTTPS 代理（默认空）
#     "proxy_bypass": "",                    // 不走代理的地址，分号分隔（默认空=代码内置）
#     "data_dir_default": "false"            // WebView2 数据目录（默认 false=LOCALAPPDATA）
#   }
#
# 想"一键生成某个固定应用"：把 config_url 固定指向仓库内一份 .json（如 docs/myapp.json），
# 或把 config_json 直接写死在下面 job 的 env 里，无需改源码即可为每个应用产出独立安装包。
on:
  workflow_dispatch:
    inputs:
      config_json:
        description: '配置 JSON 字符串（单行）。与 config_url 二选一，都填则以本项为准'
        required: false
      config_url:
        description: '或填一个返回上述 JSON 的 URL（公开可访问）'
        required: false

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 单一入口：接受 JSON 字符串或 JSON URL，解析后与默认值合并，
      # 把最终 8 个编译期变量写入 GITHUB_ENV，后续步骤直接作为环境变量读取。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          # Windows runner 上 Python 默认 stdout/stderr 是 cp1252，输出中文会 UnicodeEncodeError，
          # 这里强制 UTF-8（双保险：环境变量 + 脚本内 reconfigure）。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python - <<'PY'
          import os, sys, json, re, urllib.request

          # 强制 stdout/stderr 走 UTF-8，避免 Windows cp1252 编码中文时报错。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          DEFAULTS = {
              "app_url": "",
              "app_name": "Web2App",
              "window_title": "",
              "proxy_enabled": "false",
              "proxy_http": "",
              "proxy_https": "",
              "proxy_bypass": "",
              "data_dir_default": "false",
          }
          BOOL_KEYS = {"proxy_enabled", "data_dir_default"}

          raw = (os.environ.get("CONFIG_JSON") or "").strip()
          url = (os.environ.get("CONFIG_URL") or "").strip()

          if not raw and url:
              req = urllib.request.Request(url, headers={"User-Agent": "web2app-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8").strip()

          if not raw:
              sys.exit("必须提供 config_json 或 config_url，二者至少填一个")

          try:
              data = json.loads(raw)
          except Exception as e:
              sys.exit(f"配置不是合法 JSON：{e}")
          if not isinstance(data, dict):
              sys.exit("配置 JSON 必须是对象（字典）")

          merged = dict(DEFAULTS)
          for k, v in data.items():
              if k not in merged:
                  print(f"::warning::忽略未知字段 {k}")
                  continue
              if v is None:
                  continue
              if isinstance(v, bool):
                  v = "true" if v else "false"
              else:
                  v = str(v)
              merged[k] = v

          merged["app_url"] = merged["app_url"].strip()
          if not merged["app_url"]:
              sys.exit("缺少必填字段 app_url")
          for k in BOOL_KEYS:
              merged[k] = merged[k].strip().lower()

          # 打印时隐藏 URL 里的账号密码，避免泄漏到日志。
          def mask(u):
              return re.sub(r"(://[^/@\s]+)@", "://***@", u)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in merged.items():
                  f.write(f"{k.upper()}={v}\n")

          print("已注入环境变量：")
          for k, v in merged.items():
              shown = mask(v) if k == "app_url" else v
              print(f"  {k.upper()}={shown}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build (tauri, 编译期注入配置)
        # cargo tauri build 时，Rust 编译期常量 APP_URL/APP_NAME/... 读取上一步注入的环境变量。
        run: cargo tauri build

      - name: 重命名产物（按 APP_NAME 区分不同应用）
        # 注意：这里只改安装包"文件名"，程序内部显示名已随 APP_NAME 注入生效；
        # 若还要改安装目录 / 可执行文件名 / 托盘标识等，需同步改 tauri.conf.json 的
        # productName / identifier（可另行做一套 workflow 模板）。
        shell: pwsh
        run: |
          $name = $env:APP_NAME -replace '[\\/:*?"<>|]', '_'
          if ($name -ne 'Web2App') {
            $msi  = "target/release/bundle/msi"
            $nsis = "target/release/bundle/nsis"
            if (Test-Path $msi)  { Get-ChildItem "$msi\Web2App*.msi"  | Rename-Item -NewName { $_.Name -replace 'Web2App', $name } }
            if (Test-Path $nsis) { Get-ChildItem "$nsis\Web2App*.exe" | Rename-Item -NewName { $_.Name -replace 'Web2App', $name } }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 名固定为 windows-installers（APP_NAME 已在安装包文件名上体现）。
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。本作业会在 CI 上【自动生成 gen/android 并交叉编译出 APK】，
  # 因此无需在本地安装 Android SDK/NDK/JDK。gen/ 已被 .gitignore 忽略，每次构建现生成，避免漂移。
  # 尽力而为：Android 首次构建可能存在工具链/真机行为问题，失败不影响 Windows 产物。
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 与 Windows job 相同的解析逻辑：把 JSON 配置注入为环境变量，供 cargo 编译期读取。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python3 - <<'PY'
          import os, sys, json, re, urllib.request

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          DEFAULTS = {
              "app_url": "",
              "app_name": "Web2App",
              "window_title": "",
              "proxy_enabled": "false",
              "proxy_http": "",
              "proxy_https": "",
              "proxy_bypass": "",
              "data_dir_default": "false",
          }
          BOOL_KEYS = {"proxy_enabled", "data_dir_default"}

          raw = (os.environ.get("CONFIG_JSON") or "").strip()
          url = (os.environ.get("CONFIG_URL") or "").strip()

          if not raw and url:
              req = urllib.request.Request(url, headers={"User-Agent": "web2app-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8").strip()

          if not raw:
              sys.exit("必须提供 config_json 或 config_url，二者至少填一个")

          try:
              data = json.loads(raw)
          except Exception as e:
              sys.exit(f"配置不是合法 JSON：{e}")
          if not isinstance(data, dict):
              sys.exit("配置 JSON 必须是对象（字典）")

          merged = dict(DEFAULTS)
          for k, v in data.items():
              if k not in merged:
                  print(f"::warning::忽略未知字段 {k}")
                  continue
              if v is None:
                  continue
              if isinstance(v, bool):
                  v = "true" if v else "false"
              else:
                  v = str(v)
              merged[k] = v

          merged["app_url"] = merged["app_url"].strip()
          if not merged["app_url"]:
              sys.exit("缺少必填字段 app_url")
          for k in BOOL_KEYS:
              merged[k] = merged[k].strip().lower()

          def mask(u):
              return re.sub(r"(://[^/@\s]+)@", "://***@", u)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in merged.items():
                  f.write(f"{k.upper()}={v}\n")

          print("已注入环境变量：")
          for k, v in merged.items():
              shown = mask(v) if k == "app_url" else v
              print(f"  {k.upper()}={shown}")
          PY

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & build tools
        run: |
          yes | sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Initialize Android project (gen/android)
        # 首次构建时仓库里没有 gen/android，就在 CI 上自动生成。
        # --ci 跳过交互式询问；--skip-targets-install 因为上面已用 rust-toolchain 装了 aarch64 target。
        run: |
          if [ ! -d "gen/android" ]; then
            cargo tauri android init --ci --skip-targets-install
          fi

      - name: Allow cleartext HTTP (localhost proxy)
        # 应用通过本地反向代理加载 http://127.0.0.1:<port>；Android 9+ 默认禁止明文 HTTP，
        # release 构建的 usesCleartextTraffic 默认为 false，必须置 true 否则鉴权代理真机上加载失败。
        run: |
          sed -i -E 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' gen/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        # --apk 仅产出 APK（便于直接安装测试）；若要上架 Play Store 的 AAB，去掉 --apk 即可。
        run: cargo tauri android build --target aarch64-linux-android --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # artifact 名固定为 android-apk。
          name: android-apk
          path: gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: 自定义打包

# 手动触发：在仓库 Actions 页点 "Run workflow"，
#   ① 勾选本次要打哪些产物（默认全选，互不依赖）：
#       - Windows 安装版(MSI)    —— 需双击安装、写注册表的正式安装包
#       - Windows 单文件版(zip)   —— 免安装绿色版（最终包 <app_name>-portable.zip，内含单个 <app_name>.exe）
#       - Android APK             —— 已签名、可直接安装的安卓包
#   想打哪个就勾哪个；产物分别独立上传到各自的 artifact。
#   ② 粘贴一份配置 JSON（或填一个返回 JSON 的 URL），即可生成对应应用。
#
# 配置 JSON 字段（除 app_url 必填外，其余均可省略、自动合并默认值）：
#
#   ⚠️ 完整字段表、类型、默认值与「多端（Windows / Android / Electron 绿色版）行为对照」
#      见 docs/packaging-config.md —— 本注释只是摘要，冲突时以那份文档为准。
#   ⚠️ 解析的**唯一实现**在 .github/scripts/parse-packaging-config.py，
#      三个打包入口（本文件 windows / android 两个 job + electron-build-custom.yml）
#      调用的是同一份代码。合约变更必须同时改那份脚本与其自测。
#
#   {
#     "app_url": "https://user:pass@host",   // 必填，要嵌入的网址（支持带账号密码）。
#                                            //   也可写成【域名数组】：["a.com","b.com"] ——
#                                            //   此时必填 public_key，运行时依次对这些域名做
#                                            //   DNS TXT 查询、验签 + 解密得到真实 URL。
#                                            //   两种形态都是合法 JSON 类型（string / array）。
#
#     "app_name": "MyApp",                   // 【安装名】（默认 Web2App）——给系统/安装器看的：
#                                            //   Windows 安装包名、开始菜单与桌面快捷方式、
#                                            //   安装目录、"程序和功能"显示名；
#                                            //   同时也是两端的数据存储目录名（设置文件所在目录）
#     "title": "我的应用",                    // 【显示名】（默认同 app_name）——给用户看的：
#                                            //   Windows 端窗口标题、托盘悬停提示、右键菜单"设置"项标题、
#                                            //   Android 端应用名称（桌面图标下的名字）
#                                            //   （与 app_name 分开，便于"安装包叫英文名、界面叫中文名"）
#                                            //   ⚠️ 旧字段 window_title 已移除，写了会直接报错
#
#     "version": "1.2.3",                    // 打包产物版本号（默认 "0.0.1"）：三段数字 "主.次.补丁"，
#                                            //   不带 v 前缀 / 第四段 / 预发布标签；主次 ≤ 255、补丁 ≤ 65535。
#                                            //   Windows：MSI/NSIS 包版本（ProductVersion）、exe 文件版本、
#                                            //     安装包文件名（<app_name>_<version>_x64_zh-CN.msi）；
#                                            //   Android：versionName（versionCode 由其派生）；
#                                            //   Electron 绿色版：安装包/产物文件名与 exe 版本资源。
#                                            //   只影响打包产物，不改仓库内 Cargo.toml / package.json 的开发态版本
#
#     "extra": { "k": "v" },                 // 附加参数（默认 {}）：任意 JSON 对象/数组/标量，
#                                            //   会被注入到被包裹网页，前端 JS 通过
#                                            //   window.web2appExtra 直接读取
#     "icon_url": "https://example.com/logo.png", // 应用图标 PNG 的 URL（默认空=沿用仓库默认图标）
#                                            //   建议 1024x1024 正方形 PNG；两壳都用它生成全套图标
#     "proxy_enabled": true,                 // 布尔，**不带引号**（默认 false）：
#                                            //   是否启用代理注入鉴权
#     "proxy_http": "",                      // 外部 HTTP 代理（默认空）
#     "proxy_https": "",                     // 外部 HTTPS 代理（默认空）
#     "proxy_bypass": "",                    // 不走代理的地址，分号分隔
#                                            //   （默认 "localhost;127.0.0.1;<-loopback>"，两壳一致）
#     "public_key": "HkCpkH1tMpNIxWoWAkvlX8vm93BOc5PtIKrQxl8RUDo=", // Ed25519 公钥（裸 base64 或 SPKI PEM）。
#                                            //   仅当 app_url 为【域名数组】时必填：运行时对每个域名
#                                            //   做 DNS TXT 查询，TXT 值是一段 base64 密文，用本公钥
#                                            //   验签 + AES-GCM 解密得到真实 URL。任一域名解析/解密/验签
#                                            //   失败自动尝试下一个，全部失败报"服务器连接失败"。
#     "resolve_secret": "my-secret-2026",    // （可选，默认内置值）AES 对称加密 Secret，需与服务端
#                                            //   生成 TXT 密文时用的 Secret 一致（resolve-tool encrypt
#                                            //   --secret 或环境变量 RESOLVE_SECRET）。默认空=用代码内置
#                                            //   默认值。填了就为本次产物单独指定 Secret，
#                                            //   使每个包不再共享同一个固定密钥串（提高反编译门槛）。
#                                            //   ⚠️ 它是**编译期**注入：两个壳都一样，改了必须重新打包。
#     "data_dir": "data",                    // 字符串（默认 "data"，两壳行为一致）= 应用数据放哪：
#                                            //   "data"   = 程序所在目录（exe 目录）下的 data\，
#                                            //              跟着程序走（绿色 / 便携）
#                                            //   ""(空串) = 系统默认程序目录，由 app_name 命名、
#                                            //              不受程序位置影响
#                                            //   其它相对路径 = 同上，基准仍是 exe 目录（不是 cwd）
#                                            //   绝对路径     = 原样使用
#                                            //   ⚠️ 目录不可写会自动回退到系统默认目录（保证能启动）
#                                            //   Windows(Tauri)：系统默认 = %LOCALAPPDATA%\<app_name>
#                                            //   Electron 绿色版：系统默认 = %APPDATA%\<app_name>
#                                            //   Android：忽略（始终用应用私有目录）
#                                            //   ⚠️ 旧布尔字段 data_dir_default 已移除：
#                                            //      false ⇒ "data"、true ⇒ ""（写了会直接报错）
#                                            //   对照表见 docs/packaging-config.md §4.3
#     "tabs_enabled": false,                 // 布尔，**不带引号**（默认 false）：
#                                            //   Windows true = 宿主窗口 + 顶部标签栏，每个 tab 是独立
#                                            //   WebView 且共享同一数据目录（同账号，cookie/localStorage
#                                            //   互通），target="_blank" / window.open() 直接新开 tab；
#                                            //   Android true = 底栏内单 webview 页签记录（列表/新建/
#                                            //   切换/关闭；切换按记录 url 重载，状态不保留），需同时
#                                            //   开 mobile_bar 才有入口。
#     "mobile_bar": false,                   // 布尔，**不带引号**（默认 false，仅移动端生效）：
#                                            //   true = 移动端屏幕底部常驻一条导航条 ——
#                                            //     首页（回到 app_url）/ 后退 / 前进 / 列表；
#                                            //   false = 移动端没有任何壳自绘控件（默认）。
#                                            //   Windows / Electron 桌面端忽略此开关
#                                            //   （底栏只在移动端实现，桌面端连代码路径都没有）。
#                                            //   ⚠️「列表」按钮只在 tabs_enabled=true 时才渲染
#                                            //     （移动端单 webview 页签记录），否则只画前三个按钮，
#                                            //     不会出现点了没反应的死按钮。
#     "android_keystore_base64": "...",      // Android 签名 keystore(.jks/.keystore) 的 base64（可选，
#                                            //   优先于仓库 secrets；正式签名，跨构建可覆盖升级）
#     "android_key_alias": "my-alias",       // keystore 别名（配了 keystore 时必填）
#     "android_keystore_password": "****",   // keystore 密码（配了 keystore 时必填）
#     "android_key_password": "",            // key 密码（可选，默认同 keystore 密码）
#     "android_permissions": []              // 字符串数组（可选，仅 Android；默认 [] = 不声明）：
#                                            //   按需加入 "camera" / "microphone" / "location"，
#                                            //   打包期映射进 AndroidManifest.xml；未声明时网页
#                                            //   getUserMedia / geolocation 会被系统直接 deny。
#   }
#
# 字段名拼错 / 类型不对 / 写了已移除的字段 ⇒ **直接失败**（不是警告）。
# 曾经只打 ::warning:: 就跳过，于是「拼错」与「不生效」表现完全一样，只能靠猜。
#
# 配置模板：webview-app/config.example.json（Tauri / Android 侧，含全部 21 个字段）
#           electron-app/config.example.json（Electron 绿色版侧，省略仅 Android 用的 android_*）
#   ⚠️ 两份模板覆盖同一份契约，字段名与类型完全一致；差异只在「本端不用的字段是否列出」。
#      JSON 标准不支持注释，故模板保持纯 JSON，各字段含义见上面这份说明与 docs/packaging-config.md。
#
# 想"一键生成某个固定应用"：把 config_url 固定指向仓库内一份 .json（如 config.example.json），
# 或把 config_json 直接写死在下面 job 的 env 里，无需改源码即可为每个应用产出独立安装包。
on:
  workflow_dispatch:
    inputs:
      config_json:
        description: '配置 JSON 字符串（单行）。与 config_url 二选一，都填则以本项为准'
        required: false
      config_url:
        description: '或填一个返回上述 JSON 的 URL（公开可访问）'
        required: false
      windows_installer:
        description: '打 Windows 安装版(MSI) —— 双击安装、写注册表的正式安装包'
        required: false
        default: false
        type: boolean
      windows_portable:
        description: '打 Windows 单文件版 —— 免安装绿色版（zip）'
        required: false
        default: true
        type: boolean
      android:
        description: '打 Android APK —— 已签名、可直接安装'
        required: false
        default: false
        type: boolean

# ⚠️ 单仓库化（2026-09-22）：仓库根已上移，Rust 工程在 `webview-app/` 子目录。
#    所有 run 步骤（含读写 `tauri.conf.json`、`gen/android/...` 的内联脚本，
#    以及 `target/release/web2app.exe` 的复制/改名）统一在 webview-app/ 下执行。
#    `uses:` 步骤不受影响；但 upload-artifact 的 `path:` 以**仓库根**为基准解析，
#    需要 `webview-app/` 前缀（本文件内两处已改，见下方 ⚠️ 注释）。
defaults:
  run:
    working-directory: webview-app

jobs:
  # 各 job 用【独立复选框】决定是否运行：
  #   windows_installer / windows_portable / android 是 workflow_dispatch 的三个 boolean 输入（默认 true）。
  # 布尔表达式统一写成 `!= 'false'`：默认 true、显式勾选为 true、或未传该字段时都视为"要打"；
  # 只有显式取消勾选（= 'false'）才跳过。windows job 在安装版或单文件版任一被勾选时运行。
  windows:
    name: Build Windows
    runs-on: windows-latest
    if: ${{ github.event.inputs.windows_installer != 'false' || github.event.inputs.windows_portable != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # 解析的唯一实现见 .github/scripts/parse-packaging-config.py
      # （Electron 手动打包 workflow 调用的是同一份，契约不再有第二个副本）。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          # Windows runner 上 Python 默认 stdout/stderr 是 cp1252，输出中文会 UnicodeEncodeError，
          # 这里强制 UTF-8（双保险：环境变量 + 脚本内 reconfigure）。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # 配置非法（未知字段 / 字符串布尔 / app_url 形态错 / 数组缺 public_key …）时脚本以退出码 1
        # 结束并打 ::error::，本步骤随之失败 —— 宁可在打包期挡住，也不要产出行为不对的包。
        run: python "$GITHUB_WORKSPACE/.github/scripts/parse-packaging-config.py" --env-out "$GITHUB_ENV"

      - name: 统一安装名称与版本号（app_name → productName，version → tauri.conf.json）
        # 把 app_name 写入 tauri.conf.json 的 productName，统一 Windows 端的"安装名称"：
        #   MSI 安装包文件名 / 开始菜单与桌面快捷方式 / 控制面板"程序和功能"显示名 / 安装目录。
        # 把 version 写入 tauri.conf.json 的 version（配置未给时解析器已注入默认 0.0.1）：
        #   MSI/NSIS 的 ProductVersion 与安装包文件名（<productName>_<version>_x64_zh-CN.msi）、
        #   exe 属性里的文件/产品版本都取它。
        # 同时固定 mainBinaryName=web2app（tauri.conf.json 的【顶层】字段，不是 bundle 下）：
        # 主程序 exe 文件名不随 productName 变化，下方"生成 Windows 单文件版"步骤引用的
        # target/release/web2app.exe 路径保持稳定。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = os.environ.get("APP_NAME", "").strip()
          # 去掉 Windows 文件名非法字符；压缩连续空白；去首尾空格与句点；空则回落默认名
          safe = re.sub(r'[\\/:*?"<>|]+', "_", name) if name else ""
          safe = re.sub(r"\s+", " ", safe).strip(" .") if safe else ""
          if not safe:
              safe = "Web2App"

          # 解析器对所有配置都会注入 VERSION（未配置时默认 0.0.1）；`.get(...)` 兜底只为
          # 本步骤被单独复用时不至于 KeyError。
          version = (os.environ.get("VERSION", "") or "").strip() or "0.0.1"

          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)
          conf["productName"] = safe
          conf["version"] = version
          conf["mainBinaryName"] = "web2app"
          with open("tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(conf, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"productName = {safe}（安装包/快捷方式/安装目录使用该名称；主程序文件名固定为 web2app.exe）")
          print(f"version     = {version}（MSI/NSIS ProductVersion 与 exe 文件版本）")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 下载自定义图标（可选，来自 icon_url）
        # 从 JSON 的 icon_url 下载 PNG，用官方 `cargo tauri icon` 重新生成全套图标
        #（icon.ico / icon.png / 各尺寸），Windows 窗口图标与 MSI 安装包都会使用新图标。
        # 建议 1024x1024 正方形 PNG（带透明通道最佳）。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ICON_URL:-}" ]; then echo "未配置 icon_url，沿用默认图标"; exit 0; fi
          echo "下载图标: $ICON_URL"
          curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
          magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "::error::icon_url 下载的不是 PNG 文件（文件头=$magic）"; exit 1
          fi
          cargo tauri icon icon-custom.png

      - name: 编译并打包 Windows 安装版（MSI）
        # 仅当勾选"Windows 安装版"才执行。--bundles msi：只产 MSI 安装包（不产 NSIS）。
        # 编译期常量 APP_URL/APP_NAME/... 读取之前注入的环境变量；
        # 主二进制 web2app.exe 仍会编译到 target/release/，若同时勾了单文件版可复用它打 zip。
        if: ${{ github.event.inputs.windows_installer != 'false' }}
        run: cargo tauri build --bundles msi

      - name: 编译主程序（单文件版前置，不产 MSI）
        # 仅当【只勾单文件版、未勾安装版】才执行：用 --no-bundle 只编译出 web2app.exe，
        # 跳过 WiX/MSI 打包，省时间。若同时勾了安装版，上一步已产出同款 exe，本步无需再跑。
        if: ${{ github.event.inputs.windows_installer == 'false' && github.event.inputs.windows_portable != 'false' }}
        run: cargo tauri build --no-bundle

      - name: 生成 Windows 单文件版（绿色版 exe，上传即得 <app_name>-portable.zip）
        # 仅当勾选"Windows 单文件版"才执行。把主程序 web2app.exe 复制为 <app_name>.exe。
        # 【不再手工再压一层 zip】：直接把 exe 交给 upload-artifact 打成单个
        # <app_name>-portable.zip（GitHub 只包这一层），既避免"zip 套 zip"的双重压缩，
        # 又让最终下载包的文件名带上 app_name。绿色版免安装，依赖系统自带 WebView2。
        # 要求前面两步中至少一步已产出 web2app.exe。
        if: ${{ github.event.inputs.windows_portable != 'false' }}
        shell: pwsh
        run: |
          # 文件名清洗与 productName 一致（去非法字符、压空白、去首尾空格/句点，空则回落默认）
          $name = $env:APP_NAME -replace '[\\/:*?"<>|]', '_'
          $name = ($name -replace '\s+', ' ').Trim(' .')
          if (-not $name) { $name = 'Web2App' }
          $exe = "target/release/web2app.exe"
          if (-not (Test-Path $exe)) { throw "未找到主程序 $exe（请确认勾选了安装版或单文件版）" }
          Copy-Item $exe "target/release/$name.exe" -Force
          # 把清洗后的名字写回 GITHUB_ENV，供下方上传步骤拼 artifact 名与文件路径，
          # 保证两者一致（都用同一个 $name）。
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_NAME=$name"
          Write-Output "绿色版 exe 已生成：$name.exe（最终下载包为 $name-portable.zip）"

      - name: Upload Windows 安装版 (MSI)
        # MSI 文件名已由 productName 统一（<app_name>_<版本>_x64_zh-CN.msi），无需重命名。
        if: ${{ github.event.inputs.windows_installer != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          # ⚠️ 以仓库根为基准（upload-artifact 不受 defaults.run.working-directory 影响）。
          path: webview-app/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows 单文件版（zip，文件名含 app_name）
        if: ${{ github.event.inputs.windows_portable != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          # 动态命名 artifact：下载得到的就是 <app_name>-portable.zip（内含单个 <app_name>.exe）。
          # 名字取自生成步骤写回的 PORTABLE_NAME，与 exe 文件名保持一致。
          name: ${{ env.PORTABLE_NAME }}-portable
          # ⚠️ 同上前缀说明：以仓库根为基准。
          path: webview-app/target/release/${{ env.PORTABLE_NAME }}.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。本作业会在 CI 上【自动生成 gen/android 并交叉编译出 APK】，
  # 因此无需在本地安装 Android SDK/NDK/JDK。gen/ 已被 .gitignore 忽略，每次构建现生成，避免漂移。
  # 尽力而为：Android 首次构建可能存在工具链/真机行为问题，失败不影响 Windows 产物。
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event.inputs.android != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # 与 Windows job 共用同一份解析实现（见 .github/scripts/parse-packaging-config.py）；
      # 多一个 --android-keystore：把 JSON 里的 keystore 解码落盘并注入 ANDROID_KEYSTORE_* 变量。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量 + 签名 keystore 落盘）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # --target android：启用安卓专属组合校验（内嵌账号密码必须走代理，否则真机必 401）。
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/parse-packaging-config.py" \
            --target android --env-out "$GITHUB_ENV" --android-keystore

      - name: 预写 tauri.conf.json（version / productName / identifier）
        # 逻辑在 .github/scripts/prepare-android-conf.py —— 与 release.yml 调用**同一个脚本**，
        # 不再各存一份内联 python（本仓库历史上同类分裂就漏过 EXTRA / ICON_URL）。
        # 必须在 `cargo tauri android init` **之前**写：init 会把 productName 烘焙成安卓应用名、
        # 把 identifier 烘焙成 Android 包名（Tauri 2 无 bundle.android.package 字段，包名只能
        # 来自 identifier），并把 version 烘焙成 versionName / versionCode。
        # VERSION 由解析步骤注入（缺省 0.0.1）。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: python3 ../.github/scripts/prepare-android-conf.py

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          # ⚠️ 必须显式给 `packages`。本 action 的默认值是 `tools platform-tools`，而 Google
          # 早已下架独立的 `tools` 包（由 cmdline-tools 取代），新版 sdkmanager 对「找不到的包」
          # 直接以 exit code 1 结束（旧版只打警告），整个步骤随之失败：
          #   Warning: Failed to find package 'tools'
          #   Error: The process '.../cmdline-tools/20.0/bin/sdkmanager' failed with exit code 1
          # 这里只保留确实存在的 platform-tools；NDK 由下一步显式安装。
          packages: 'platform-tools'

      - name: Install NDK
        # 版本单一真源见 .github/scripts/install-android-ndk.sh —— 3 个 workflow 共用同一份
        #（原先三处各写死一遍同一个版本号，模板换 NDK 时必然漂移）。脚本除安装外还会
        # 校验目录存在（装不上即硬失败），并导出 ANDROID_NDK_HOME / NDK_HOME / ANDROID_NDK_ROOT。
        run: bash ../.github/scripts/install-android-ndk.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 下载自定义图标（可选，来自 icon_url）
        # 仅下载 PNG 源文件；图标在 android init 之后用 `cargo tauri icon` 应用到安卓工程
        # （官方推荐：init 后运行 tauri icon 会把启动图标直接放入 gen/android 的 res 目录）。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ICON_URL:-}" ]; then echo "未配置 icon_url，沿用默认图标"; exit 0; fi
          echo "下载图标: $ICON_URL"
          curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
          magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "::error::icon_url 下载的不是 PNG 文件（文件头=$magic）"; exit 1
          fi
          echo "icon-custom.png 已下载（将在 android init 后应用）"

      - name: Initialize Android project (gen/android) + 安装匹配平台
        # 逻辑在 .github/scripts/install-android-sdk.sh —— release.yml 的同名步骤调用**同一个脚本**，
        # 不再各存一份副本（避免两边漂移）：没有 gen/android 就先 `cargo tauri android init`，
        # 再按模板实际写的 compileSdk，从 sdkmanager 仓库里真实存在的包名中挑平台安装。
        #
        # ⚠️ 2026-10-07 修线上失败「Warning: Failed to find package 'platforms;android-37'」：
        #   ① Android 16 起平台包带**次版本号**（仓库里只有 platforms;android-37.0/-37.1/-37.2，
        #      **没有** platforms;android-37），而 Tauri 模板的 compileSdk 已前移到 37；
        #   ② 新平台还先落在 canary 通道（stable 只到 android-36），所以安装命令也要带 --channel=3。
        # 脚本按「无小数优先 → 最小小数版本」挑包，并在只装到 android-N.x 时补 platforms/android-N
        # 软链；模板版本继续前移（如 39）时回落最高可用平台并改写 gradle，而不是挂掉整条流水线。
        run: bash ../.github/scripts/install-android-sdk.sh

      - name: 应用自定义图标到 Android 工程
        # 官方推荐：android init 之后运行 `cargo tauri icon`，它会把生成的 Android
        # 启动图标直接放入 gen/android/app/src/main/res/（mipmap-*）。
        # 兜底：若当前 tauri-cli 版本未自动放置，再手动把生成的 icons/android/* 复制进 res。
        run: |
          if [ ! -f "icon-custom.png" ]; then
            echo "未下载自定义图标，沿用默认"
            exit 0
          fi
          cargo tauri icon icon-custom.png
          if [ -d "gen/android/app/src/main/res" ]; then
            if [ -d "icons/android" ]; then
              cp -r icons/android/. gen/android/app/src/main/res/
            fi
            echo "已应用自定义 Android 启动图标"
          else
            echo "::warning::未找到 gen/android res 目录，图标可能未应用"
          fi

      - name: 统一应用名称（Android 应用名称 ← title）
        # 逻辑在 .github/scripts/apply-android-labels.py —— 两壳共用。显示名取 title
        #（缺省回落 app_name），一次改 strings.xml 的 app_name / main_activity_title 与
        # Manifest 内联 android:label；app_name 只负责「安装名」。
        run: python3 ../.github/scripts/apply-android-labels.py

      - name: 适配系统状态栏/导航栏（避免页面被顶部通栏遮挡）
        # 逻辑在 .github/scripts/patch-android-insets.py —— 两壳共用（两份内联逻辑实测逐字节相同）。
        # 模板 MainActivity 调用了 enableEdgeToEdge()，WebView 会绘制到系统栏下方；脚本按
        # systemBars 实际高度给内容视图加内缩：全屏仍生效，但页面不被系统通栏遮挡。
        run: python3 ../.github/scripts/patch-android-insets.py

      - name: 接管系统返回键（不允许退回到内置启动页）
        # 补丁逻辑（含自测）见 .github/scripts/patch-android-back.py：给 MainActivity
        # 注入 onWebViewCreate 钩子，按 WebView.copyBackForwardList 的相邻条目 URL 判定 ——
        # 落点是真实网页才 goBack；没有可退的真实页面时 finish()（与无历史的系统默认
        # 同手感：回桌面/后台）。gen/android 每次现生成，故每轮 init 后都必须打。
        run: python3 ../.github/scripts/patch-android-back.py

      - name: 接管网页下载（附件下载 / 长按存图 → 系统 DownloadManager）
        # 逻辑（含自测）见 .github/scripts/patch-android-download.py：wry 0.57 Android
        # 没有任何下载通道（RustWebViewClient 未挂 DownloadListener），不补丁则下载链接
        # 与长按保存图片全部静默无反应。同时补 Manifest 的存储（maxSdk=28）/ 通知权限。
        run: python3 ../.github/scripts/patch-android-download.py

      - name: 挂 JS 原生桥（分享 / 浏览器打开 / 清除浏览数据 / 退出）
        # 逻辑（含自测）见 .github/scripts/patch-android-extras.py：给 MainActivity 的
        # WebView addJavascriptInterface（__web2appAndroid），并补丁 wry 的
        # RustWebViewClient.onPageFinished —— 主框架每页轮换一次性密钥 __web2appAndroidKey，
        # 跨源 iframe 读不到 ⇒ 危险动作无法被第三方页面冒调。清数据补 wry 0.57 漏掉的
        # Cookie / WebStorage（其 clearAllBrowsingData 只清缓存/历史/表单/库），清完 reload。
        run: python3 ../.github/scripts/patch-android-extras.py

      - name: 外部链接交系统应用打开（tel/mailto/weixin/intent 等）
        # 逻辑（含自测）见 .github/scripts/patch-android-schemes.py：补丁 wry 生成的
        # RustWebViewClient.shouldOverrideUrlLoading，非 http(s) scheme 用 Intent 外跳，
        # 无应用可处理时 toast 兜底，避免 ERR_UNKNOWN_URL_SCHEME 白页。
        run: python3 ../.github/scripts/patch-android-schemes.py

      - name: 支持网页视频全屏（H5 <video> / requestFullscreen）
        # 逻辑（含自测）见 .github/scripts/patch-android-fullscreen.py：wry 0.57 的
        # RustWebChromeClient.onShowCustomView 是「立即 onCustomViewHidden」空实现，
        # 视频全屏按钮点了没反应。整体替换 onShow/onHideCustomView：custom view 铺满
        # content、隐藏 WebView、锁横屏 + 沉浸式（API30+ WindowInsetsController，
        # 低版本 systemUiVisibility），退出时逐项还原。
        run: python3 ../.github/scripts/patch-android-fullscreen.py

      - name: 按需声明运行时权限（camera / microphone / location）
        # 逻辑（含自测）见 .github/scripts/patch-android-permissions.py：打包配置的
        # android_permissions 白名单数组经解析器落 GITHUB_ENV（ANDROID_PERMISSIONS，
        # 默认 []），本步据此向 AndroidManifest.xml 注入 <uses-permission>；空数组直接跳过。
        # 未声明时 wry 对 getUserMedia（摄像头/麦克风）/ geolocation 一律 deny
        #（连运行时授权弹窗都不会弹）；运行时申请弹窗本身 wry 已实现，这里只补 Manifest。
        run: python3 ../.github/scripts/patch-android-permissions.py

      - name: Allow cleartext HTTP (localhost proxy)
        # 应用通过本地反向代理加载 http://127.0.0.1:<port>；Android 9+ 默认禁止明文 HTTP，
        # release 构建的 usesCleartextTraffic 默认为 false，必须置 true 否则鉴权代理真机上加载失败。
        run: |
          sed -i -E 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' gen/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" gen/android/app/src/main/AndroidManifest.xml

      - name: 设置 Android 产物文件名（APK 文件名 ← app_name）
        # 逻辑在 .github/scripts/set-android-apk-name.py —— 两壳共用，产物名就此对齐
        #（此前只有 build-custom.yml 有这一步，release.yml 出的 APK 一直是通用的
        # app-universal-release-unsigned.apk）。
        run: python3 ../.github/scripts/set-android-apk-name.py

      - name: 开启 gradle 错误栈（便于定位 assemble 失败原因）
        # 把 org.gradle.stacktrace=all 写进 gen/android/gradle.properties，
        # 若 APK 构建失败，gradle 会直接打印完整错误栈（e: 编译错误 / 资源链接错误等），
        # 省去"BUILD FAILED"尾部看不出根因的麻烦。
        # 关键：必须先确保文件末尾有换行，否则 echo >> 会把内容粘到上一行——
        # 曾因此把 stacktrace=all 粘到 android.nonFinalResIds=false 后面，
        # 导致 gradle 报 "Cannot parse ... android.nonFinalResIds='falseorg.gradle.stacktrace=all'"。
        run: |
          gp="gen/android/gradle.properties"
          mkdir -p "$(dirname "$gp")"
          touch "$gp"
          # 末尾无换行则补一个，防止新行粘到上一行
          [ -z "$(tail -c1 "$gp" 2>/dev/null)" ] || printf '\n' >> "$gp"
          grep -q "org.gradle.stacktrace" "$gp" || echo "org.gradle.stacktrace=all" >> "$gp"
          echo "--- gradle.properties ---"; cat "$gp"

      - name: Build Android APK
        # --apk 仅产出 APK（便于直接安装测试）；上架 Play Store 的 AAB 去掉 --apk 即可。
        # tauri-cli 的 --target 只接受架构名（aarch64/armv7/i686/x86_64），不是 rustup 的
        # 完整三元组 aarch64-linux-android。release APK 默认【未签名】，下一步签名后才能安装。
        # tee 到日志：失败时随 "Upload Android build log" 上传，便于定位 gradle 根因。
        run: cargo tauri android build --target aarch64 --apk 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: 签名 APK（release 包默认未签名，不签名无法安装）
        # 签名密钥三级策略：
        #   1) 配置 JSON 里提供了 android_keystore_base64 等 → 用 JSON 的 keystore 签名
        #      （适合"每个应用各自一把正式密钥"，随配置一起分发）；
        #   2) 配置了仓库 secrets（ANDROID_KEYSTORE_BASE64 等）→ 用正式 keystore 签名，
        #      各次构建可互相覆盖升级（长期使用/上架建议这种方式）。
        #   3) 都没有 → 现场用 keytool 生成一次性 keystore 签名。能正常安装使用，
        #      但每次构建的签名不同，新版无法覆盖安装旧版（需先卸载）。
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $build_tools"

          # 1) JSON 提供的 keystore（解析配置步骤已解码落盘并注入 ANDROID_KEYSTORE_* 变量）
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "${ANDROID_KEYSTORE_PATH:-}" ]; then
            if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::JSON 配置了 keystore 但缺少 alias/密码（解析步骤应已校验，请检查配置）"; exit 1
            fi
            echo "使用 JSON 配置的 keystore 签名"
            keystore="$ANDROID_KEYSTORE_PATH"
            storepass="$ANDROID_KEYSTORE_PASSWORD"
            keypass="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            alias="$ANDROID_KEY_ALIAS"
          # 2) 仓库 secrets 提供的正式 keystore
          elif [ -n "$KS_BASE64" ]; then
            if [ -z "${KS_ALIAS:-}" ] || [ -z "${KS_STORE_PASS:-}" ]; then
              echo "::error::配置了 ANDROID_KEYSTORE_BASE64 时，ANDROID_KEY_ALIAS 和 ANDROID_KEYSTORE_PASSWORD 也必须配置"; exit 1
            fi
            echo "使用 secrets 中的正式 keystore 签名"
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            storepass="$KS_STORE_PASS"
            keypass="${KS_KEY_PASS:-$KS_STORE_PASS}"
            alias="$KS_ALIAS"
          # 3) 一次性 CI keystore
          else
            echo "::warning::未配置签名信息，使用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）"
            keystore="$RUNNER_TEMP/ci.keystore"
            keytool -genkeypair -keystore "$keystore" -alias web2app-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidci -keypass androidci \
              -dname "CN=web2app-ci, OU=CI, O=web2app"
            storepass="androidci"
            keypass="androidci"
            alias="web2app-ci"

            # 把这次一次性 keystore 及其密码/base64/配置打包成 artifact（参考 generate-signing-key.yml），
            # 让用户下载保存后，之后能"用同一把密钥"继续签名，实现跨构建覆盖升级。
            # 否则这把一次性密钥只在本次 job 内存在，run 结束后就丢失，之后再也无法覆盖升级。
            # 这里用独立的 python3 写文件（用 <<'PY' 顶格 heredoc 需重开 run 步骤，故改用 -c 单行），
            # 避免在 bash 的 if/else 块里再嵌 heredoc 导致的缩进/YAML 块标量冲突。
            PKG="$RUNNER_TEMP/android-signing-key"
            mkdir -p "$PKG"
            cp "$keystore" "$PKG/release.keystore"
            ks_b64=$(base64 -w0 "$keystore")
            # 契约字段名从解析器取（唯一真源），下面用它断言生成的模板一个字段都没漏。
            CONTRACT_KEYS="$(python3 "$GITHUB_WORKSPACE/.github/scripts/parse-packaging-config.py" --print-contract-keys)"
            APP_URL_VAL="${APP_URL:-}"
            APP_NAME_VAL="${APP_NAME:-Web2App}"
            TITLE_VAL="${TITLE:-$APP_NAME_VAL}"
            VERSION_VAL="${VERSION:-0.0.1}"
            # ⚠️⚠️ 下面这一串是**同一条命令**的环境变量前缀，靠行尾 `\` 续行。
            #    **不要在续行链中间插注释**：bash 折掉 `\`+换行 之后 `#` 就开始注释，
            #    注释到本行末即结束 ⇒ 续行链被**打断**，注释前后的赋值各自成为独立命令，
            #    后面的 python 一个都读不到（表现为 KeyError: 'PKG'）。
            #    2026-09-22 实测：`A=1 \` + 注释行 + `B=2 bash -c ...`，外部进程只看到 B。
            #    ⇒ 解释性注释一律写在命令**之前**，链中间只留赋值。
            #
            # data_dir 用 `${DATA_DIR-data}`（**无冒号**）：带冒号的 `${VAR:-default}` 会把
            # 「已设置但为空」也当成未设置并替换成默认值，而空串在本字段里正是合法取值
            # （= 系统默认程序目录）。写成 `:-` 会让用户配的 "" 静默变成 "data"。
            # debug 与其它布尔同理用 `${VAR:-false}` —— 它的空串**没有**额外语义（不像 data_dir）。
            PKG="$PKG" ALIAS="$alias" STORE="$storepass" KS_B64="$ks_b64" \
            APP_URL_VAL="$APP_URL_VAL" APP_NAME_VAL="$APP_NAME_VAL" TITLE_VAL="$TITLE_VAL" \
            VERSION_VAL="$VERSION_VAL" \
            EXTRA_VAL="${EXTRA:-{}}" ICON_URL_VAL="${ICON_URL:-}" \
            PROXY_ENABLED_VAL="${PROXY_ENABLED:-false}" \
            PROXY_HTTP_VAL="${PROXY_HTTP:-}" PROXY_HTTPS_VAL="${PROXY_HTTPS:-}" \
            PROXY_BYPASS_VAL="${PROXY_BYPASS:-}" \
            DATA_DIR_VAL="${DATA_DIR-data}" TABS_ENABLED_VAL="${TABS_ENABLED:-false}" \
            MOBILE_BAR_VAL="${MOBILE_BAR:-false}" \
            PUBLIC_KEY_VAL="${PUBLIC_KEY:-}" RESOLVE_SECRET_VAL="${RESOLVE_SECRET:-}" \
            DEBUG_VAL="${DEBUG:-false}" \
            ANDROID_PERMISSIONS_VAL="${ANDROID_PERMISSIONS:-[]}" \
            CONTRACT_KEYS="$CONTRACT_KEYS" \
            python3 -c '
          import json, os, sys, datetime
          pkg = os.environ["PKG"]
          alias = os.environ["ALIAS"]
          storepass = os.environ["STORE"]
          ks_b64 = os.environ["KS_B64"]
          env = os.environ
          app_url = env["APP_URL_VAL"]
          # env 里的 app_url 是「文本」形态（域名数组被序列化过），模板要还原成真 JSON 类型。
          if app_url.lstrip().startswith("["):
              app_url = json.loads(app_url)
          cfg = {
              "app_url": app_url,
              "app_name": env["APP_NAME_VAL"],
              "title": env["TITLE_VAL"],
              "version": env["VERSION_VAL"],
              "extra": json.loads(env["EXTRA_VAL"] or "{}"),
              "icon_url": env["ICON_URL_VAL"],
              # 布尔一律真 bool（不是 "false" 字符串）—— 与解析器契约一致，
              # 否则这份模板拿回去复用时会被直接拒绝。
              "proxy_enabled": env["PROXY_ENABLED_VAL"].strip().lower() == "true",
              "proxy_http": env["PROXY_HTTP_VAL"],
              "proxy_https": env["PROXY_HTTPS_VAL"],
              "proxy_bypass": env["PROXY_BYPASS_VAL"],
              # data_dir 是**字符串**：空串有含义（系统默认程序目录），原样保留 ——
              # 不要 `.strip() or "data"`，那会把用户配的空串吃掉。
              "data_dir": env["DATA_DIR_VAL"],
              "tabs_enabled": env["TABS_ENABLED_VAL"].strip().lower() == "true",
              "mobile_bar": env["MOBILE_BAR_VAL"].strip().lower() == "true",
              "public_key": env["PUBLIC_KEY_VAL"],
              "resolve_secret": env["RESOLVE_SECRET_VAL"],
              # debug：诊断日志开关（默认关）。与其它布尔一样必须是真 bool。
              "debug": env["DEBUG_VAL"].strip().lower() == "true",
              "android_keystore_base64": ks_b64,
              "android_key_alias": alias,
              "android_keystore_password": storepass,
              "android_key_password": "",
              # 可选运行时权限：env 里是紧凑 JSON 数组文本（默认 "[]"），模板还原成真数组。
              "android_permissions": json.loads(env["ANDROID_PERMISSIONS_VAL"]),
          }
          # ⚠️ 契约里的字段必须一个不漏 —— 曾经这份模板只写 14 个键，用户拿它复用会静默丢掉
          #    extra / public_key / resolve_secret，表现为「前端读不到 web2appExtra」「解密回落
          #    公开默认 Secret」，而打包日志里没有任何提示。这里直接断言，改契约时同步暴露。
          assert set(cfg) == set(json.loads(env["CONTRACT_KEYS"])), (
              "packaging-config 模板字段与契约不一致："
              + str(set(json.loads(env["CONTRACT_KEYS"])) ^ set(cfg)))
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          info = [
              "本次打包使用【一次性 CI keystore】签名（因为未提供 JSON/Secrets 签名）",
              "======================================================",
              "生成时间 : " + now,
              "文件     : release.keystore（请长期保存）",
              "alias    : " + alias,
              "storepass: " + storepass,
              "keypass  : " + storepass + "   （与 storepass 相同；android_key_password 留空即可）",
              "",
              "keystore base64（单行，供填入 android_keystore_base64 / Secrets）:",
              ks_b64,
              "",
              "【使用提醒】",
              "1) 本次 APK 是用这把 keystore 签的；若以后想覆盖升级，就必须继续用这一把。",
              "2) 请把 release.keystore + 上面的密码一起备份到安全处。",
              "3) 更省心：直接改用 generate-signing-key.yml 生成一把正式密钥，",
              "   或用下面的 packaging-config.single.json 在下次打包时带上 base64/密码。",
          ]
          open(os.path.join(pkg, "keystore-info.txt"), "w", encoding="utf-8").write("\n".join(info) + "\n")
          open(os.path.join(pkg, "packaging-config.json"), "w", encoding="utf-8").write(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          open(os.path.join(pkg, "packaging-config.single.json"), "w", encoding="utf-8").write(json.dumps(cfg, ensure_ascii=False, separators=(",", ":")))
          print("已打包一次性签名材料到 " + pkg)
          '
          fi

          mkdir -p "$RUNNER_TEMP/signed"
          found=0
          shopt -s nullglob globstar
          for unsigned in gen/android/app/build/outputs/apk/**/*-unsigned.apk; do
            found=1
            base=$(basename "$unsigned" -unsigned.apk)
            aligned="$RUNNER_TEMP/aligned-$base.apk"
            signed="$RUNNER_TEMP/signed/$base-signed.apk"
            "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-pass "pass:$storepass" \
              --key-pass "pass:$keypass" \
              --ks-key-alias "$alias" \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify "$signed"
            echo "已签名: $signed"
          done
          if [ "$found" = "0" ]; then
            echo "::error::未找到 *-unsigned.apk，构建产物异常"
            find gen/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload 一次性签名材料（未提供签名时）
        # 仅当本次走的是"一次性 CI keystore"（JSON/Secrets 都未提供签名）时，
        # 才会上传这份签名材料，供用户下载保存、以便之后继续用同一把密钥覆盖升级。
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-key
          path: ${{ runner.temp }}/android-signing-key/
          if-no-files-found: ignore

      - name: Upload Android build log (诊断用)
        # 与 release.yml 对齐：完整构建日志（含 gradle 错误栈）落盘为 artifact。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # artifact 名固定为 android-apk（内容为已签名、可直接安装的 APK）。
          name: android-apk
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error

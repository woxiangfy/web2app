name: 自定义打包

# 手动触发：在仓库 Actions 页点 "Run workflow"，
#   ① 勾选本次要打哪些产物（默认全选，互不依赖）：
#       - Windows 安装版(MSI)    —— 需双击安装、写注册表的正式安装包
#       - Windows 单文件版(zip)   —— 免安装绿色版（最终包 <app_name>-portable.zip，内含单个 <app_name>.exe）
#       - Android APK             —— 已签名、可直接安装的安卓包
#   想打哪个就勾哪个；产物分别独立上传到各自的 artifact。
#   ② 粘贴一份配置 JSON（或填一个返回 JSON 的 URL），即可生成对应应用。
#
# 配置 JSON 字段（除 app_url 必填外，其余均可省略、自动合并默认值）：
#   {
#     "app_url": "https://user:pass@host",   // 必填，要嵌入的网址（支持带账号密码）
#                                            //   也支持【域名数组】形式：["a.com","b.com"]，
#                                            //   运行时依次对这些域名做 DNS TXT 查询、用 public_key
#                                            //   解密 TXT 值得到真实 URL（详见 public_key 说明）
#
#     "app_name": "MyApp",                   // 【安装名】（默认 Web2App）——给系统/安装器看的：
#                                            //   Windows 安装包名、开始菜单与桌面快捷方式、
#                                            //   安装目录、"程序和功能"显示名；
#                                            //   同时也是两端的数据存储目录名（设置文件所在目录）
#     "title": "我的应用",                    // 【显示名】（默认同 app_name）——给用户看的：
#                                            //   Windows 端窗口标题、托盘悬停提示、右键菜单"设置"项标题、
#                                            //   Android 端应用名称（桌面图标下的名字）
#                                            //   （与 app_name 分开，便于"安装包叫英文名、界面叫中文名"）
#
#     "extra": { "k": "v" },                 // 附加参数（默认 {}）：任意 JSON 对象/数组/标量，
#                                            //   会被注入到被包裹网页，前端 JS 通过
#                                            //   window.web2appExtra 直接读取
#     "icon_url": "https://example.com/logo.png", // 应用图标 PNG 的 URL（默认空=沿用仓库默认图标）
#     "window_title": "我的应用",             // 【已废弃】旧字段，等价于 title，仅保留兼容老配置
#     "proxy_enabled": "true",               // 是否启用本地反向代理注入鉴权（默认 false）
#     "proxy_http": "",                      // 外部 HTTP 代理（默认空）
#     "proxy_https": "",                     // 外部 HTTPS 代理（默认空）
#     "proxy_bypass": "",                    // 不走代理的地址，分号分隔（默认空=代码内置）
#     "public_key": "Sg9zFyUaBwWwGPm8TshK/LSNpZMbw0Ex4kMcwaK40jU=", // Ed25519 公钥（裸 base64 或 SPKI PEM）。
#                                            //   仅当 app_url 为【域名数组】时必填：运行时对每个域名
#                                            //   做 DNS TXT 查询，TXT 值是一段 base64 密文，用本公钥
#                                            //   验签 + AES-GCM 解密得到真实 URL。任一域名解析/解密/验签
#                                            //   失败自动尝试下一个，全部失败报"服务器连接失败"。
#     "data_dir_default": "false",           // WebView2 数据目录（默认 false=LOCALAPPDATA）
#     "android_keystore_base64": "...",      // Android 签名 keystore(.jks/.keystore) 的 base64（可选，
#                                            //   优先于仓库 secrets；正式签名，跨构建可覆盖升级）
#     "android_key_alias": "my-alias",       // keystore 别名（配了 keystore 时必填）
#     "android_keystore_password": "****",   // keystore 密码（配了 keystore 时必填）
#     "android_key_password": ""             // key 密码（可选，默认同 keystore 密码）
#   }
#
# 仓库根目录的 config.example.json 是一份可直接复制使用的配置模板。
#（JSON 标准不支持注释，故模板保持纯 JSON；各字段含义见上面这份说明与 README。）
#
# 想"一键生成某个固定应用"：把 config_url 固定指向仓库内一份 .json（如 config.example.json），
# 或把 config_json 直接写死在下面 job 的 env 里，无需改源码即可为每个应用产出独立安装包。
on:
  workflow_dispatch:
    inputs:
      config_json:
        description: '配置 JSON 字符串（单行）。与 config_url 二选一，都填则以本项为准'
        required: false
      config_url:
        description: '或填一个返回上述 JSON 的 URL（公开可访问）'
        required: false
      windows_installer:
        description: '打 Windows 安装版(MSI) —— 双击安装、写注册表的正式安装包'
        required: false
        default: true
        type: boolean
      windows_portable:
        description: '打 Windows 单文件版 —— 免安装绿色版（zip）'
        required: false
        default: true
        type: boolean
      android:
        description: '打 Android APK —— 已签名、可直接安装'
        required: false
        default: true
        type: boolean

jobs:
  # 各 job 用【独立复选框】决定是否运行：
  #   windows_installer / windows_portable / android 是 workflow_dispatch 的三个 boolean 输入（默认 true）。
  # 布尔表达式统一写成 `!= 'false'`：默认 true、显式勾选为 true、或未传该字段时都视为"要打"；
  # 只有显式取消勾选（= 'false'）才跳过。windows job 在安装版或单文件版任一被勾选时运行。
  windows:
    name: Build Windows
    runs-on: windows-latest
    if: ${{ github.event.inputs.windows_installer != 'false' || github.event.inputs.windows_portable != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # 单一入口：接受 JSON 字符串或 JSON URL，解析后与默认值合并，
      # 把最终编译期变量写入 GITHUB_ENV，后续步骤直接作为环境变量读取。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          # Windows runner 上 Python 默认 stdout/stderr 是 cp1252，输出中文会 UnicodeEncodeError，
          # 这里强制 UTF-8（双保险：环境变量 + 脚本内 reconfigure）。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python - <<'PY'
          import os, sys, json, re, urllib.request

          # 强制 stdout/stderr 走 UTF-8，避免 Windows cp1252 编码中文时报错。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          DEFAULTS = {
              "app_url": "",
              "app_name": "Web2App",
              # title = 显示名（Windows 窗口标题 / Android 应用名称）；未配置时回落 app_name
              "title": "",
              # extra = 任意 JSON（对象/数组/标量），会以 window.web2appExtra 注入网页供前端 JS 读取
              "extra": {},
              "icon_url": "",
              # window_title 是 title 的旧字段名，保留仅为兼容老配置（读取后统一并入 title）
              "window_title": "",
              "proxy_enabled": "false",
              "proxy_http": "",
              "proxy_https": "",
              "proxy_bypass": "",
              "data_dir_default": "false",
              # Ed25519 公钥（裸 base64 或 SPKI PEM）。当 app_url 为【域名数组】时，运行时对每个域名
              # 做 DNS TXT 查询，用本公钥验签 + AES-GCM 解密 TXT 值得到真实 URL。
              "public_key": "",
              # Android 签名（仅 Android job 使用，这里合并进配置避免"未知字段"告警）
              "android_keystore_base64": "",
              "android_key_alias": "",
              "android_keystore_password": "",
              "android_key_password": "",
          }
          BOOL_KEYS = {"proxy_enabled", "data_dir_default"}
          # 需要保持 JSON 结构、写入 GITHUB_ENV 后仍能被 Rust 原样解析的字段（对象/数组）。
          # extra 注入为 JSON 文本，供源码以 EXTRA 编译期变量内联成 window.web2appExtra。
          JSON_KEYS = {"extra"}
          # 签名相关字段不写入 GITHUB_ENV（keystore 体积大/含敏感信息，由 Android job 自行落盘处理）
          SKIP_ENV = {"android_keystore_base64", "android_key_alias",
                      "android_keystore_password", "android_key_password"}

          raw = (os.environ.get("CONFIG_JSON") or "").strip()
          url = (os.environ.get("CONFIG_URL") or "").strip()

          if not raw and url:
              req = urllib.request.Request(url, headers={"User-Agent": "web2app-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8").strip()

          if not raw:
              sys.exit("必须提供 config_json 或 config_url，二者至少填一个")

          try:
              data = json.loads(raw)
          except Exception as e:
              sys.exit(f"配置不是合法 JSON：{e}")
          if not isinstance(data, dict):
              sys.exit("配置 JSON 必须是对象（字典）")

          merged = dict(DEFAULTS)
          for k, v in data.items():
              if k not in merged:
                  print(f"::warning::忽略未知字段 {k}")
                  continue
              if v is None:
                  continue
              if isinstance(v, bool):
                  v = "true" if v else "false"
              elif isinstance(v, (dict, list)) or k in JSON_KEYS:
                  # 对象/数组字段：JSON 序列化后存成单行 JSON 文本，写入 env 后 Rust 侧能原样解析
                  v = json.dumps(v, ensure_ascii=False, separators=(",", ":"))
              else:
                  v = str(v)
              merged[k] = v

          # app_url 支持两种形态：
          #   ① 字符串：单个 URL（原逻辑，含 user:pass@host）
          #   ② 数组：一组"跳板域名"，运行时做 DNS TXT 查询 + Ed25519 验签解密得到真实 URL
          if isinstance(data.get("app_url"), list):
              domains = [str(d).strip() for d in data["app_url"] if str(d).strip()]
              if not domains:
                  sys.exit("app_url 为数组时不能为空")
              merged["app_url"] = json.dumps(domains, ensure_ascii=False, separators=(",", ":"))
              # 数组模式强制要求 public_key
              if not merged["public_key"].strip():
                  sys.exit("app_url 为域名数组时，必须提供 public_key（Ed25519 公钥）")
          else:
              merged["app_url"] = merged["app_url"].strip()
              if not merged["app_url"]:
                  sys.exit("缺少必填字段 app_url")
          merged["icon_url"] = merged["icon_url"].strip()
          # 规范化 public_key：把用户可能在 JSON 里手写的字面量 "\n" 转成真实换行，
          # 并压掉行内多余空格，便于 Rust 侧按 PEM 解析（多行/单行均可）。
          if merged["public_key"]:
              merged["public_key"] = (
                  merged["public_key"]
                  .replace("\\n", "\n")
                  .replace("\\r", "")
                  .strip()
              )
          for k in BOOL_KEYS:
              merged[k] = merged[k].strip().lower()
          # JSON 型字段（对象/数组）统一序列化为单行 JSON 文本；默认值 {} 也要转成 "{}"，
          # 保证写入 GITHUB_ENV 后 Rust 侧能作为 EXTRA 原样解析成合法 JS 对象。
          for k in JSON_KEYS:
              v = merged[k]
              if not isinstance(v, str):
                  merged[k] = json.dumps(v, ensure_ascii=False, separators=(",", ":"))

          # title（显示名）与 app_name（安装名）分离：
          #   title        → Windows 窗口标题、Android 应用名称
          #   app_name     → 安装包名/快捷方式/安装目录/数据存储目录名
          # 取值链：title → window_title（旧字段，兼容） → app_name。
          if not merged["title"] and merged["window_title"]:
              merged["title"] = merged["window_title"]
          if not merged["title"]:
              merged["title"] = merged["app_name"]
          # 源码（src/lib.rs）读的编译期变量叫 WINDOW_TITLE，这里统一由 title 导出，保证两处一致。
          merged["window_title"] = merged["title"]

          # 打印时隐藏敏感内容，避免泄漏到日志。
          def mask(u):
              return re.sub(r"(://[^/@\s]+)@", "://***@", u)

          def display(k, v):
              if k in ("app_url", "icon_url"):
                  return mask(v)
              if k in ("android_keystore_password", "android_key_password"):
                  return "***（已配置）" if v else "（未配置）"
              if k == "android_keystore_base64":
                  return f"（已配置，{len(v)} 字符）" if v else "（未配置）"
              return v

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in merged.items():
                  if k in SKIP_ENV:
                      continue
                  # public_key 是 PEM 多行文本，含换行符，用 GITHUB_ENV 的 heredoc 语法写入，
                  # 否则换行会被截断成多个环境变量，导致 Rust 侧读不到完整公钥。
                  if k == "public_key" and "\n" in v:
                      f.write(f"{k.upper()}<<EOF\n{v.rstrip()}\nEOF\n")
                  else:
                      f.write(f"{k.upper()}={v}\n")

          print("已注入环境变量：")
          for k, v in merged.items():
              print(f"  {k.upper()}={display(k, v)}")
          PY

      - name: 统一安装名称（app_name → productName）
        # 把 app_name 写入 tauri.conf.json 的 productName，统一 Windows 端的"安装名称"：
        #   MSI 安装包文件名 / 开始菜单与桌面快捷方式 / 控制面板"程序和功能"显示名 / 安装目录。
        # 同时固定 mainBinaryName=web2app（tauri.conf.json 的【顶层】字段，不是 bundle 下）：
        # 主程序 exe 文件名不随 productName 变化，下方"生成 Windows 单文件版"步骤引用的
        # target/release/web2app.exe 路径保持稳定。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = os.environ.get("APP_NAME", "").strip()
          # 去掉 Windows 文件名非法字符；压缩连续空白；去首尾空格与句点；空则回落默认名
          safe = re.sub(r'[\\/:*?"<>|]+', "_", name) if name else ""
          safe = re.sub(r"\s+", " ", safe).strip(" .") if safe else ""
          if not safe:
              safe = "Web2App"

          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)
          conf["productName"] = safe
          conf["mainBinaryName"] = "web2app"
          with open("tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(conf, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"productName = {safe}（安装包/快捷方式/安装目录使用该名称；主程序文件名固定为 web2app.exe）")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 下载自定义图标（可选，来自 icon_url）
        # 从 JSON 的 icon_url 下载 PNG，用官方 `cargo tauri icon` 重新生成全套图标
        #（icon.ico / icon.png / 各尺寸），Windows 窗口图标与 MSI 安装包都会使用新图标。
        # 建议 1024x1024 正方形 PNG（带透明通道最佳）。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ICON_URL:-}" ]; then echo "未配置 icon_url，沿用默认图标"; exit 0; fi
          echo "下载图标: $ICON_URL"
          curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
          magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "::error::icon_url 下载的不是 PNG 文件（文件头=$magic）"; exit 1
          fi
          cargo tauri icon icon-custom.png

      - name: 编译并打包 Windows 安装版（MSI）
        # 仅当勾选"Windows 安装版"才执行。--bundles msi：只产 MSI 安装包（不产 NSIS）。
        # 编译期常量 APP_URL/APP_NAME/... 读取之前注入的环境变量；
        # 主二进制 web2app.exe 仍会编译到 target/release/，若同时勾了单文件版可复用它打 zip。
        if: ${{ github.event.inputs.windows_installer != 'false' }}
        run: cargo tauri build --bundles msi

      - name: 编译主程序（单文件版前置，不产 MSI）
        # 仅当【只勾单文件版、未勾安装版】才执行：用 --no-bundle 只编译出 web2app.exe，
        # 跳过 WiX/MSI 打包，省时间。若同时勾了安装版，上一步已产出同款 exe，本步无需再跑。
        if: ${{ github.event.inputs.windows_installer == 'false' && github.event.inputs.windows_portable != 'false' }}
        run: cargo tauri build --no-bundle

      - name: 生成 Windows 单文件版（绿色版 exe，上传即得 <app_name>-portable.zip）
        # 仅当勾选"Windows 单文件版"才执行。把主程序 web2app.exe 复制为 <app_name>.exe。
        # 【不再手工再压一层 zip】：直接把 exe 交给 upload-artifact 打成单个
        # <app_name>-portable.zip（GitHub 只包这一层），既避免"zip 套 zip"的双重压缩，
        # 又让最终下载包的文件名带上 app_name。绿色版免安装，依赖系统自带 WebView2。
        # 要求前面两步中至少一步已产出 web2app.exe。
        if: ${{ github.event.inputs.windows_portable != 'false' }}
        shell: pwsh
        run: |
          # 文件名清洗与 productName 一致（去非法字符、压空白、去首尾空格/句点，空则回落默认）
          $name = $env:APP_NAME -replace '[\\/:*?"<>|]', '_'
          $name = ($name -replace '\s+', ' ').Trim(' .')
          if (-not $name) { $name = 'Web2App' }
          $exe = "target/release/web2app.exe"
          if (-not (Test-Path $exe)) { throw "未找到主程序 $exe（请确认勾选了安装版或单文件版）" }
          Copy-Item $exe "target/release/$name.exe" -Force
          # 把清洗后的名字写回 GITHUB_ENV，供下方上传步骤拼 artifact 名与文件路径，
          # 保证两者一致（都用同一个 $name）。
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_NAME=$name"
          Write-Output "绿色版 exe 已生成：$name.exe（最终下载包为 $name-portable.zip）"

      - name: Upload Windows 安装版 (MSI)
        # MSI 文件名已由 productName 统一（<app_name>_<版本>_x64_zh-CN.msi），无需重命名。
        if: ${{ github.event.inputs.windows_installer != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows 单文件版（zip，文件名含 app_name）
        if: ${{ github.event.inputs.windows_portable != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          # 动态命名 artifact：下载得到的就是 <app_name>-portable.zip（内含单个 <app_name>.exe）。
          # 名字取自生成步骤写回的 PORTABLE_NAME，与 exe 文件名保持一致。
          name: ${{ env.PORTABLE_NAME }}-portable
          path: target/release/${{ env.PORTABLE_NAME }}.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Android APK（aarch64）。本作业会在 CI 上【自动生成 gen/android 并交叉编译出 APK】，
  # 因此无需在本地安装 Android SDK/NDK/JDK。gen/ 已被 .gitignore 忽略，每次构建现生成，避免漂移。
  # 尽力而为：Android 首次构建可能存在工具链/真机行为问题，失败不影响 Windows 产物。
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event.inputs.android != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # 与 Windows job 相同的解析逻辑：把 JSON 配置注入为环境变量，供 cargo 编译期读取；
      # 额外处理 Android 签名：若 JSON 提供了 keystore，解码落盘并注入签名相关变量。
      - name: 解析配置（JSON / URL → 合并默认值 → 注入环境变量 + 签名 keystore 落盘）
        shell: bash
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
          CONFIG_URL: ${{ github.event.inputs.config_url }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python3 - <<'PY'
          import os, sys, json, re, base64, pathlib, urllib.request

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          DEFAULTS = {
              "app_url": "",
              "app_name": "Web2App",
              # title = 显示名（Windows 窗口标题 / Android 应用名称）；未配置时回落 app_name
              "title": "",
              # extra = 任意 JSON（对象/数组/标量），会以 window.web2appExtra 注入网页供前端 JS 读取
              "extra": {},
              "icon_url": "",
              # window_title 是 title 的旧字段名，保留仅为兼容老配置（读取后统一并入 title）
              "window_title": "",
              "proxy_enabled": "false",
              "proxy_http": "",
              "proxy_https": "",
              "proxy_bypass": "",
              "data_dir_default": "false",
              # Ed25519 公钥（裸 base64 或 SPKI PEM）。当 app_url 为【域名数组】时，运行时对每个域名
              # 做 DNS TXT 查询，用本公钥验签 + AES-GCM 解密 TXT 值得到真实 URL。
              "public_key": "",
              "android_keystore_base64": "",
              "android_key_alias": "",
              "android_keystore_password": "",
              "android_key_password": "",
          }
          BOOL_KEYS = {"proxy_enabled", "data_dir_default"}
          # 需要保持 JSON 结构、写入 GITHUB_ENV 后仍能被 Rust 原样解析的字段（对象/数组）。
          # extra 注入为 JSON 文本，供源码以 EXTRA 编译期变量内联成 window.web2appExtra。
          JSON_KEYS = {"extra"}
          # 签名相关字段不直接进 GITHUB_ENV（keystore 体积大、密码敏感），由下方专门处理
          SKIP_ENV = {"android_keystore_base64", "android_key_alias",
                      "android_keystore_password", "android_key_password"}

          raw = (os.environ.get("CONFIG_JSON") or "").strip()
          url = (os.environ.get("CONFIG_URL") or "").strip()

          if not raw and url:
              req = urllib.request.Request(url, headers={"User-Agent": "web2app-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8").strip()

          if not raw:
              sys.exit("必须提供 config_json 或 config_url，二者至少填一个")

          try:
              data = json.loads(raw)
          except Exception as e:
              sys.exit(f"配置不是合法 JSON：{e}")
          if not isinstance(data, dict):
              sys.exit("配置 JSON 必须是对象（字典）")

          merged = dict(DEFAULTS)
          for k, v in data.items():
              if k not in merged:
                  print(f"::warning::忽略未知字段 {k}")
                  continue
              if v is None:
                  continue
              if isinstance(v, bool):
                  v = "true" if v else "false"
              elif isinstance(v, (dict, list)) or k in JSON_KEYS:
                  # 对象/数组字段：JSON 序列化后存成单行 JSON 文本，写入 env 后 Rust 侧能原样解析
                  v = json.dumps(v, ensure_ascii=False, separators=(",", ":"))
              else:
                  v = str(v)
              merged[k] = v

          # app_url 支持两种形态：
          #   ① 字符串：单个 URL（原逻辑，含 user:pass@host）
          #   ② 数组：一组"跳板域名"，运行时做 DNS TXT 查询 + Ed25519 验签解密得到真实 URL
          if isinstance(data.get("app_url"), list):
              domains = [str(d).strip() for d in data["app_url"] if str(d).strip()]
              if not domains:
                  sys.exit("app_url 为数组时不能为空")
              merged["app_url"] = json.dumps(domains, ensure_ascii=False, separators=(",", ":"))
              # 数组模式强制要求 public_key
              if not merged["public_key"].strip():
                  sys.exit("app_url 为域名数组时，必须提供 public_key（Ed25519 公钥）")
          else:
              merged["app_url"] = merged["app_url"].strip()
              if not merged["app_url"]:
                  sys.exit("缺少必填字段 app_url")
          merged["icon_url"] = merged["icon_url"].strip()
          # 规范化 public_key：把用户可能在 JSON 里手写的字面量 "\n" 转成真实换行，
          # 并压掉行内多余空格，便于 Rust 侧按 PEM 解析（多行/单行均可）。
          if merged["public_key"]:
              merged["public_key"] = (
                  merged["public_key"]
                  .replace("\\n", "\n")
                  .replace("\\r", "")
                  .strip()
              )
          for k in BOOL_KEYS:
              merged[k] = merged[k].strip().lower()
          # JSON 型字段（对象/数组）统一序列化为单行 JSON 文本；默认值 {} 也要转成 "{}"，
          # 保证写入 GITHUB_ENV 后 Rust 侧能作为 EXTRA 原样解析成合法 JS 对象。
          for k in JSON_KEYS:
              v = merged[k]
              if not isinstance(v, str):
                  merged[k] = json.dumps(v, ensure_ascii=False, separators=(",", ":"))

          # title（显示名）与 app_name（安装名）分离：
          #   title        → Windows 窗口标题、Android 应用名称
          #   app_name     → 安装包名/快捷方式/安装目录/数据存储目录名（Android 应用名不再取 app_name）
          # 取值链：title → window_title（旧字段，兼容） → app_name。
          if not merged["title"] and merged["window_title"]:
              merged["title"] = merged["window_title"]
          if not merged["title"]:
              merged["title"] = merged["app_name"]
          # 源码（src/lib.rs）读的编译期变量叫 WINDOW_TITLE，这里统一由 title 导出，保证两处一致。
          merged["window_title"] = merged["title"]

          # ---------- Android 签名（可选）：JSON 提供的 keystore 优先于仓库 secrets ----------
          signing = {}
          ks_b64 = merged["android_keystore_base64"].strip()
          if ks_b64:
              alias = merged["android_key_alias"].strip()
              storepass = merged["android_keystore_password"]
              if not alias or not storepass:
                  sys.exit("配置了 android_keystore_base64 时，必须同时提供 android_key_alias 和 android_keystore_password")
              try:
                  ks_bytes = base64.b64decode(ks_b64, validate=False)
              except Exception as e:
                  sys.exit(f"android_keystore_base64 不是合法 base64：{e}")
              if len(ks_bytes) < 64:
                  sys.exit("android_keystore_base64 解码后内容过小，疑似不完整（正常 keystore 至少几百字节）")
              out_dir = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "android-signing"
              out_dir.mkdir(parents=True, exist_ok=True)
              ks_path = out_dir / "release.keystore"
              ks_path.write_bytes(ks_bytes)
              keypass = merged["android_key_password"] or storepass
              for s in (storepass, keypass):
                  if s:
                      print(f"::add-mask::{s}")
              signing = {
                  "ANDROID_KEYSTORE_PATH": str(ks_path),
                  "ANDROID_KEY_ALIAS": alias,
                  "ANDROID_KEYSTORE_PASSWORD": storepass,
                  "ANDROID_KEY_PASSWORD": keypass,
              }
              print(f"Android 签名：使用 JSON 提供的 keystore（{len(ks_bytes)} 字节，已写入 {ks_path}）")
          else:
              print("Android 签名：JSON 未提供 keystore（将回落到仓库 secrets / 一次性 CI keystore）")

          def mask(u):
              return re.sub(r"(://[^/@\s]+)@", "://***@", u)

          def display(k, v):
              if k in ("app_url", "icon_url"):
                  return mask(v)
              if k in ("android_keystore_password", "android_key_password"):
                  return "***（已配置）" if v else "（未配置）"
              if k == "android_keystore_base64":
                  return f"（已配置，{len(v)} 字符）" if v else "（未配置）"
              return v

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in merged.items():
                  if k in SKIP_ENV:
                      continue
                  # public_key 是 PEM 多行文本，含换行符，用 GITHUB_ENV 的 heredoc 语法写入，
                  # 否则换行会被截断成多个环境变量，导致 Rust 侧读不到完整公钥。
                  if k == "public_key" and "\n" in v:
                      f.write(f"{k.upper()}<<EOF\n{v.rstrip()}\nEOF\n")
                  else:
                      f.write(f"{k.upper()}={v}\n")
              for k, v in signing.items():
                  f.write(f"{k}={v}\n")

          print("已注入环境变量：")
          for k, v in merged.items():
              print(f"  {k.upper()}={display(k, v)}")
          PY

      - name: 统一安装名称（app_name → productName，供 android init 烘焙）
        # Android 端必须在 `cargo tauri android init` 之前把 app_name 写入
        # tauri.conf.json 的 productName，否则 init 会把默认名 "Web2App"/"web2app"
        # 烘焙进安卓工程（strings.xml / Manifest），后续 strings.xml 补丁只是兜底。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = os.environ.get("APP_NAME", "").strip()
          if not name:
              print("未配置 app_name，沿用默认名称")
              raise SystemExit(0)
          # 去掉 Windows 文件名非法字符；压缩连续空白；去首尾空格与句点；空则回落默认名
          safe = re.sub(r'[\\/:*?"<>|]+', "_", name)
          safe = re.sub(r"\s+", " ", safe).strip(" .")
          if not safe:
              safe = "Web2App"

          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)
          conf["productName"] = safe
          with open("tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(conf, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"productName = {safe}（android init 将据此烘焙安卓应用名称）")
          PY

      - name: Install Rust toolchain (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        # 平台/构建工具的版本跟随 Tauri 模板（见下方 "Initialize Android project" 步骤，
        # 会在 init 后读取生成工程实际的 compileSdk / buildToolsVersion 再安装对应版本），
        # 避免模板升级后 compileSdk 变化（如 34→35）而这里写死导致 gradle 配置期失败。
        run: |
          yes | sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: 下载自定义图标（可选，来自 icon_url）
        # 仅下载 PNG 源文件；图标在 android init 之后用 `cargo tauri icon` 应用到安卓工程
        # （官方推荐：init 后运行 tauri icon 会把启动图标直接放入 gen/android 的 res 目录）。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ICON_URL:-}" ]; then echo "未配置 icon_url，沿用默认图标"; exit 0; fi
          echo "下载图标: $ICON_URL"
          curl -fsSL --retry 3 "$ICON_URL" -o icon-custom.png
          magic=$(head -c 8 icon-custom.png | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "::error::icon_url 下载的不是 PNG 文件（文件头=$magic）"; exit 1
          fi
          echo "icon-custom.png 已下载（将在 android init 后应用）"

      - name: Initialize Android project (gen/android) + 安装匹配平台
        # 首次构建时仓库里没有 gen/android，就在 CI 上自动生成。
        # --ci 跳过交互式询问；--skip-targets-install 因为上面已用 rust-toolchain 装了 aarch64 target。
        # 生成后读取模板实际的 compileSdk / buildToolsVersion，安装对应版本的 platforms 与 build-tools，
        # 避免写死版本与模板不一致导致 gradle 配置期 "Failed to find Platform SDK with path: android-N"。
        run: |
          if [ ! -d "gen/android" ]; then
            cargo tauri android init --ci --skip-targets-install
          fi

          APP_GRADLE=$(ls gen/android/app/build.gradle.kts gen/android/app/build.gradle 2>/dev/null | head -n1)
          SDK=34; BT=34.0.0
          if [ -n "$APP_GRADLE" ]; then
            v=$(grep -oE 'compileSdk\s*[=:]\s*[0-9]+' "$APP_GRADLE" | grep -oE '[0-9]+' | head -n1)
            [ -n "$v" ] && SDK=$v
            b=$(grep -oE 'buildToolsVersion\s*[=:]\s*"[0-9.]+"' "$APP_GRADLE" | grep -oE '[0-9.]+' | head -n1)
            [ -n "$b" ] && BT=$b
          fi
          echo "目标 compileSdk=$SDK buildToolsVersion=$BT"
          yes | sdkmanager "platforms;android-$SDK" "build-tools;$BT"

      - name: 应用自定义图标到 Android 工程
        # 官方推荐：android init 之后运行 `cargo tauri icon`，它会把生成的 Android
        # 启动图标直接放入 gen/android/app/src/main/res/（mipmap-*）。
        # 兜底：若当前 tauri-cli 版本未自动放置，再手动把生成的 icons/android/* 复制进 res。
        run: |
          if [ ! -f "icon-custom.png" ]; then
            echo "未下载自定义图标，沿用默认"
            exit 0
          fi
          cargo tauri icon icon-custom.png
          if [ -d "gen/android/app/src/main/res" ]; then
            if [ -d "icons/android" ]; then
              cp -r icons/android/. gen/android/app/src/main/res/
            fi
            echo "已应用自定义 Android 启动图标"
          else
            echo "::warning::未找到 gen/android res 目录，图标可能未应用"
          fi

      - name: 统一应用名称（Android 应用名称 ← title）
        # Android 的应用名称（桌面图标下的 label）定义在 gen/android 的 strings.xml
        #（或 Manifest 内联 android:label）。这里统一取 JSON 的 title（缺省回落 app_name），
        # 与 Windows 窗口标题同源；app_name 只负责"安装名"（安装包/快捷方式/安装目录），
        # 两者分离后可实现"安装名用英文、显示名用中文"。
        #
        # 注意执行顺序：上面 "app_name → productName" 那一步已经让 android init 把安装名烘焙进了
        # strings.xml，这一步在 init 之后用 title 覆盖它，因此最终生效的是 title。
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          def esc_res(v):
              # Android 资源字符串里单引号必须转义为 \'，否则 aapt 报
              # "Apostrophe not preceded by backslash"；& < > 做 XML 实体转义。
              return (v.replace("&", "&amp;")
                       .replace("<", "&lt;")
                       .replace(">", "&gt;")
                       .replace("'", "\\'"))

          # Android 应用名称取 title；未配置 title 时回落 app_name（解析步骤已做过该回落，
          # 这里再兜一次底，防止只配了 app_name 的老配置拿到空名）。
          name = (os.environ.get("TITLE", "") or "").strip() or (os.environ.get("APP_NAME", "") or "").strip()
          if not name:
              print("未配置 title/app_name，Android 沿用默认名称")
              raise SystemExit(0)
          label = esc_res(name)

          # 1) strings.xml 的应用名资源：app_name（application 的 label）与
          #    main_activity_title（MainActivity 的 label，才是桌面图标/任务栏真正显示的名字）。
          #    tauri v2 模板里这两个都等于 productName（= app_name），必须【都】改成 title，
          #    否则桌面仍显示 app_name。缺哪个就补哪个，避免只改一半。
          res = pathlib.Path("gen/android/app/src/main/res/values/strings.xml")
          if res.exists():
              s = res.read_text(encoding="utf-8")
              s2 = s
              for res_name in ("app_name", "main_activity_title"):
                  # 容忍 name 上可能带额外属性（如 translatable="false"）
                  pat = rf'(<string\s+name="{res_name}"(?:\s+[\w:-]+="[^"]*")*\s*>)[^<]*(</string>)'
                  s2, n = re.subn(pat, lambda m: m.group(1) + label + m.group(2), s2)
                  if n == 0 and "</resources>" in s2:
                      s2 = s2.replace("</resources>",
                                      f'    <string name="{res_name}">{label}</string>\n</resources>')
                      n = 1
                  print(f"strings.xml: {res_name} → {name}（{'覆盖' if n else '未找到，已跳过'}）")
              res.write_text(s2, encoding="utf-8")
          else:
              print("::warning::未找到 strings.xml")

          # 2) Manifest 若使用内联 label（而非 @string/app_name 引用），直接替换
          mf = pathlib.Path("gen/android/app/src/main/AndroidManifest.xml")
          if mf.exists():
              s = mf.read_text(encoding="utf-8")
              s2, n = re.subn(r'(android:label=")(?!@string/)[^"]*(")',
                              lambda m: m.group(1) + label + m.group(2), s)
              if n:
                  mf.write_text(s2, encoding="utf-8")
                  print(f"AndroidManifest: 内联 android:label → {name}")
          PY

      - name: 适配系统状态栏/导航栏（避免页面被顶部通栏遮挡）
        # Tauri 模板的 MainActivity 调用了 enableEdgeToEdge()：WebView 会延伸绘制到
        # 状态栏/导航栏下方，页面顶部被系统通栏遮挡。这里【保留原文件结构】，只做外科手术式注入：
        #   1) 补 androidx.core 的 3 个 import（若模板已有则跳过）；
        #   2) 在 super.onCreate(...) 之后注册 WindowInsets 监听，让内容视图按
        #      systemBars 实际高度内缩——edge-to-edge 仍生效（应用全屏），但页面内容
        #      不被系统通栏遮挡。
        # 采用"只注入、不重写"的方式，避免破坏模板原有的 import / 基类写法，兼容性更好。
        # gen/android 每次构建现生成，因此每次 init 后都要打一遍补丁。
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          root = pathlib.Path("gen/android/app/src/main/java")
          files = [p for p in root.rglob("MainActivity.*") if p.suffix in (".kt", ".java")]
          if not files:
              raise SystemExit("::error::未找到 MainActivity.kt / MainActivity.java")
          f = files[0]
          src = f.read_text(encoding="utf-8")

          if "setOnApplyWindowInsetsListener" in src:
              print("MainActivity 已包含系统栏适配，跳过改写")
          else:
              # 1) 补 import（缺失才加，插到最后一条 import 之后；若完全没有 import 则插在 package 之后）
              needed = [
                  "import androidx.core.graphics.Insets",
                  "import androidx.core.view.ViewCompat",
                  "import androidx.core.view.WindowInsetsCompat",
              ]
              for imp in needed:
                  if imp in src:
                      continue
                  imports = list(re.finditer(r"^import .*$", src, re.M))
                  if imports:
                      pos = imports[-1].end()
                  else:
                      mp = re.search(r"^package .*$", src, re.M)
                      pos = mp.end() if mp else 0
                      imp = ("\n\n" + imp) if pos else (imp + "\n")
                  src = src[:pos] + "\n" + imp + src[pos:]

              # 2) 在 super.onCreate(...) 之后注入 insets 监听（Kotlin/Java 均兼容）
              if f.suffix == ".kt":
                  listener = (
                      "        ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content)) { v, insets ->\n"
                      "            val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars())\n"
                      "            v.setPadding(bars.left, bars.top, bars.right, bars.bottom)\n"
                      "            insets\n"
                      "        }\n"
                  )
              else:
                  listener = (
                      "        ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content),\n"
                      "                (v, insets) -> {\n"
                      "                    Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n"
                      "                    v.setPadding(bars.left, bars.top, bars.right, bars.bottom);\n"
                      "                    return insets;\n"
                      "                });\n"
                  )

              pat = re.compile(r"super\.onCreate\s*\([^)]*\)\s*;?")
              if not pat.search(src):
                  raise SystemExit("::error::MainActivity 中未找到 super.onCreate 调用，模板可能已变化，请人工确认")
              src = pat.sub(lambda m: m.group(0) + "\n" + listener, src, count=1)

              f.write_text(src, encoding="utf-8")
              print(f"已改写 {f}（内容视图按系统栏 insets 内缩，避免顶部通栏遮挡）")

          # 确保 androidx.core 可用（模板的 androidx.activity/appcompat 一般已传递引入；
          # 兜底：gradle 中既无 androidx.core 也无 appcompat 时补一行依赖）
          for gname in ("build.gradle.kts", "build.gradle"):
              g = pathlib.Path("gen/android/app") / gname
              if not g.exists():
                  continue
              t = g.read_text(encoding="utf-8")
              if ("androidx.core" in t) or ("appcompat" in t):
                  print(f"{gname} 已含 androidx.core/appcompat 依赖")
                  break
              t2, n = re.subn(r"(dependencies\s*\{)",
                              lambda mm: mm.group(1) + '\n    implementation("androidx.core:core-ktx:1.9.0")',
                              t, count=1)
              if n:
                  g.write_text(t2, encoding="utf-8")
                  print(f"{gname} 已补充 androidx.core 依赖")
              break
          PY

      - name: Allow cleartext HTTP (localhost proxy)
        # 应用通过本地反向代理加载 http://127.0.0.1:<port>；Android 9+ 默认禁止明文 HTTP，
        # release 构建的 usesCleartextTraffic 默认为 false，必须置 true 否则鉴权代理真机上加载失败。
        run: |
          sed -i -E 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' gen/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" gen/android/app/src/main/AndroidManifest.xml

      - name: 设置 Android 产物文件名（APK 文件名 ← app_name）
        # 默认 Tauri 模板的 APK 产物名是通用的 app-universal-release-unsigned.apk。
        # 这里把 gradle 的 archivesBaseName 设为 app_name，让最终签名后的 APK 文件名
        # 带上应用名（如 MyApp-universal-release-unsigned.apk），下载时一目了然。
        # 同时去掉 Windows 文件名非法字符，保证产物路径稳定。
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          name = (os.environ.get("APP_NAME", "") or "").strip()
          if not name:
              print("未配置 app_name，APK 沿用默认文件名")
              raise SystemExit(0)
          # 去掉文件名非法字符，压缩空白，去首尾空格/句点
          safe = re.sub(r'[\\/:*?"<>|]+', "_", name)
          safe = re.sub(r"\s+", " ", safe).strip(" .")
          if not safe:
              safe = "Web2App"

          g = pathlib.Path("gen/android/app/build.gradle.kts")
          if not g.exists():
              g = pathlib.Path("gen/android/app/build.gradle")
          if not g.exists():
              print("::warning::未找到 app/build.gradle(.kts)，跳过 APK 重命名")
              raise SystemExit(0)

          src = g.read_text(encoding="utf-8")

          # 已在别处设置过 archivesBaseName / archivesName 则跳过
          if re.search(r'(archivesBaseName|base\s*\.\s*archivesName)', src):
              print("build.gradle 已设置 archivesBaseName，跳过")
              raise SystemExit(0)

          # 在 android { ... } 块内注入 base.archivesName（AGP 7.4+ 推荐写法；
          # 若模板不支持 base 命名空间则回退到 archivesBaseName）。
          # 找 android { 块的开头。
          m = re.search(r'(^|\n)(\s*)android\s*\{', src)
          if not m:
              # 没有 android 块（不太可能），退而求其次在文件末尾追加
              src = src.rstrip() + f'\narchivesBaseName = "{safe}"\n'
          else:
              indent = m.group(2) + "    "
              inject = f'\n{indent}base {{ archivesName.set("{safe}") }}\n'
              pos = m.end()
              src = src[:pos] + inject + src[pos:]

          g.write_text(src, encoding="utf-8")
          print(f"APK 产物名 → {safe}（build.gradle 已注入 archivesName）")
          PY

      - name: 开启 gradle 错误栈（便于定位 assemble 失败原因）
        # 把 org.gradle.stacktrace=all 写进 gen/android/gradle.properties，
        # 若 APK 构建失败，gradle 会直接打印完整错误栈（e: 编译错误 / 资源链接错误等），
        # 省去"BUILD FAILED"尾部看不出根因的麻烦。
        # 关键：必须先确保文件末尾有换行，否则 echo >> 会把内容粘到上一行——
        # 曾因此把 stacktrace=all 粘到 android.nonFinalResIds=false 后面，
        # 导致 gradle 报 "Cannot parse ... android.nonFinalResIds='falseorg.gradle.stacktrace=all'"。
        run: |
          gp="gen/android/gradle.properties"
          mkdir -p "$(dirname "$gp")"
          touch "$gp"
          # 末尾无换行则补一个，防止新行粘到上一行
          [ -z "$(tail -c1 "$gp" 2>/dev/null)" ] || printf '\n' >> "$gp"
          grep -q "org.gradle.stacktrace" "$gp" || echo "org.gradle.stacktrace=all" >> "$gp"
          echo "--- gradle.properties ---"; cat "$gp"

      - name: Build Android APK
        # --apk 仅产出 APK（便于直接安装测试）；若要上架 Play Store 的 AAB，去掉 --apk 即可。
        # 注意：tauri-cli 的 --target 只接受架构名（aarch64/armv7/i686/x86_64），
        # 不是 rustup 的完整三元组 aarch64-linux-android。
        # release APK 默认【未签名】，直接安装会提示"无证书/无法安装"，需下一步 zipalign+apksigner 签名。
        run: cargo tauri android build --target aarch64 --apk

      - name: 签名 APK（release 包默认未签名，不签名无法安装）
        # 签名密钥三级策略：
        #   1) 配置 JSON 里提供了 android_keystore_base64 等 → 用 JSON 的 keystore 签名
        #      （适合"每个应用各自一把正式密钥"，随配置一起分发）；
        #   2) 配置了仓库 secrets（ANDROID_KEYSTORE_BASE64 等）→ 用正式 keystore 签名，
        #      各次构建可互相覆盖升级（长期使用/上架建议这种方式）。
        #   3) 都没有 → 现场用 keytool 生成一次性 keystore 签名。能正常安装使用，
        #      但每次构建的签名不同，新版无法覆盖安装旧版（需先卸载）。
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $build_tools"

          # 1) JSON 提供的 keystore（解析配置步骤已解码落盘并注入 ANDROID_KEYSTORE_* 变量）
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "${ANDROID_KEYSTORE_PATH:-}" ]; then
            if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::JSON 配置了 keystore 但缺少 alias/密码（解析步骤应已校验，请检查配置）"; exit 1
            fi
            echo "使用 JSON 配置的 keystore 签名"
            keystore="$ANDROID_KEYSTORE_PATH"
            storepass="$ANDROID_KEYSTORE_PASSWORD"
            keypass="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            alias="$ANDROID_KEY_ALIAS"
          # 2) 仓库 secrets 提供的正式 keystore
          elif [ -n "$KS_BASE64" ]; then
            if [ -z "${KS_ALIAS:-}" ] || [ -z "${KS_STORE_PASS:-}" ]; then
              echo "::error::配置了 ANDROID_KEYSTORE_BASE64 时，ANDROID_KEY_ALIAS 和 ANDROID_KEYSTORE_PASSWORD 也必须配置"; exit 1
            fi
            echo "使用 secrets 中的正式 keystore 签名"
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            storepass="$KS_STORE_PASS"
            keypass="${KS_KEY_PASS:-$KS_STORE_PASS}"
            alias="$KS_ALIAS"
          # 3) 一次性 CI keystore
          else
            echo "::warning::未配置签名信息，使用一次性 CI keystore 签名（可安装，但跨构建无法覆盖升级）"
            keystore="$RUNNER_TEMP/ci.keystore"
            keytool -genkeypair -keystore "$keystore" -alias web2app-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidci -keypass androidci \
              -dname "CN=web2app-ci, OU=CI, O=web2app"
            storepass="androidci"
            keypass="androidci"
            alias="web2app-ci"

            # 把这次一次性 keystore 及其密码/base64/配置打包成 artifact（参考 generate-signing-key.yml），
            # 让用户下载保存后，之后能"用同一把密钥"继续签名，实现跨构建覆盖升级。
            # 否则这把一次性密钥只在本次 job 内存在，run 结束后就丢失，之后再也无法覆盖升级。
            # 这里用独立的 python3 写文件（用 <<'PY' 顶格 heredoc 需重开 run 步骤，故改用 -c 单行），
            # 避免在 bash 的 if/else 块里再嵌 heredoc 导致的缩进/YAML 块标量冲突。
            PKG="$RUNNER_TEMP/android-signing-key"
            mkdir -p "$PKG"
            cp "$keystore" "$PKG/release.keystore"
            ks_b64=$(base64 -w0 "$keystore")
            APP_URL_VAL="${APP_URL:-}"
            APP_NAME_VAL="${APP_NAME:-Web2App}"
            TITLE_VAL="${TITLE:-$APP_NAME_VAL}"
            PKG="$PKG" ALIAS="$alias" STORE="$storepass" KS_B64="$ks_b64" \
            APP_URL_VAL="$APP_URL_VAL" APP_NAME_VAL="$APP_NAME_VAL" TITLE_VAL="$TITLE_VAL" \
            python3 -c '
          import json, os, sys, datetime
          pkg = os.environ["PKG"]
          alias = os.environ["ALIAS"]
          storepass = os.environ["STORE"]
          ks_b64 = os.environ["KS_B64"]
          app_url = os.environ["APP_URL_VAL"]
          app_name = os.environ["APP_NAME_VAL"]
          title = os.environ["TITLE_VAL"]
          cfg = {
              "app_url": app_url,
              "app_name": app_name,
              "title": title,
              "icon_url": "",
              "proxy_enabled": "false",
              "proxy_http": "",
              "proxy_https": "",
              "proxy_bypass": "",
              "data_dir_default": "false",
              "android_keystore_base64": ks_b64,
              "android_key_alias": alias,
              "android_keystore_password": storepass,
              "android_key_password": "",
          }
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          info = [
              "本次打包使用【一次性 CI keystore】签名（因为未提供 JSON/Secrets 签名）",
              "======================================================",
              "生成时间 : " + now,
              "文件     : release.keystore（请长期保存）",
              "alias    : " + alias,
              "storepass: " + storepass,
              "keypass  : " + storepass + "   （与 storepass 相同；android_key_password 留空即可）",
              "",
              "keystore base64（单行，供填入 android_keystore_base64 / Secrets）:",
              ks_b64,
              "",
              "【使用提醒】",
              "1) 本次 APK 是用这把 keystore 签的；若以后想覆盖升级，就必须继续用这一把。",
              "2) 请把 release.keystore + 上面的密码一起备份到安全处。",
              "3) 更省心：直接改用 generate-signing-key.yml 生成一把正式密钥，",
              "   或用下面的 packaging-config.single.json 在下次打包时带上 base64/密码。",
          ]
          open(os.path.join(pkg, "keystore-info.txt"), "w", encoding="utf-8").write("\n".join(info) + "\n")
          open(os.path.join(pkg, "packaging-config.json"), "w", encoding="utf-8").write(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          open(os.path.join(pkg, "packaging-config.single.json"), "w", encoding="utf-8").write(json.dumps(cfg, ensure_ascii=False, separators=(",", ":")))
          print("已打包一次性签名材料到 " + pkg)
          '
          fi

          mkdir -p "$RUNNER_TEMP/signed"
          found=0
          shopt -s nullglob globstar
          for unsigned in gen/android/app/build/outputs/apk/**/*-unsigned.apk; do
            found=1
            base=$(basename "$unsigned" -unsigned.apk)
            aligned="$RUNNER_TEMP/aligned-$base.apk"
            signed="$RUNNER_TEMP/signed/$base-signed.apk"
            "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-pass "pass:$storepass" \
              --key-pass "pass:$keypass" \
              --ks-key-alias "$alias" \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify "$signed"
            echo "已签名: $signed"
          done
          if [ "$found" = "0" ]; then
            echo "::error::未找到 *-unsigned.apk，构建产物异常"
            find gen/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload 一次性签名材料（未提供签名时）
        # 仅当本次走的是"一次性 CI keystore"（JSON/Secrets 都未提供签名）时，
        # 才会上传这份签名材料，供用户下载保存、以便之后继续用同一把密钥覆盖升级。
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-key
          path: ${{ runner.temp }}/android-signing-key/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # artifact 名固定为 android-apk（内容为已签名、可直接安装的 APK）。
          name: android-apk
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error

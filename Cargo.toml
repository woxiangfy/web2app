[package]
name = "web2app"
version = "0.1.0"
description = "web2app — a desktop/mobile webview app (Rust + Tauri) that embeds a URL, minimizes to the system tray, and toggles with a global shortcut. Supports Windows (WebView2) and Android."
edition = "2021"
rust-version = "1.70"

# 多 crate 工作区：把纯加密核心（resolve-core）与命令行工具（resolve-tool）拆出，
# 使 resolve-tool 不必编译 Tauri 全量依赖（避免 Linux CI 上拉入 glib-sys 等系统库）。
#
# proxy-server 是 Electron 侧的 sidecar（bin 名 `w2a-proxy`），以 `#[path]` 复用本 crate 的
# src/proxy.rs 与 src/resolve.rs，零重写。它同样是本 workspace 的默认成员 ——
# `cargo build --release` 一次就把 GUI 与 sidecar 都编出来，手动打包时不必分开调用。
[workspace]
members = ["crates/resolve-core", "crates/resolve-tool", "crates/proxy-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 移动端（Android/iOS）要求库目标：Tauri 的 mobile_entry_point 需要在 lib 里导出，
# 并由移动端原生壳以 cdylib/staticlib 形式加载。桌面端 main.rs 通过 rlib 链接到 web2app_lib。
[lib]
name = "web2app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
url = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 纯加密核心（Ed25519 签名 + AES-256-GCM），与 resolve-tool 共用。拆成独立 crate 后，
# resolve-tool 只需链接它即可，不必编译本 crate 的 Tauri 全量依赖。
resolve-core = { path = "crates/resolve-core" }

# 本地反向代理（HTTP + WebSocket）所需依赖，用于绕过 WebView2 不对 WebSocket 触发
# WebResourceRequested / BasicAuthenticationRequested 的限制。proxy 模块是纯 Rust、零平台依赖，
# 因此 Windows 与 Android 共用同一份代码。
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
http-body-util = "0.1"
bytes = "1"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }

# 动态解析真实 URL（app_url 为域名数组时）：DNS TXT 查询 + Ed25519 验签 + AEAD 解密。
# DNS 查询在本 crate（依赖 tauri 异步运行时），加解密/验签逻辑在 resolve-core（纯 Rust）。
hickory-resolver = "0.26"

# 仅 Windows：调用 WebView2 原生 API 处理 Basic 鉴权。
# 版本必须与 Tauri 2.11.x 内部使用的 wry 一致（webview2-com 0.38 / windows 0.61），
# 否则 ICoreWebView2 等 COM 类型会因版本不同而编译失败。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Win32_UI_Shell / Win32_UI_Shell_Common：下载时弹系统「另存为」对话框（IFileSaveDialog），
# 见 `src/save_dialog.rs`。两者都不引入新的 crate，只是给同一个 windows crate 多开两个模块。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# Windows 沿用系统证书库（native-tls/schannel），与你当前可用的构建保持一致。
# `stream` feature：提供 Response::bytes_stream / Body::wrap_stream / Body::from_stream，
# 本地反向代理做流式转发（大文件不整块缓冲到内存）依赖它们。
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# 非 Windows（Android 等）：使用 rustls，便于交叉编译（无需系统 OpenSSL / NDK 之外的 C 依赖）。
# 注意：tokio-tungstenite 没有 `rustls-tls` 这个 feature（那是 reqwest 的），它对应的是
# `rustls-tls-native-roots` / `rustls-tls-webpki-roots`；这里用 webpki-roots（内置 Mozilla 根证书），
# 与 reqwest 的 `rustls-tls`（同样内置 webpki-roots）保持一致，便于 Android 交叉编译时无需依赖系统 CA 存储。
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# 桌面端专属插件：全局快捷键 / 单实例。Android / iOS 不支持（其底层依赖 global-hotkey 等
# 桌面库，无移动端实现），必须按平台 gate，否则交叉编译 Android 时这两个 crate 会编译失败。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# 仅 Windows 的验证工具（examples/probe_dom_ready.rs）：直接命中 tauri 内部同版本的
# wry / tao，用来实测「WebView2 注入脚本执行时 DOM 是否已存在」。仅测试目标使用，
# 不进发布产物。
[target.'cfg(windows)'.dev-dependencies]
wry = "0.55"
tao = "0.35"

[profile.release]
# 性能优先：CPU 密集路径（本地代理转发、Ed25519 验签 / AES-256-GCM 解密）按
# opt-level=3 优化。代价是 exe 体积比 opt-level="z"（体积优先）增大（约 5-10MB → 10-15MB），
# 已权衡取舍（代理流式转发本身已显著降低运行时内存，体积换 CPU 速度收益明确）。
opt-level = 3
lto = true
codegen-units = 1
strip = true
